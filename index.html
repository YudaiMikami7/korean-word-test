<style>
/* LINE Seed JP（公式配布woff2を同梱） */
@font-face{font-family:"LINESeedJP";src:url("fonts/LINESeedJP-Rg.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"LINESeedJP";src:url("fonts/LINESeedJP-Bd.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"LINESeedJP";src:url("fonts/LINESeedJP-Eb.woff2") format("woff2");font-weight:800;font-display:swap}
/* 韓国語は LINE Seed KR（JPにハングルが無いためフォールバックで適用） */
@font-face{font-family:"LINESeedKR";src:url("fonts/LINESeedKR-Rg.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"LINESeedKR";src:url("fonts/LINESeedKR-Bd.woff2") format("woff2");font-weight:700 800;font-display:swap}
:root{
  --bg:#000; --panel:#16181c; --panel2:#1f2125; --gray:#26282d; --gray-h:#33363c;
  --line:#2a2d33; --text:#f2f3f5; --mute:#FFFFFF; --faint:rgba(255,255,255,.78);
  --red:#ff3b3b; --blue:#2f8bff; --green:#4cd964; --gold:#ffc83c;
  --hs:.648; /* ホーム(602px基準)の縮小率。scaleHome()が実測値を入れる＝ホーム外でもステータスバーと同じ実寸を作れる */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"LINESeedJP","LINESeedKR","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo","Noto Sans CJK JP","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;justify-content:center}
.app{width:100%;max-width:602px;min-height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg);
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)} /* ノッチ/ホームバー回避 */

button{font-family:inherit;touch-action:manipulation} /* タップ遅延(300ms)とダブルタップズームを抑制 */
.hidden{display:none!important}

/* ===== screens ===== */
.screen{flex:1;display:none;flex-direction:column;min-height:0;position:relative;z-index:1} /* 玉レイヤー(z0)より前面 */
.screen.on{display:flex}

/* ===== top bar (quiz) ===== */
/* 問題番号・残り時間は白文字 */
.qbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;font-size:13px;color:#FFFFFF;font-weight:700;gap:12px}
.qbar{position:relative}
.qadv{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:transparent;border:none;color:#fff;font-size:11px;font-weight:800;padding:4px;cursor:pointer;visibility:hidden} /* タップで次への切替（画面中央・出題番号と同時に表示） */
.qsw{width:40px;height:22px;border-radius:999px;background:rgba(0,0,0,.35);position:relative;transition:background .2s;display:inline-block}
.qsw.on{background:#00C24E}
.qsw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.qsw.on i{left:20px}
.qhome{background:rgba(0,0,0,.8);border:none;color:#fff;width:32px;height:32px;font-size:16px;cursor:pointer;flex:0 0 auto}
.qbar .prog{letter-spacing:.5px}
.qbar .time{color:#FFFFFF;font-variant-numeric:tabular-nums;margin-left:auto;font-weight:800;font-size:14.3px} /* カウントダウンは1段太く(700→800)・1.1倍(13→14.3px) */
/* 進捗＝山吹色のメーターは廃止。正解するとキャラが1歩ぶん前へ進む（景色が右から左へ流れ、キャラ自身は歩いて見える）。
   背景は作り込まず、空＝ベタ1色＋地面のみの引き算デザイン（色数を減らして単語カードを主役にする） */
.pbar{position:relative;height:48px;margin:8px 18px 0;border-radius:10px;overflow:hidden;box-sizing:border-box;--rp:0;
  background:#CFE6F2}
.rn-ground{position:absolute;left:0;right:0;pointer-events:none;background-repeat:repeat-x;
  transition:background-position 1s cubic-bezier(.22,.85,.3,1)} /* --rp が増えるほど地面が左へ流れる＝前進 */
.rn-ground{bottom:0;height:10px;background-size:28px 10px;background-position:calc(var(--rp) * -92px) 0;
  background-image:repeating-linear-gradient(90deg,#7FB56B 0 14px,#6EA45B 14px 28px)}
.rn-char{position:absolute;left:30%;bottom:9px;width:29px;height:29px;transform:translateX(-50%);
  display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;
  filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.35));pointer-events:none}
.rn-char img{width:100%;height:100%;object-fit:contain;display:block}
/* 進む先には、この1本ぶんの単語カード（黄色い縦長の札）が等間隔に並んでいる。1問ごとに1枚ぶん左へ流れ、
   正解＝キャラのほうへ飛んできて獲得／不正解＝パンとはじけて消える。
   札に韓国語は書かない（答えが見えてしまうため）。画面には手前の6〜7枚だけが覗く（メール指示 2026-07-29） */
.rn-rail{position:absolute;left:30%;bottom:9px;height:28px;pointer-events:none;
  transition:transform .55s cubic-bezier(.22,.85,.3,1)}
.rn-slot{position:absolute;bottom:0;width:17px;height:26px;border-radius:4px;background:#F5C518;
  box-shadow:0 2px 4px rgba(0,0,0,.28);animation:rnCardIn .28s ease both;--fly:-120px}
.rn-slot.got{animation:rnCardGot .62s cubic-bezier(.3,.9,.3,1) forwards}
.rn-slot.pop{animation:rnCardPop .42s ease forwards}
.rn-slot.pop::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.9);
  animation:rnBurst .42s ease-out forwards}
@keyframes rnCardIn{0%{opacity:0;transform:translateX(14px)}100%{opacity:1;transform:none}}
@keyframes rnCardGot{0%{opacity:1;transform:none}
  70%{opacity:1;transform:translateX(calc(var(--fly) * .82)) translateY(-6px) scale(.6) rotate(-10deg)}
  100%{opacity:0;transform:translateX(var(--fly)) translateY(0) scale(.18) rotate(-14deg)}}
@keyframes rnCardPop{0%{opacity:1;transform:none}30%{opacity:1;transform:scale(1.3) rotate(4deg)}100%{opacity:0;transform:scale(.25) rotate(-6deg)}}
@keyframes rnBurst{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
.rn-char.step{animation:rnStep .62s ease-in-out}   /* 正解＝2歩ぶん、その場で歩く（前進は景色の流れで見せる） */
.rn-char.trip{animation:rnTrip .45s ease}          /* 不正解＝つまずいて進めない */
@keyframes rnStep{
  0%{transform:translateX(-50%) translateY(0) rotate(0)}
  22%{transform:translateX(-50%) translateY(-6px) rotate(9deg)}
  44%{transform:translateX(-50%) translateY(0) rotate(2deg)}
  68%{transform:translateX(-50%) translateY(-6px) rotate(-9deg)}
  88%{transform:translateX(-50%) translateY(0) rotate(-2deg)}
  100%{transform:translateX(-50%) translateY(0) rotate(0)}}
@keyframes rnTrip{0%,100%{transform:translateX(-50%) rotate(0)}30%{transform:translateX(-50%) rotate(-14deg)}70%{transform:translateX(-50%) rotate(9deg)}}
.tbar{height:7px;margin:1.5px 18px 0;background:rgba(0,0,0,.42);border-radius:4px;overflow:hidden;box-sizing:border-box} /* 緑メーターが減る出題バー。黄色バーと同じ太さ・枠線なし・間のマージンは半分 */
.tfill{height:100%;width:100%;background:#00FF37;transition:width .1s linear} /* 制限時間バーは緑（ホームのトンマナ）・黒枠内で減っていく */
.tfill.warn{background:#FFC400}

/* ===== question ===== */
.qstage{flex:1;display:flex;flex-direction:column;min-height:0}
.qmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8vh 20px 0;text-align:center}
.qword{font-size:clamp(34px,9vw,46px);font-weight:800;line-height:1.25;word-break:break-all;text-shadow:0 2px 6px rgba(0,0,0,.5),0 0 2px rgba(0,0,0,.4)} /* 白文字が背景色で埋もれないよう黒影 */
.qword.ja{font-weight:600}
/* 中断ダイアログを出している間は問題文を伏せる（ただの横棒にする）。
   タイマーも止まるので、そのまま眺めて考えてから再開する＝ズルができないように（メール指示 2026-07-29） */
#s-quiz.paused .qword,#s-quiz.paused .pz-ja,#s-quiz.paused .whint,#s-quiz.paused .shg-lead{color:transparent!important;text-shadow:none!important;position:relative}
#s-quiz.paused .qword::after,#s-quiz.paused .pz-ja::after,#s-quiz.paused .whint::after,#s-quiz.paused .shg-lead::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(62%,240px);height:.36em;min-height:10px;border-radius:999px;background:rgba(255,255,255,.62)}
#s-quiz.paused .pz-board,#s-quiz.paused .winput,#s-quiz.paused .shg-ja{visibility:hidden} /* 綴りが見えていると同じくズルになるので一緒に伏せる */
/* 出題の入場アニメ（書き取り等の問題文）：メニュー切り替えのように右からスッと出す（毎問リビルドで再生） */
@keyframes qEnter{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
#s-quiz .qstage .qmain{animation:qEnter .30s cubic-bezier(.33,1,.68,1) both}
/* 4択の問題文：ルームメニューの3面ローテーション（左下0%100%を軸に回転して入替）と同じく、左下を軸に回転しながら立ち上がる入場アニメ。選択肢(.qbottom)はアニメなしで即表示 */
@keyframes qRoomEnter{from{opacity:0;transform:rotate(60deg) scale(.32)}to{opacity:1;transform:rotate(0) scale(1)}}
#s-quiz .qstage:has(.qbottom){overflow:hidden} /* 回転スイープが横にはみ出して一瞬スクロールバーが出ないようクリップ(静止時はtransform無しで影響なし) */
#s-quiz .qstage .qmain:has(+ .qbottom){transform-origin:0% 100%;animation:qRoomEnter .5s cubic-bezier(.34,1.4,.5,1) both}
/* 単語と選択肢の間に表示する関連画像 */
.qimg{margin-top:3vh;display:flex;justify-content:center;width:100%}
.qimg img{width:min(80%,360px);max-height:24vh;object-fit:cover;border:1px solid var(--line);display:block;background:var(--panel)}
.qbottom{padding:0 18px calc(18px + env(safe-area-inset-bottom))}

/* choices */
.choices{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;touch-action:none} /* ドラッグ選択のためスクロールに奪われない */
.choice{position:relative;background:rgba(0,0,0,.8);border:none;border-radius:0;padding:18px;font-size:21px;font-weight:700;color:#fff;
  text-align:center;cursor:pointer;transition:background .12s,transform .08s,box-shadow .1s;min-height:60px;user-select:none;-webkit-user-select:none}
.choice.cand{box-shadow:inset 0 0 0 3px #FFD84D,0 0 18px 3px rgba(255,216,77,.85);background:rgba(0,0,0,.68);z-index:1} /* 指が触れている候補=黄色光彩 */
/* 日本語の語釈が長い選択肢は文字を詰めて、2行に折り返してもボタンからはみ出さないようにする */
.choice.len-l{font-size:18px;line-height:1.3}
.choice.len-xl{font-size:15.5px;line-height:1.28;padding:14px 12px}
.chspk{position:absolute;right:6px;top:50%;transform:translateY(-50%);opacity:.8;pointer-events:none;display:flex}
.oa-spkrow{display:flex;justify-content:center;margin:6px 0} /* 音声ボタンを正解の上に独立した列として置く */
.oa-spk{background:rgba(0,0,0,.55);border:none;border-radius:22px;height:42px;padding:0 16px;gap:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center} /* 書き取り正解の上の音声ボタン */
.oa-spktxt{color:#fff;font-size:14px;font-weight:800}
.cdown{display:flex;align-items:center;justify-content:center;height:60vh}
.cnum{font-size:170px;font-weight:900;color:#fff;line-height:1;animation:cpop .4s ease}
@keyframes cpop{from{transform:scale(1.8);opacity:.15}to{transform:scale(1);opacity:1}}
/* ホーム画面のまま、中央のメイン画像を消してその場に3・2・1を出すカウントダウン層（黒オーバーレイは廃止／スタート→ここで3・2・1→終わってからクイズへ遷移） */
.home-cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;animation:cdfade .22s ease;pointer-events:none}
.home-cd .cnum{font-size:210px;text-shadow:0 8px 26px rgba(0,0,0,.32)}
@keyframes cdfade{from{opacity:0}to{opacity:1}}
.home-wrap.counting .slide-img,.home-wrap.counting .room-ph,.home-wrap.counting .pq-main{opacity:0;transition:opacity .28s ease} /* スタート押下で中央画像を消し、空いたその場所にカウントダウンが出る */
.home-wrap.counting .start-button{z-index:8} /* 戻るボタンはカウントダウン層より前面でタップ可能に */
.choice:active{transform:scale(.98);background:rgba(0,0,0,.65)}
/* 回答後のハイライト：正解=赤 / 選んだ誤答=青 / その他=暗い灰色のまま。色は20%薄く(不透明度.8)、視認性は維持 */
.choice.correct{background:rgba(255,59,59,.8);color:#fff}
.choice.wrong{background:rgba(47,139,255,.8);color:#fff}
.choice.elim{opacity:.3;pointer-events:none;transition:opacity .35s ease} /* 時間経過で選べなくなる不正解（消さずに半透明のまま残す・50/50風ヒント） */
.choice.elim.spk-on{opacity:.62;pointer-events:auto} /* 回答後は薄い選択肢もタップで発音できる（次へは進まない） */

/* 正解単語が降り積もる背景レイヤー（UIより背面・操作は透過） */
#s-quiz{position:relative}
#s-quiz .qbar,#s-quiz .pbar,#s-quiz .tbar,#s-quiz .qstage{position:relative;z-index:1} /* 出題UIは常に降下レイヤーより前面 */
.q-rain{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#home-rain{top:-225px;height:1178px;z-index:0;opacity:.42;transition:opacity .3s ease} /* ホームの玉レイヤー：背景で主張しすぎないよう半透明に。現在ROOMのslide-inner最背面に挿入 */
.home-wrap.status #home-rain,.home-wrap.hiderail #home-rain{opacity:0}
.qr-ball{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.55);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.15);
  display:flex;align-items:center;justify-content:center} /* 白半透明の丸カプセル（will-changeはJSで落下中のみ付与） */
.qr-ball img{width:72%;height:72%;object-fit:contain;pointer-events:none}

/* unknown btn */
.unknown{display:block;margin:0 auto;background:rgba(0,0,0,.8);border:none;color:#fff;
  font-size:13px;font-weight:600;padding:9px 22px;border-radius:0;cursor:pointer}
.unknown:active{background:rgba(0,0,0,.65)}

/* ===== overlay symbol ===== */
/* 横:中央 / 縦:中央から画面高の20%上へ / 大きさ1.3倍(46→60vw) / 線2倍(font-weight倍+text-stroke) / 透明度.6維持 */
/* 四択は選択肢の色を見せたいので背景は透明。書き取りは比較テキストを読ませるため暗幕を付ける */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:300;pointer-events:auto;background:transparent}
.overlay.backdrop{background:rgba(0,0,0,.72)}
.tap-next{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);animation:bob 1.4s ease-in-out infinite}
/* 大きさ-10%(60→54vw) / 線+20%(1.4→1.68, 1.2→1.44vw) / 縦は5%下へ(-20→-15vh) / 横中央・透明度.6維持 */
.ovsym{font-size:54vw;line-height:1;font-weight:600;opacity:.6;transform:translateY(-15vh);pointer-events:none} /* 装飾記号がボタン等のタップを遮らないように */
.ovsym.o{color:var(--red);-webkit-text-stroke:1.68vw var(--red);text-stroke:1.68vw var(--red)}
.ovsym.x{color:var(--blue);font-weight:400;-webkit-text-stroke:1.44vw var(--blue);text-stroke:1.44vw var(--blue)}
.ovsym.u{color:rgba(255,255,255,.9);font-weight:400;-webkit-text-stroke:1.2vw rgba(255,255,255,.9);text-stroke:1.2vw rgba(255,255,255,.9)} /* わからない=－ */
.ovsym.t{color:#DFB10F;font-weight:400;-webkit-text-stroke:1.44vw #DFB10F;text-stroke:1.44vw #DFB10F} /* 時間切れ=△ */
/* 書き取りの正誤比較：入力=青文字 / 正解=赤文字。問題と選択肢の間（画面中央）に配置 */
.ovans{position:absolute;left:0;right:0;top:30%;transform:translateY(-50%);text-align:center;padding:0 18px;pointer-events:none}
.ovans .oa-spk{pointer-events:auto} /* 音声ボタンだけタップ可能（親はpointer-events:none） */
.ovans .oa-row{margin:8px 0}
.ovans .oa-lab{color:var(--mute);font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:2px}
.ovans .oa-ko{font-size:clamp(38px,10vw,54px);font-weight:800;line-height:1.25;word-break:break-all}
.ovans .oa-ko.correct{color:var(--red)}
.ovans .oa-ko.wrong{color:var(--blue)}

/* ===== writing ===== */
.winput{margin:-5vh 18px 0;min-height:58px;background:var(--panel);border:1px solid var(--line);border-radius:0;
  display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;letter-spacing:1px;padding:10px}
.wcaret{display:inline-block;width:2px;height:30px;background:var(--text);margin-left:2px;animation:blink 1s steps(1) infinite;vertical-align:middle}
@keyframes blink{50%{opacity:0}}
/* 成績連動ヒント（先頭1音節）。ボタンではなく自動表示 */
.whint{color:#FFFFFF;font-size:15px;font-weight:700;margin-top:12px}
.whint b{font-size:22px;margin-left:3px}
/* 韓国語キーボードは画面下部に固定。PCでは中央寄せ＋最大幅でアプリ幅に揃える */
.korean-keyboard{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:602px;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:50}
.krow{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.key{flex:1;min-width:0;background:var(--gray);border:none;border-radius:0;color:var(--text);font-size:22px;font-weight:600;
  padding:13px 0;cursor:pointer;min-height:46px}
.key:active{background:var(--gray-h)}
.key.wide{flex:1.5}
.key.fn{background:var(--panel2);color:var(--mute);font-size:13px;font-weight:700}
.key.shifton{background:var(--gray-h);color:var(--text);border:1px solid var(--line)}
/* 操作行：わからない(左) / 回答する(中央・大・緑) / ⌫(右) */
.krow.ctrl .key{font-size:13px;font-weight:700;padding:13px 0}
.key.send{flex:2;background:var(--green);color:#06280f;border:none;font-size:16px;font-weight:800}
.key.send:active{background:#3fbf55}
.key.dontknow{background:var(--gray);border:1px solid var(--line);color:var(--text)}
/* 濃音・合成母音の専用行（下2行=上から4,5行目）：中央寄せ・縦幅は従来の約75%へさらに圧縮（v2.123：40→約30px） */
.krow.extra{justify-content:center}
.krow.extra .key.ex{flex:0 1 48px;max-width:56px;background:var(--panel2);color:var(--text);padding:3px 0;min-height:20px;line-height:1.1}

/* ===== home ===== */
.home{padding:0 22px;flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.home h1{font-size:30px;font-weight:800;margin:0;text-align:center}
.home .sub{color:var(--mute);font-size:14px;text-align:center;line-height:1.7;margin:-4px 0 18px}
.home .ver{color:var(--faint);font-size:11px;font-weight:700;text-align:center;letter-spacing:1px;margin-top:14px}

/* ===== タイプ診断（V2.1: コード＋キャラクターのみの引き算デザイン） ===== */
/* ===== ホーム（602×1178基準・サーモンピンク背景・絶対配置） ===== */
#s-home{background:#E3A38D;flex-direction:row;justify-content:center;align-items:flex-start;overflow:hidden;transition:background-color .5s ease}
.home-wrap{position:relative;flex:0 0 auto;width:602px;height:1178px;background:#E3A38D;
  /* 今日の5問／トレンドのフロート位置：スライド(.slide-inner top:225px/height:686px)の下端12pxと同じ高さ
     ＝1178-(225+686)+12=279px。単語帳への上昇(--lift)・ステータスへの下降(--down×2.2)には従来どおり追従する */
  --fbtm:calc(279px - var(--lift,0px) - var(--down,0px) * 2.2);
  transform-origin:top center;color:#FFFFFF;font-weight:800; /* 見本はExtraBold相当 */
  transition:background-color .5s ease;
  font-family:"LINESeedJP","LINESeedKR","Hiragino Kaku Gothic ProN",sans-serif}
/* バー：暗いトラック＋内側に角丸フィル（見本準拠） */
.home-wrap .gauge,.dash-head .gauge{position:absolute;background:#333333;border-radius:999px;padding:3px;box-sizing:border-box;z-index:2}
.home-wrap .gfill,.dash-head .gfill{height:100%;border-radius:999px;transition:width .5s ease;width:0}
/* ステータスバーのPWRメータ：最大値→0へ徐々に減り、それを繰り返すドレイン演出（数値は実PWRを別途表示） */
#hv-pwrfill{transition:none;animation:pwrDrain 10s linear infinite}
#hv-pwrfill.pwr0{animation:none;width:0} /* PWRが0のときは「減り続ける」演出を止める（減るものが無いのに減って見えるため） */
@keyframes pwrDrain{0%{width:100%}100%{width:0%}}
/* ヘッダー（さらに上へ。茶色領域は黒80%透過。4色ドットは廃止） */
.avatar-circle{position:absolute;left:40px;top:44px;width:114px;height:114px;border-radius:50%;background:#fff;border:5px solid rgba(0,0,0,.8);box-sizing:border-box;overflow:hidden;cursor:pointer;z-index:2} /* 背景=タイプ/PWRページと同じグレー */
.avatar-image{width:100%;height:100%;object-fit:contain;padding:12px;box-sizing:border-box}
/* アバター：キャラクター⇄MBTI(4文字2行・軸カラー) を一定時間で回転入替 */
.avatar-circle .avatar-image{transition:transform .5s ease,opacity .4s ease;backface-visibility:hidden}
.avatar-mbti{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotateY(90deg);opacity:0;transition:transform .5s ease,opacity .4s ease;backface-visibility:hidden}
.avatar-mbti .am-line{display:flex;gap:3px;line-height:1}
.avatar-mbti .am-line span{font-size:34px;font-weight:900}
.avatar-job{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-sizing:border-box;font-size:13px;font-weight:900;color:#333;line-height:1.15;transform:rotateY(90deg);opacity:0;transition:transform .5s ease,opacity .4s ease;backface-visibility:hidden}
.avatar-circle.show-mbti .avatar-image,.avatar-circle.show-job .avatar-image{transform:rotateY(90deg);opacity:0}
.avatar-circle.show-mbti .avatar-mbti{transform:rotateY(0);opacity:1}
.avatar-circle.show-job .avatar-job{transform:rotateY(0);opacity:1}
.hv-level{position:absolute;left:176px;top:44px;display:flex;align-items:baseline;gap:3px;line-height:1;z-index:2;font-size:20px}
.hv-level span{font-size:38px}
.hv-code{position:absolute;right:47px;top:39px;font-size:40px;letter-spacing:1px;line-height:1;cursor:pointer;z-index:2;display:flex;align-items:center;gap:5px} /* 数字上端がLv.数字(top44)と揃う位置：39+(50-40)/2=44 */
.streak-fire{width:50px;height:50px;object-fit:contain;display:block}
#hv-pwrdown{position:absolute;left:166px;top:153px;width:403px;text-align:center;font-size:16px;font-weight:700;color:#fff;z-index:2;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5);transition:opacity .28s ease}
#hv-nextrev{position:absolute;left:166px;top:176px;width:403px;text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.92);z-index:2;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.5);transition:opacity .28s ease}
/* ルーム切替中に出るルーム番号の丸ページャー（復習どき/カウントダウンはフェードで隠す・選択中を中央に） */
#room-pager{position:absolute;left:0;right:0;top:150px;box-sizing:border-box;z-index:4;display:flex;gap:9px;align-items:center;overflow-x:auto;padding:5px 16px;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .28s ease}
#room-pager::-webkit-scrollbar{display:none}
#room-pager.on{opacity:1;pointer-events:auto}
.home-wrap.pager-on #hv-pwrdown,.home-wrap.pager-on #hv-nextrev{opacity:0;pointer-events:none}
/* 丸座布団なし・数字に影のデザイン */
.rp-dot{flex:0 0 auto;min-width:30px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff;cursor:pointer;text-shadow:0 2px 4px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.55);transition:transform .18s ease}
.rp-dot.cur{transform:scale(1.55);text-shadow:0 3px 7px rgba(0,0,0,.75),0 0 3px rgba(0,0,0,.6)}
.rp-dot.pq{font-size:19px}
.home-side-btn img{width:74%;height:74%;object-fit:contain;pointer-events:none;display:block;margin:auto}
.status-panel{position:absolute;left:166px;top:83px;width:403px;height:64px;border-radius:32px;background:rgba(0,0,0,.8);z-index:1;cursor:pointer}
.hv-lab,.hv-xpg,.hv-pwrg{pointer-events:none}
.hv-lab{position:absolute;font-size:18px;line-height:19px;z-index:2}
.hv-xplabel{left:175px;top:92px;width:80px;text-align:right}
.hv-xpg{left:263px;top:92px;width:178px;height:19px}
.hv-xpval{left:450px;top:92px}
.hv-pwrlabel{left:175px;top:120px;width:80px;text-align:right}
.hv-pwrg{left:263px;top:120px;width:178px;height:19px}
.hv-pwrval{left:450px;top:120px}
/* ROOM選択：ROOM情報＋ジオラマを丸ごと左右スワイプ（番号やパラメータも一緒にスクロール）。
   コンテナは全幅＝画像は画面の端で見切れる */
/* スライドは全画面高＋ROOM色の背景：スワイプで「色の区切れ目」が指と一緒に移動する */
.room-scroll{transform:translateY(calc(var(--down,0px)*2.2));transition:transform .4s ease;position:absolute;left:0;top:0;width:602px;height:1178px;display:flex;overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:0}
.room-scroll::-webkit-scrollbar{display:none}
.room-slide{position:relative;flex:0 0 602px;width:602px;height:1178px;scroll-snap-align:start}
.slide-inner{position:absolute;left:0;top:225px;width:602px;height:686px} /* 帯拡大に伴い30px上へ */
/* ROOMパラメータ（ラベル/番号・語数/バー/%の間に余白。ランクD,B=36px・A=98pxで下端揃え） */
.rmenu-bg{position:absolute;left:40px;top:-12px;width:522px;height:116px;background:rgba(255,255,255,.15);border-radius:999px;cursor:pointer} /* 縦幅=旧174の2/3 */
.hv-roomlabel{position:absolute;left:83px;top:2px;font-size:21px;letter-spacing:.5px;line-height:1;cursor:pointer}
.hv-roomno{position:absolute;left:72px;top:28px;font-size:72px;line-height:1;cursor:pointer}
.hv-learned{position:absolute;left:244px;top:7px;font-size:27px;line-height:1;color:#FFFFFF}
.hv-roompwr{position:absolute;left:244px;top:51px;font-size:32px;line-height:1;color:#FFFFFF}
.hv-learned .unit{font-size:16px;margin-left:4px}
.hv-roompwr .unit{font-size:19px;margin-left:4px}
.hv-wordsg{left:238px;top:37px;width:89px;height:10px;padding:2px}
.hv-roomg{left:238px;top:88px;width:89px;height:10px;padding:2px}
/* ルームメニューの2本のバーは伸びる動きを付けない（アニメ廃止。ステータス欄のバーは従来どおり） */
.hv-wordsg .gfill,.hv-roomg .gfill{transition:none}
/* ランクの下端(146)を下段バー(132+14=146)・ROOM番号の字面下端と一致させる */
.rank-s{position:absolute;left:363px;top:72px;width:30px;height:30px;border-radius:50%;background:#555;
  display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;z-index:1}
.rank-s1{left:389px}
.rank-b{position:absolute;left:442px;top:15px;width:78px;height:78px;border-radius:50%;background:#555;
  display:flex;align-items:center;justify-content:center;font-size:62px;line-height:1;z-index:2}
/* ルームメニューのランクを結果と同じメダル風（金リング＋光沢）に。※登場ポップはルームメニューのアニメ廃止で削除 */
.rank-b,.rank-s{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 4px rgba(255,196,0,.9),0 3px 8px rgba(0,0,0,.3)}
.rank-b::after,.rank-s::after{content:"";position:absolute;inset:3px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);pointer-events:none}
/* ルームメニュー領域のクリップ：3面ローテのアニメが座布団の外にはみ出て描画されないように（座標は不変） */
.rmenu-clip{position:absolute;inset:0;z-index:2;clip-path:inset(-12px 40px calc(100% - 104px) 40px round 56px)}
/* ROOMメニュー（カプセル）の外側・左右に置く「隣のページへ」矢印。
   スライドの中ではなくhome-wrap直下に1組だけ置くフロート＝難易度・プリQQ・どのROOMでも同じ位置に出る。
   top=225(slide-innerの位置)+14(従来のtop)。単語一覧モードのメニュー上昇には--liftで追従する */
.rm-arrow{position:absolute;top:calc(239px + var(--lift,0px));width:36px;height:76px;z-index:6;border:none;padding:0;background:transparent;
  font-size:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;
  transition:transform .08s ease,top .35s ease,opacity .25s ease}
.rm-arrow::before{content:"";display:block;width:0;height:0;border-style:solid} /* 三角だけ。座布団と影は付けない */
.rm-prev::before{border-width:14px 17px 14px 0;border-color:transparent rgba(255,255,255,.95) transparent transparent}
.rm-next::before{border-width:14px 0 14px 17px;border-color:transparent transparent transparent rgba(255,255,255,.95)}
.rm-arrow:active{transform:scale(.84)}
/* まだ1度もROOMを切りかえていない間だけ、矢印を左右に揺らして「ここは横に動く」と伝える
   （動かすのは中の三角＝::beforeだけ。ボタン自体は動かさないのでタップ位置がぶれない） */
.home-wrap.roomhint-on .rm-prev::before,.home-wrap.roomhint-on #room-hint .rh-l::before{animation:rmNudgeL 1.7s ease-in-out infinite}
.home-wrap.roomhint-on .rm-next::before,.home-wrap.roomhint-on #room-hint .rh-r::before{animation:rmNudgeR 1.7s ease-in-out infinite}
@keyframes rmNudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
@keyframes rmNudgeR{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
/* スワイプの案内。左右の三角は .rm-arrow と同じ幅(36px)・同じ左右位置(4px)に置いて縦に並ぶよう揃える
   （メール指示 2026-07-29）。文字だけを黒カプセルに載せ、5秒たてば自然に消える */
#room-hint{position:absolute;left:4px;right:4px;top:calc(158px + var(--lift,0px));z-index:6;
  display:flex;align-items:center;justify-content:space-between;
  pointer-events:none;transition:opacity .35s ease,top .35s ease}
#room-hint .rh-a{flex:0 0 36px;width:36px;display:flex;align-items:center;justify-content:center}
#room-hint .rh-a::before{content:"";display:block;width:0;height:0;border-style:solid}
#room-hint .rh-l::before{border-width:11px 13px 11px 0;border-color:transparent rgba(255,255,255,.95) transparent transparent}
#room-hint .rh-r::before{border-width:11px 0 11px 13px;border-color:transparent transparent transparent rgba(255,255,255,.95)}
#room-hint .rh-t{flex:0 1 auto;background:rgba(0,0,0,.72);color:#fff;font-size:20px;font-weight:900;
  padding:9px 20px;border-radius:999px;white-space:nowrap}
#room-hint.off{opacity:0}
.home-wrap.status #room-hint,.home-wrap.hiderail #room-hint,.home-wrap.pager-on #room-hint{opacity:0}
.rm-prev{left:4px}
.rm-next{right:4px}
.rm-arrow.off{opacity:0;pointer-events:none} /* 端のスライドでは、それ以上進めない側を消す */
/* プリQQは背景が淡いので三角を濃いピンクに（他スライドは白のまま） */
.home-wrap.pq-active .rm-prev::before{border-right-color:#c04ea0}
.home-wrap.pq-active .rm-next::before{border-left-color:#c04ea0}
.home-wrap.status .rm-arrow,.home-wrap.hiderail .rm-arrow{opacity:0;pointer-events:none}
/* ルームメニューの3面ローテーション：語数/％/ランク(face0) ⇄ おすすめ単語 ⇄ PWRグラフ。
   ※メール指示（2026-07-29）でルームメニューのアニメーションは完全に廃止。回転の transition を外し、
     ローテーション自体も止めている（JS: ROOM_RECO_ROTATE）。この2面は常に非表示のまま */
.rmenu-reco,.rmenu-pwr{position:absolute;left:220px;top:-10px;width:328px;height:120px;display:flex;flex-direction:column;justify-content:center;padding:0 12px;box-sizing:border-box;transform-origin:0% 100%;transform:rotate(60deg) scale(.32);opacity:0;pointer-events:none;z-index:3}
/* PWRメータ面は右端をさらに内側へ寄せてルームメニューからはみ出さないように */
.rmenu-pwr{width:292px;padding-right:26px}
/* おすすめ単語面：左に画像・右にテキスト（横並び・左端寄せ） */
.rmenu-reco{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px}
.rr-img{width:86px;height:86px;object-fit:contain;flex:0 0 auto}
.rr-txt{display:flex;flex-direction:column;min-width:0}
/* ROOM番号と右側領域のマージンを半分に（通常ルームのみ。プリQQは従来位置のまま） */
.room-slide:not(.pq-slide) .hv-learned,.room-slide:not(.pq-slide) .hv-roompwr{left:206px}
.room-slide:not(.pq-slide) .hv-wordsg,.room-slide:not(.pq-slide) .hv-roomg{left:200px}
.room-slide:not(.pq-slide) .rank-s{width:45px;height:45px;font-size:30px;top:48px;left:300px} /* 1,2前のランクを1.5倍に。下端(48+45=93)を直近rank-b(15+78=93)にそろえる */
.room-slide:not(.pq-slide) .rank-s1{left:345px}
.room-slide:not(.pq-slide) .rank-b{left:390px} /* 1,2前と直近の隙間を詰める */
.room-slide:not(.pq-slide) .rmenu-reco,.room-slide:not(.pq-slide) .rmenu-pwr{left:182px}
.slide-inner.face-word .rmenu-reco{transform:rotate(0) scale(1);opacity:1}
.slide-inner.face-pwr .rmenu-pwr{transform:rotate(0) scale(1);opacity:1}
.rr-ko{font-size:54px;font-weight:900;color:#fff;line-height:1;white-space:nowrap}
.rr-ja{font-size:19px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}
/* 語数/％/ランク/メータ類：他面表示中は、おすすめ/PWR面と同じ左下軸の回転で退避（3面で統一）
   ※アニメ廃止に伴い transition は削除。ローテーションを戻すときはここも戻す */
.hv-learned,.hv-wordsg,.hv-roompwr,.hv-roomg,.rank-b,.rank-s{transform-origin:0% 100%}
.slide-inner.face-word .hv-learned,.slide-inner.face-word .hv-wordsg,.slide-inner.face-word .hv-roompwr,.slide-inner.face-word .hv-roomg,.slide-inner.face-word .rank-b,.slide-inner.face-word .rank-s,
.slide-inner.face-pwr .hv-learned,.slide-inner.face-pwr .hv-wordsg,.slide-inner.face-pwr .hv-roompwr,.slide-inner.face-pwr .hv-roomg,.slide-inner.face-pwr .rank-b,.slide-inner.face-pwr .rank-s{transform:rotate(60deg) scale(.32);opacity:0}
/* PWRグラフ面 */
.rmpwr-top{display:flex;align-items:baseline;gap:8px}
.rmpwr-top .rp-lab{font-size:14px;font-weight:900;color:#fff}
.rmpwr-top b{font-size:40px;font-weight:900;color:#fff;line-height:1}
.rmpwr-bars{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:6px;overflow:hidden}
.rmpwr-bar{flex:1 1 0;min-width:5px;background:rgba(255,255,255,.9);border-radius:3px 3px 0 0;transform-origin:bottom center} /* 伸びるアニメはルームメニューのアニメ廃止で削除 */
/* プリQQは背景が淡いので文字/バーをピンクに */
.pq-slide .rr-ko,.pq-slide .rr-ja,.pq-slide .rmpwr-top .rp-lab,.pq-slide .rmpwr-top b{color:#c04ea0}
.pq-slide .rmpwr-bar{background:rgba(200,67,154,.85)}
/* ROOM01の左にある難易度切替スライド */
.lv-pick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:26px;width:380px}
.lvbtn{height:112px;border:none;border-radius:56px;background:rgba(0,0,0,.8);color:#fff;font-size:44px;font-weight:800;cursor:pointer;font-family:inherit}
.lvbtn:active{background:rgba(0,0,0,.65)}
.lvbtn.on{box-shadow:0 0 0 4px #fff inset}
.lv-pick .lv-cap{text-align:center;font-size:22px;color:rgba(255,255,255,.85);letter-spacing:2px}
.slide-img{position:absolute;left:24px;top:120px;width:554px;height:507px;object-fit:contain;z-index:1} /* メニュー縮小(-58px)ぶん上へ。玉レイヤー(z0)より前面＝中央画像が玉に隠れない */
/* テスト後ホームのお知らせトースト */
.home-toast{position:absolute;left:50%;top:176px;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;font-size:27px;font-weight:900;padding:20px 34px;border-radius:26px;z-index:20;white-space:nowrap;animation:toastpop .55s cubic-bezier(.34,1.7,.5,1);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.4);text-align:center}
.home-toast.big{font-size:30px;box-shadow:0 12px 34px rgba(255,150,0,.5),0 0 0 3px rgba(255,196,0,.6)}
.home-toast.out{opacity:0;transform:translateX(-50%) scale(.85);transition:opacity .45s ease,transform .45s ease}
@keyframes toastpop{0%{opacity:0;transform:translateX(-50%) scale(.4) translateY(14px)}60%{opacity:1;transform:translateX(-50%) scale(1.08)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
/* 連続学習アップの豪華演出 */
.streak-cel{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);opacity:0;transition:opacity .3s ease}
.streak-cel.on{opacity:1}
.sc-card{position:relative;background:linear-gradient(160deg,#fff,#fff5e2);border-radius:26px;padding:26px 34px 24px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45);transform:scale(.65);transition:transform .45s cubic-bezier(.34,1.65,.5,1);z-index:2}
.streak-cel.on .sc-card{transform:scale(1)}
.sc-fire{width:100px;height:100px;object-fit:contain;animation:scfire 1s ease-in-out infinite alternate}
@keyframes scfire{from{transform:scale(1) rotate(-5deg)}to{transform:scale(1.14) rotate(5deg)}}
.sc-lab{font-size:16px;font-weight:900;color:#B45A00;margin-top:2px;letter-spacing:1px}

/* 放射状のキラキラ */

.sc-spark span{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#FFD86B,#FF9E2C);transform:rotate(var(--a)) translateY(0);opacity:0;animation:scspark 1.1s ease-out .2s forwards}
@keyframes scspark{0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.3)}30%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateY(-170px) scale(1)}}
/* プレゼントがプレゼントアイコンへ吸い込まれていく演出 */
.present-fly{position:fixed;width:130px;height:130px;object-fit:contain;transform:translate(-50%,-50%);z-index:500;pointer-events:none;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45));
  transition:left .95s cubic-bezier(.5,-0.15,.75,1),top .95s cubic-bezier(.5,-0.15,.75,1),width .95s ease,height .95s ease,opacity .9s ease-in,transform .95s ease}
/* プレゼント受け取り時：箱がピーンと上に上がり、アーチを描いて報酬アイコン(箱)へ入っていく演出（WAAPIで座標駆動するのでtransitionは持たせない） */
.claim-fly{position:fixed;object-fit:contain;transform:translate(-50%,-50%);z-index:500;pointer-events:none;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
@keyframes suckpop{0%{transform:scale(1)}35%{transform:scale(1.45)}100%{transform:scale(1)}}
.rr-btn.suck{animation:suckpop .5s ease}
@keyframes toastin{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* テスト後にホームへ戻ったときの流れ（メール指示 2026-07-29）
   ①プレゼントのアイコンから白い吹き出しで「プレゼントが届きました」→消える
   ②「新しいステップに進みました」＋いまクリアしたマスの絵がモノクロ→カラーに戻る
   （黒地に白の全画面ポップアップはやめた） */
.pbub{position:fixed;z-index:520;background:#fff;color:#1a1a1a;font-size:16px;font-weight:900;padding:12px 18px;border-radius:16px;
  box-shadow:0 10px 26px rgba(0,0,0,.28);white-space:nowrap;pointer-events:none;
  animation:pbubin .42s cubic-bezier(.34,1.6,.5,1) both}
.pbub::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-left-color:#fff;border-right:0}
.pbub.out{opacity:0;transform:scale(.9);transition:opacity .35s ease,transform .35s ease}
@keyframes pbubin{from{opacity:0;transform:scale(.55) translateX(20px)}to{opacity:1;transform:scale(1) translateX(0)}}
.stepnote{position:absolute;left:50%;top:206px;transform:translateX(-50%);z-index:20;background:#fff;color:#1a1a1a;
  font-size:21px;font-weight:900;padding:14px 26px;border-radius:999px;box-shadow:0 10px 28px rgba(0,0,0,.32);
  white-space:nowrap;pointer-events:none;animation:toastpop .5s cubic-bezier(.34,1.7,.5,1)}
.stepnote.out{opacity:0;transform:translateX(-50%) scale(.9);transition:opacity .4s ease,transform .4s ease}
.sg-img.recolor{animation:sgRecolor 1.6s ease-out both}
@keyframes sgRecolor{
  0%{filter:grayscale(1) brightness(1.06)}
  35%{filter:grayscale(.45) brightness(1.4) drop-shadow(0 0 26px rgba(255,215,100,.95)) drop-shadow(0 0 48px rgba(255,175,0,.7))}
  100%{filter:grayscale(0) brightness(1) drop-shadow(0 8px 7px rgba(0,0,0,.3))}
}
/* テストから帰ってきたときの「1マス進んだ」演出（メール指示 2026-07-31）
   ① 直前にクリアしたマスから、いまのマスへ光の玉が跳ねて移動する（画面座標で飛ばすのでfixed） */
.sg-adv{position:fixed;z-index:530;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fff,#FFE79A 46%,#FFB800 100%);
  box-shadow:0 0 14px 5px rgba(255,205,80,.85),0 0 34px 12px rgba(255,170,0,.5);
  pointer-events:none;animation:sgAdvHop .76s cubic-bezier(.3,-.35,.4,1.25) forwards}
@keyframes sgAdvHop{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  14%{opacity:1;transform:translate(calc(var(--dx) * .14),calc(var(--dy) * .14 - 26px)) scale(1.1)}
  100%{opacity:1;transform:translate(var(--dx),var(--dy)) scale(.85)}
}
/* ② 着いた先で光が「ピラン」と走る（輪＋放射） */
.sg-pirin{position:fixed;z-index:531;left:0;top:0;width:0;height:0;pointer-events:none}
.sg-pirin .sgp-ring{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  border:3px solid rgba(255,230,150,.95);animation:sgpRing .85s ease-out forwards}
@keyframes sgpRing{0%{opacity:0;transform:scale(.2)}18%{opacity:1}100%{opacity:0;transform:scale(3.6)}}
.sg-pirin .sgp-ray{position:absolute;left:0;top:0;width:4px;height:34px;margin:-17px 0 0 -2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(255,255,255,0),#FFE79A,rgba(255,255,255,0));
  animation:sgpRay .8s ease-out forwards}
@keyframes sgpRay{
  0%{opacity:0;transform:rotate(var(--a)) translateY(0) scaleY(.3)}
  25%{opacity:1}
  100%{opacity:0;transform:rotate(var(--a)) translateY(-42px) scaleY(1.4)}
}

/* リールの各ボタンもアイコン⇄日本語ラベルを中身のZ軸回転で入替（タイミングはボタンごとにランダム） */
/* 入替は待たされて見えないよう素早く。文字が消えきる前にアイコンが出はじめるくらいの重なりにする */
.rr-btn img{transition:opacity .1s ease .05s}       /* 戻るとき=アイコンは後から出す */
.rr-btn .rr-txt{transition:opacity .09s ease}        /* 戻るとき=文字は先に消す */

.rr-btn.show-label img{opacity:0}

@keyframes rbglow{0%{filter:drop-shadow(0 0 7px #ff3b3b)}17%{filter:drop-shadow(0 0 9px #ffb13b)}33%{filter:drop-shadow(0 0 10px #ffe93b)}50%{filter:drop-shadow(0 0 11px #3bff6a)}67%{filter:drop-shadow(0 0 10px #3bc4ff)}83%{filter:drop-shadow(0 0 9px #b13bff)}100%{filter:drop-shadow(0 0 7px #ff3b3b)}}

.wb-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:92px 10px;padding:96px 10px 24px} /* 長い単語でも3列とも同幅・画面からはみ出さない */

/* 単語カード獲得演出 */
.cardget{position:fixed;inset:0;z-index:550;background:rgba(0,0,0,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;transition:opacity .3s ease}
.cardget.on{opacity:1}
.cg-title{color:#fff;font-size:21px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.cg-skip{color:rgba(255,255,255,.7);font-size:13px;font-weight:800}
.cg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:420px;padding:0 16px;box-sizing:border-box;perspective:900px}
/* カード獲得の演出：奥から手前へ勢いよく着地→ゴールドの発光がパッと弾け→表面をシャインが走る（「獲得した！」感を強調） */
.cg-card{position:relative;aspect-ratio:3/4;background:linear-gradient(160deg,#fff,#ffe9c2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.4);transform:translateY(-46px) rotateX(60deg) scale(.5);opacity:0;overflow:hidden;animation:cgslam .5s cubic-bezier(.2,1.5,.4,1) forwards}
.cg-card img{width:76%;height:58%;object-fit:contain}
.cg-noimg{font-size:32px}
.cg-ko{font-size:14px;font-weight:900;color:#333;margin-top:3px;white-space:nowrap;overflow:hidden;max-width:92%;text-overflow:ellipsis}
/* 着地の瞬間に走るハイライト（シャイン）。着地アニメの直後に発火するよう遅延を継承させる */
.cg-card::after{content:"";position:absolute;top:-60%;left:-120%;width:60%;height:220%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:rotate(18deg);opacity:0;animation:cgshine .7s ease-out forwards;animation-delay:inherit}
@keyframes cgslam{
  0%{transform:translateY(-46px) rotateX(60deg) scale(.5);opacity:0;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  55%{opacity:1}
  70%{transform:translateY(0) rotateX(0) scale(1.12);box-shadow:0 0 0 3px rgba(255,196,0,.9),0 0 26px 6px rgba(255,196,0,.75),0 10px 22px rgba(0,0,0,.45)}
  100%{transform:translateY(0) rotateX(0) scale(1);opacity:1;box-shadow:0 6px 16px rgba(0,0,0,.4)}
}
@keyframes cgshine{0%{opacity:0;left:-120%}45%{opacity:.95}100%{opacity:0;left:160%}}
/* 結果の単語一覧＝獲得カード風グリッド（正誤記号＋記憶率＋変化つき） */
.res-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:2px} /* 4列→3列にして1枚を大きく */
/* 左右マージンは詰める。min-width:0＝中身（意味の長い日本語など）の最小幅で列が広がるのを断ち、
   3列を必ず器の幅に収める（列が広がると器が横スクロールして「大きく描かれている」ように見えていた） */
.rc-card{position:relative;aspect-ratio:3/3.5;background:linear-gradient(160deg,#fff,#ffe9c2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.25);padding:5px 2px;box-sizing:border-box;min-width:0;overflow:hidden}
/* 器を画像とぴったり同じ大きさにして、正誤記号を画像の左上の角へ重ねる */
.rc-imgw{position:relative;height:46%;max-width:100%;display:flex;align-items:center;justify-content:center}
.rc-imgw img{height:100%;width:auto;object-fit:contain}
.rc-card .cg-noimg{font-size:26px}
.rc-sym{position:absolute;top:-2px;left:-7px;font-size:21px;font-weight:900;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.15);z-index:1} /* 画像の左上角に重ねる（カードからはみ出すと切れるので寄せ量は控えめ） */
.rc-ko{font-size:15px;font-weight:900;color:#333;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis;margin-top:3px}
.rc-ja{font-size:11px;font-weight:700;color:#7a6a4a;white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis;margin-top:1px} /* 日本語の意味 */
.rc-foot{display:flex;gap:6px;align-items:baseline;justify-content:center;margin-top:1px}
.rc-cards{font-size:11px;font-weight:900;color:#b8862b}
.rc-delta{font-size:11px;font-weight:900} /* 記憶率の増減（±%）色はインラインで緑/赤 */
/* カードをタップ＝その単語の韓国語を読み上げる（結果画面から発音を確かめられるように） */
.speakable{cursor:pointer;-webkit-tap-highlight-color:transparent}
.speakable.speaking{box-shadow:0 0 0 3px #2F6FE0}
.res-score span{font-size:13px;color:var(--faint);font-weight:800}
.res-params{display:flex;justify-content:center;gap:28px;margin-top:10px}
.rp{display:flex;flex-direction:column;align-items:center;gap:4px}
.rp-num{font-size:22px;font-weight:800;line-height:1}
.rp-num i{font-style:normal;font-size:13px;margin-left:2px}
.rp-g{width:120px;height:15px;background:#333;border-radius:999px;padding:3px;box-sizing:border-box}
.rp-g div{height:100%;border-radius:999px}
.pwr-delta{font-size:18px;font-weight:900}
.res-right{display:flex;flex-direction:column;align-items:flex-start;gap:4px} /* 「過去の結果」画面で使用 */
.res-counts{display:flex;flex-direction:row;align-items:baseline;gap:8px;font-size:14px;font-weight:900;line-height:1.15} /* 点数の右に 正解数 / 不正解数 */
.res-cnt{flex:0 0 auto;min-width:42px;text-align:right;font-size:16px;font-weight:900;line-height:1.15} /* 上の段の 中＝正解数 / 右＝不正解数 */
/* 右側は上＝点数と正誤／下＝メーター2本 */
.res-side{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.res-scorerow{display:flex;align-items:baseline;gap:8px;padding:0 2px}
.res-scorerow .res-score{flex:1 1 auto} /* 点数は左寄せ。正解数・不正解数がその右に並ぶ */
/* レベル(XP)とPWRはステータス画面（ホームのヘッダー）と同じ見た目に統一：
   黒の座布団／右揃えラベル／#333の溝に太いゲージ／XPは黄・PWRは緑（メール指示 2026-07-29）
   太さ・文字サイズ・行間はホームのステータスバー（602px基準: ゲージ19px・溝の内側3px・行送り9px・文字18px）を
   --hs（ホームの縮小率）で実寸に直したもの＝ホームと全く同じ大きさで出る（メール指示 2026-07-31） */
.res-meters{display:flex;flex-direction:column;gap:calc(9px * var(--hs));background:rgba(0,0,0,.8);border-radius:14px;padding:calc(9px * var(--hs)) calc(12px * var(--hs))}
/* ラベル・ゲージ・数値・増分を格子で固定＝レベルとPWRのゲージが必ず同じ横幅になる（メール指示 2026-07-29） */
.res-mrow{display:grid;grid-template-columns:calc(80px * var(--hs)) minmax(36px,1fr) calc(96px * var(--hs)) calc(84px * var(--hs));align-items:center;gap:calc(9px * var(--hs));height:calc(19px * var(--hs))} /* 行の高さ＝ゲージの太さ。行送りはホームと同じ28px相当になる */
.res-mlab{min-width:0;text-align:right;font-size:calc(18px * var(--hs));font-weight:900;color:#fff;line-height:calc(19px * var(--hs))}
.res-mg{min-width:36px;height:calc(19px * var(--hs));background:#333;border-radius:999px;padding:calc(3px * var(--hs));box-sizing:border-box}
.res-mfill{height:100%;border-radius:999px;width:0;transition:width .8s ease}
.res-mval{min-width:0;text-align:right;font-size:calc(16px * var(--hs));font-weight:800;color:#fff;line-height:calc(19px * var(--hs));font-variant-numeric:tabular-nums} /* 幅を固定＝レベルとPWRのゲージが同じ横幅で揃う */
.res-mgain{font-size:calc(20px * var(--hs));font-weight:900;line-height:calc(19px * var(--hs));text-align:right}
.res-mgain span{font-size:calc(14px * var(--hs));margin-left:1px}
.res-xp-gain{color:#FFFF37} /* 獲得XPもステータスのXPと同じ黄色（緑は見づらかった） */
.res-xp-gain.pop{animation:xppop .5s cubic-bezier(.2,1.6,.4,1) both}
.res-sess{margin-top:8px;font-size:12.5px;color:var(--faint);font-weight:700}
.res-sess b{color:var(--text)}
.btn.dark{background:rgba(0,0,0,.8);color:#fff}
.btn.dark:active{background:rgba(0,0,0,.65)}
.res-listwrap{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;margin:10px 0;border:none;border-radius:0;-webkit-overflow-scrolling:touch} /* カードグリッドの上下とも境界線は無し（カード上の黒線を撤去）。左右幅は固定＝横スクロールさせない */
/* 出題表はコンパクト表示（ボタン群がスクロールなしで見えるよう縦を圧縮） */
.rtab{width:100%;border-collapse:collapse;font-size:13px;background:rgba(0,0,0,.65)}
.rtab th,.rtab td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.rtab th{position:sticky;top:0;background:rgba(0,0,0,.8);color:#fff;font-size:11px;font-weight:800;z-index:1;white-space:nowrap}
.rtab td:nth-child(3){font-size:13px;font-weight:700}
.rtab td.no{color:var(--mute);text-align:right;width:30px}
.rtab td.ko{font-weight:700;font-size:15px}
.rtab .r-ok{color:var(--green)}.rtab .r-ng{color:var(--blue)}.rtab .r-un{color:var(--mute)}.rtab .r-to{color:var(--gold)}
.hint-badge{display:inline-block;margin-left:6px;padding:1px 6px;border:1px solid var(--line);color:var(--gold);font-size:10px;font-weight:700;vertical-align:middle}
.res-btns{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:rgba(255,255,255,.55);border-radius:14px;padding:7px}
/* アイコン＋下にラベルの縦並びボタン（応援する / シェアする / もう一度 / ホーム） */
.res-btns .rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:none;border-radius:10px;background:#fff;color:#222;padding:9px 2px;cursor:pointer;
  font-family:inherit;text-decoration:none;transition:transform .08s ease,background .15s ease}
.res-btns .rb:active{transform:translateY(1px);background:#eee}
