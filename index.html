/* --- 書き取り誤答の分類（初声・中声・終声に分解して差分判定） --- */
const KO_INDEX={};Object.values(WORD_BY_ID).forEach(w=>{KO_INDEX[w.ko.replace(/[\s~〜・･]/g,"")]=w;});
const TENSE_GROUPS=[["ㄱ","ㅋ","ㄲ"],["ㄷ","ㅌ","ㄸ"],["ㅂ","ㅍ","ㅃ"],["ㅈ","ㅊ","ㅉ"],["ㅅ","ㅆ"]];
const COMPOUND_V=new Set(["ㅘ","ㅙ","ㅚ","ㅝ","ㅞ","ㅟ","ㅢ"]);
function _decompSyl(ch){const c=ch.codePointAt(0);if(c<0xAC00||c>0xD7A3)return null;const s=c-0xAC00;return{cho:CHO[Math.floor(s/588)],jung:JUNG[Math.floor((s%588)/28)],jong:JONG[s%28]||""};}
function _sameTense(a,b){return TENSE_GROUPS.some(g=>g.includes(a)&&g.includes(b));}
function _lev(a,b){const m=a.length,n=b.length,D=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
 for(let j=0;j<=n;j++)D[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return D[m][n];}
function phoneticDetail(inp,cor){
  const A=[...inp],B=[...cor],L=Math.min(A.length,B.length),found=[];
  for(let i=0;i<L;i++){
    if(A[i]===B[i])continue;
    const a=_decompSyl(A[i]),b=_decompSyl(B[i]);if(!a||!b)continue;
    const dc=a.cho!==b.cho,dv=a.jung!==b.jung,dj=a.jong!==b.jong;
    if(dc&&!dv&&!dj)found.push(_sameTense(a.cho,b.cho)?"tense_aspirated_confusion":"initial_consonant_confusion");
    else if(dv&&!dc&&!dj)found.push((COMPOUND_V.has(a.jung)||COMPOUND_V.has(b.jung))?"compound_vowel_confusion":"vowel_confusion");
    else if(dj&&!dc&&!dv)found.push("final_consonant_confusion");
  }
  const pri=["tense_aspirated_confusion","compound_vowel_confusion","final_consonant_confusion","vowel_confusion","initial_consonant_confusion"];
  return pri.find(p=>found.includes(p))||null;
}
/* ユーザー向け「おしい！」判定: 音節数が同じで、各相違が「終声だけ/母音だけ/濃音・激音の初声だけ」の単一要素ミス(最大2音節)のときのみtrue。
   編集距離では音が全然違っても近いと誤判定するため、音の近さを厳密に見る */
function isPhoneticCloseMiss(input,cor){
  const norm=s=>String(s||"").replace(/[\s~〜・･]/g,"");
  const A=[...norm(input)],B=[...norm(cor)];
  if(!A.length||A.length!==B.length)return false; // 音節数が違えば音は合っていない
  let diff=0;
  for(let i=0;i<A.length;i++){
    if(A[i]===B[i])continue;
    const a=_decompSyl(A[i]),b=_decompSyl(B[i]);
    if(!a||!b)return false;
    const dc=a.cho!==b.cho,dv=a.jung!==b.jung,dj=a.jong!==b.jong;
    const forgivable=(dj&&!dc&&!dv)||(dv&&!dc&&!dj)||(dc&&!dv&&!dj&&_sameTense(a.cho,b.cho)); // 終声のみ/母音のみ/濃音激音の初声のみ
    if(!forgivable)return false;
    if(++diff>2)return false;
  }
  return diff>=1;
}
function classifyWritingError(input,w){
  const norm=s=>String(s||"").replace(/[\s~〜・･]/g,"");
  const inp=norm(input),cor=norm(w.ko);
  if(!inp)return{type:"unclassified",detail:null,wrongWordId:null};
  const other=KO_INDEX[inp];
  if(other&&other.id!==w.id){ // 優先1: 意味置換（登録済み単語＋カテゴリ/意味/関連語）
    const rel=(other.cat&&w.cat&&other.cat===w.cat)||sharedKanji(other.ja,w.ja)||cor.includes(inp)||inp.includes(cor)||jaHead(other)===jaHead(w);
    if(rel)return{type:"semantic_substitution",detail:null,wrongWordId:other.id};
  }
  const dist=_lev([...inp],[...cor]); // 優先2: 音写（編集距離2以内 または 類似率65%以上）
  const sim=1-dist/Math.max([...inp].length,[...cor].length);
  if(dist<=2||sim>=0.65)return{type:"phonetic_spelling",detail:phoneticDetail(inp,cor),wrongWordId:null};
  if(other&&other.id!==w.id)return{type:"semantic_substitution",detail:null,wrongWordId:other.id};
  return{type:"unclassified",detail:null,wrongWordId:null}; // 優先3: 未分類
}

/* --- 判定対象履歴: 直近90日かつ直近300回答。recency重み exp(-days/45) --- */
function diagWindow(){
  const now=Date.now();
  return loadHistory()
    .filter(r=>(now-new Date(r.answeredAt).getTime())/86400000<=90)
    .slice(-300)
    .map(r=>({r,w:Math.exp(-((now-new Date(r.answeredAt).getTime())/86400000)/45)}));
}
function computeDiagnosis(){
  const win=diagWindow();
  const CTX=["same_scene","context_related","category_neighbor","broader_narrower","cultural_confusion","role_confusion"];
  // 軸1: 誤答固定率（同一単語2回以上誤答の加重平均、3語未満は分析中）
  const wrongs=win.filter(x=>x.r.answerType==="choice"&&x.r.answerStatus==="incorrect"&&x.r.userAnswer);
  const byWord={};wrongs.forEach(x=>{(byWord[x.r.wordId]=byWord[x.r.wordId]||[]).push(x);});
  let n1=0,num=0,den=0;
  Object.values(byWord).forEach(arr=>{
    if(arr.length<2)return;n1++;
    const cnt={};let ws=0;arr.forEach(x=>{cnt[x.r.userAnswer]=(cnt[x.r.userAnswer]||0)+1;ws+=x.w;});
    num+=(Math.max(...Object.values(cnt))/arr.length)*ws;den+=ws;
  });
  const s1=den?num/den*100:null;
  const hasData=win.length>0; // 履歴が1件でもあれば未確定軸は右側(U/C/S/D)を既定として必ず4文字を確定
  const axis1={no:1,score:s1,code:s1!=null?(s1>=60?"F":"U"):(hasData?"U":null),n:n1,need:Math.max(0,3-n1),provisional:n1<3};
  // 軸2: 意味類似誤答率（10件未満は仮判定）
  let sem=0,ctx=0,n2=0;
  wrongs.forEach(x=>{const t=x.r.distractorType;if(!t)return;
    if(t==="semantic_close"){sem+=x.w;n2++;}else if(CTX.includes(t)){ctx+=x.w;n2++;}});
  const s2=(sem+ctx)>0?sem/(sem+ctx)*100:null;
  const axis2={no:2,score:s2,code:s2!=null?(s2>=55?"M":"C"):(hasData?"C":null),n:n2,need:Math.max(0,10-n2),provisional:n2<10};
  // 軸3: 音写率（分類可能誤答5件未満は分析中）
  let ph=0,ss=0,n3=0;
  win.forEach(x=>{const t=x.r.writingErrorType;
    if(t==="phonetic_spelling"){ph+=x.w;n3++;}else if(t==="semantic_substitution"){ss+=x.w;n3++;}});
  const s3=(ph+ss)>0?ph/(ph+ss)*100:null;
  const axis3={no:3,score:s3,code:s3!=null?(s3>=55?"P":"S"):(hasData?"S":null),n:n3,need:Math.max(0,5-n3),provisional:n3<5};
  // 軸4: 瞬発誤答 vs 熟考正答（四択のみ、わからない/時間切れ除外、20件未満は仮判定）
  const elig=win.filter(x=>x.r.answerType==="choice"&&(x.r.answerStatus==="correct"||x.r.answerStatus==="incorrect"));
  let qw=0,dc=0,tw=0;
  elig.forEach(x=>{tw+=x.w;
    if(!x.r.isCorrect&&x.r.responseTimeMs<3000)qw+=x.w;
    else if(x.r.isCorrect&&x.r.responseTimeMs>=3000)dc+=x.w;});
  const s4=(qw+dc)>0?qw/(qw+dc)*100:null;
  const axis4={no:4,score:s4,code:elig.length?((tw?qw/tw:0)>(tw?dc/tw:0)?"Q":"D"):(hasData?"D":null),n:elig.length,need:Math.max(0,20-elig.length),provisional:elig.length<20};
  const n=win.length;
  const confidence=n<30?"analyzing":n<100?"provisional":n<300?"current":"detailed";
  const axes=[axis1,axis2,axis3,axis4];
  return{axes,n,confidence,code:axes.map(a=>a.code||"?").join(""),complete:axes.every(a=>a.code)};
}

/* --- 外枠カラー（スコアで左右色を滑らかに補間。未確定軸は中間色） --- */
function lerpHex(h1,h2,t){
  const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);
  const f=(sa,sb)=>Math.round(sa+(sb-sa)*t);
  return"#"+((1<<24)|(f(a>>16,b>>16)<<16)|(f((a>>8)&255,(b>>8)&255)<<8)|f(a&255,b&255)).toString(16).slice(1);
}
function axisColor(ax,axis){return lerpHex(AXIS_COLORS[ax.R],AXIS_COLORS[ax.L],(axis.score==null?50:axis.score)/100);}
function frameColors(d){const o={};AXES.forEach((ax,i)=>o[ax.side]=axisColor(ax,d.axes[i]));return o;}
function applyFrameColors(d){
  const fc=frameColors(d),el=document.getElementById("tframe");
  if(!el)return;
  el.style.borderTopColor=fc.top;el.style.borderRightColor=fc.right;
  el.style.borderBottomColor=fc.bottom;el.style.borderLeftColor=fc.left;
}

/* --- 診断結果の保存（上書きせず履歴として追記） --- */
const LS_DIAG="kwt_diag_v1";
function loadDiag(){try{return JSON.parse(localStorage.getItem(LS_DIAG)||"[]");}catch(e){return[];}}
function charPathFor(d){return d.complete?`characters/${d.code.toLowerCase()}.svg`:"characters/analyzing.svg";}
function updateDiagnosis(){
  const d=computeDiagnosis();
  const hist=loadDiag(),last=hist[hist.length-1]||null;
  const changed=!last||last.diagnosisCode!==d.code||last.confidenceLevel!==d.confidence;
  if(changed){
    const fc=frameColors(d),rd=v=>v==null?null:Math.round(v);
    hist.push({userId:getUserId(),diagnosisCode:d.code,
      axis1Code:d.axes[0].code,axis1Score:rd(d.axes[0].score),
      axis2Code:d.axes[1].code,axis2Score:rd(d.axes[1].score),
      axis3Code:d.axes[2].code,axis3Score:rd(d.axes[2].score),
      axis4Code:d.axes[3].code,axis4Score:rd(d.axes[3].score),
      confidenceLevel:d.confidence,frameColors:fc,characterImagePath:charPathFor(d),
      calculatedAt:new Date().toISOString()});
    if(hist.length>200)hist.splice(0,hist.length-200);
    localStorage.setItem(LS_DIAG,JSON.stringify(hist));
  }
  applyFrameColors(d);refreshHomeType(d);
  return{diag:d,changed,prevCode:last?last.diagnosisCode:null};
}

/* --- ホーム上部のタイプ表示 --- */
function nextHint(d){
  if(d.n<30)return`あと${30-d.n}問で、仮タイプが表示されます`;
  const miss=d.axes.filter(a=>!a.code);
  if(miss.length){
    const m=miss[0];
    if(m.no===1)return"同じ単語での誤答が増えると、軸1が判定されます";
    if(m.no===3)return`書き取りの誤答があと${m.need}件で、軸3が判定されます`;
    return"履歴が増えると、残りの軸が判定されます";
  }
  if(d.n<100)return`あと${100-d.n}問で「現在のタイプ」になります`;
  if(d.n<300)return`あと${300-d.n}問で「詳細タイプ」になります`;
  return"";
}

/* ============================================================ ハングルIME（2ボル式 文字合成） ============================================================ */
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG=["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const CHO_I={},JUNG_I={},JONG_I={};
CHO.forEach((c,i)=>CHO_I[c]=i);JUNG.forEach((c,i)=>JUNG_I[c]=i);JONG.forEach((c,i)=>{if(c)JONG_I[c]=i});
const COMB_JUNG={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
const DEC_JUNG={"ㅘ":["ㅗ","ㅏ"],"ㅙ":["ㅗ","ㅐ"],"ㅚ":["ㅗ","ㅣ"],"ㅝ":["ㅜ","ㅓ"],"ㅞ":["ㅜ","ㅔ"],"ㅟ":["ㅜ","ㅣ"],"ㅢ":["ㅡ","ㅣ"]};
const COMB_JONG={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
const DEC_JONG={"ㄳ":["ㄱ","ㅅ"],"ㄵ":["ㄴ","ㅈ"],"ㄶ":["ㄴ","ㅎ"],"ㄺ":["ㄹ","ㄱ"],"ㄻ":["ㄹ","ㅁ"],"ㄼ":["ㄹ","ㅂ"],"ㄽ":["ㄹ","ㅅ"],"ㄾ":["ㄹ","ㅌ"],"ㄿ":["ㄹ","ㅍ"],"ㅀ":["ㄹ","ㅎ"],"ㅄ":["ㅂ","ㅅ"]};
const isVowel=j=>JUNG_I[j]!==undefined;
const isValidJong=j=>JONG_I[j]!==undefined;

const IME={
  cho:null,jung:null,jong:null,committed:"",
  reset(){this.cho=this.jung=this.jong=null;this.committed="";},
  _renderBlock(cho,jung,jong){
    if(cho===null&&jung===null)return"";
    if(cho!==null&&jung===null)return cho;
    if(cho===null&&jung!==null)return jung;
    const ti=jong?JONG_I[jong]:0;
    return String.fromCharCode(0xAC00+(CHO_I[cho]*21+JUNG_I[jung])*28+ti);
  },
  _render(){return this._renderBlock(this.cho,this.jung,this.jong);},
  text(){return this.committed+this._render();},
  commit(){this.committed+=this._render();this.cho=this.jung=this.jong=null;},
  input(j){ isVowel(j)?this._vowel(j):this._cons(j); },
  _cons(j){
    if(this.cho===null&&this.jung===null&&this.jong===null){this.cho=j;return;}
    if(this.cho!==null&&this.jung===null){this.commit();this.cho=j;return;}
    if(this.cho===null&&this.jung!==null){this.commit();this.cho=j;return;}
    if(this.jong===null){
      if(isValidJong(j))this.jong=j; else{this.commit();this.cho=j;}
      return;
    }
    const c=COMB_JONG[this.jong+j];
    if(c)this.jong=c; else{this.commit();this.cho=j;}
  },
  _vowel(j){
    if(this.cho===null&&this.jung===null){this.jung=j;return;}
    if(this.cho!==null&&this.jung===null){this.jung=j;return;}
    if(this.jong===null){
      const c=COMB_JUNG[this.jung+j];
      if(c)this.jung=c; else{this.commit();this.jung=j;}
      return;
    }
    // 終声あり → 終声の最後の子音を次の音節の初声へ移動
    const d=DEC_JONG[this.jong];
    let baseJong,movedCho;
    if(d){baseJong=d[0];movedCho=d[1];} else {baseJong=null;movedCho=this.jong;}
    this.committed+=this._renderBlock(this.cho,this.jung,baseJong);
    this.cho=movedCho;this.jung=j;this.jong=null;
  },
  space(){this.commit();this.committed+=" ";},
  backspace(){
    if(this.jong!==null){const d=DEC_JONG[this.jong];this.jong=d?d[0]:null;return;}
    if(this.jung!==null){const d=DEC_JUNG[this.jung];this.jung=d?d[0]:null;return;}
    if(this.cho!==null){this.cho=null;return;}
    if(this.committed.length>0){
      const last=this.committed[this.committed.length-1];
      this.committed=this.committed.slice(0,-1);
      const code=last.charCodeAt(0);
      if(code>=0xAC00&&code<=0xD7A3){
        const s=code-0xAC00;
        this.cho=CHO[Math.floor(s/(21*28))];
        this.jung=JUNG[Math.floor((s%(21*28))/28)];
        const ti=s%28;this.jong=ti?JONG[ti]:null;
        this.backspace();
      }
    }
  }
};

/* ============================================================ ストレージ（全件保存） ============================================================ */
const LS_HIST="kwt_history_v1", LS_PERFECT="kwt_perfect_v1", LS_USER="kwt_user_v1",
      LS_STATS="kwt_stats_v1", LS_PROG="kwt_progress_v1", LS_SESS="kwt_session_v1",
      LS_BONUS="kwt_bonus_v1", LS_PRESENT="kwt_present_v1", LS_CARDS="kwt_cards_v1", LS_LAUNCH="kwt_launch_v1", LS_LASTROOM="kwt_lastroom_v1", LS_SETTINGS="kwt_settings_v1";
function getUserId(){let u=localStorage.getItem(LS_USER);if(!u){u="u-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);localStorage.setItem(LS_USER,u);}return u;}
function loadHistory(){const h=_lsJSON(LS_HIST,()=>[]);return Array.isArray(h)?h:[];}
/* 保存の安全弁: 容量オーバー時は再生成可能な診断履歴を捨て→古い回答明細を強めに間引いて再試行し、学習の核(stats/cards)が静かに失われるのを防ぐ */
function _lsSet(key,value){
  try{localStorage.setItem(key,value);return true;}
  catch(e){
    try{localStorage.removeItem(LS_DIAG);}catch(_){} // 診断履歴は再生成可能
    try{
      const h=JSON.parse(localStorage.getItem(LS_HIST)||"[]");
      if(h.length>500){
        const meta=JSON.parse(localStorage.getItem("kwt_histmeta_v1")||"{}");
        const keep=h.slice(-500);
        meta.prunedTests=(meta.prunedTests||0)+new Set(h.slice(0,h.length-500).map(r=>r.testId)).size;
        localStorage.setItem("kwt_histmeta_v1",JSON.stringify(meta));
        localStorage.setItem(LS_HIST,JSON.stringify(keep));_histIdxCache=null;_roomSeriesCache={};
      }
    }catch(_){}
    try{localStorage.setItem(key,value);return true;}catch(e2){return false;}
  }
}
/* JSONで保存し、解析キャッシュも同時に更新する（保存直後の読み直しで巨大JSONを解析し直さない） */
function _lsSetJSON(key,obj){

/* --- 単語別の記憶状態（忘却/形成モデル）。係数はconfigで外出し（後から調整可能） --- */
const MEMORY_CONFIG={
  initialMemoryScore:0, initialFormingScore:0,
  initialStabilityHours:12, initialFormingStabilityHours:12,
  minStabilityHours:6, maxStabilityHours:720, reviewThreshold:70,
  defaultWordDifficulty:1.0, minWordDifficulty:0.7, maxWordDifficulty:1.5,
  historyDecayLambda:0.08, accuracyBonusWeight:0.5,
  dailyGainMax:0.25, dailyGainK:0.8,
  predictionLearningRateGamma:0.25,
  correctActualMin:60, correctActualMax:95, responseSpeedAlpha:0.10,
  formingIncorrectGain:5, formingUnknownGain:3, formingTimeoutGain:2, firstCorrectMemoryScore:45,
  choiceFastCorrectDelta:12, choiceNormalCorrectDelta:8,
  writingFastCorrectDelta:18, writingNormalCorrectDelta:14,
  // 書き取りの誤答は「手を動かして間違えた」ぶん記憶に残るので、4択の誤答より減点を小さくする（記憶率が一気に落ちないように）
  choiceIncorrectDelta:-15, writingIncorrectDelta:-6, unknownDelta:-18, timeoutDelta:-18,
  hintMultiplier:0.5,
  actualIncorrect:25, actualIncorrectWriting:45, actualUnknown:10, actualTimeout:15,
  lapseGraceMultiplier:0.6, lapseGraceStreak:2, // 直前まで連続正解できていた語の「うっかり1回」は減点を弱める
  fastChoiceSec:5, fastWritingSec:10
};
const DEFAULT_SCORE=0; // 互換: 未学習語の初期記憶スコア
function clampN(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function loadStats(){return _lsJSON(LS_STATS,()=>({}));}
function saveStats(s){_lsSetJSON(LS_STATS,s);}
function defaultStat(){const C=MEMORY_CONFIG;return{
  hasSeen:false,hasEverCorrect:false,
  memoryScore:C.initialMemoryScore,formingScore:C.initialFormingScore,
  stabilityHours:C.initialStabilityHours,wordDifficulty:C.defaultWordDifficulty,
  lastReviewedAt:null,firstCorrectAt:null,lastReviewDay:null,nextReviewAt:null,
  reviewCount:0,correctCount:0,incorrectCount:0,sameDayCorrectCount:0,
  consecutiveCorrectCount:0,averageResponseTimeMs:0,
  lastAnswerStatus:null,lastAnswerType:null,lastResponseTimeSec:null,isHintProvided:false};}
function getStat(id,store){
  const raw=(store||loadStats())[id];
  const st=raw?Object.assign(defaultStat(),raw):defaultStat();
  st.wordId=id;
  // --- 旧データ移行: 新フィールドが無い既存statを補完 ---
  if(raw){
    if(raw.hasSeen===undefined)st.hasSeen=raw.lastReviewedAt!=null;
    if(raw.hasEverCorrect===undefined)st.hasEverCorrect=(raw.correctCount||0)>0;
    if(raw.stabilityHours===undefined)st.stabilityHours=clampN(12*(1+(raw.consecutiveCorrectCount||0))+6*(raw.correctCount||0),MEMORY_CONFIG.minStabilityHours,MEMORY_CONFIG.maxStabilityHours);
    if(raw.wordDifficulty===undefined)st.wordDifficulty=MEMORY_CONFIG.defaultWordDifficulty;
  }
  return st;
}
/* 履歴を単語ごとに索引（重い再計算を避けるためキャッシュ。saveAnswerで無効化） */
let _histIdxCache=null;
function histByWord(){
  if(_histIdxCache)return _histIdxCache;
  const m={};loadHistory().forEach(r=>{(m[r.wordId]=m[r.wordId]||[]).push(r);});
  for(const k in m)m[k].sort((a,b)=>String(a.answeredAt).localeCompare(String(b.answeredAt)));
  _histIdxCache=m;return m;
}
function dayKey(ms){const d=new Date(ms);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
/* Ba: 時間減衰付き正答率補正（最近の回答ほど重い） */
function accuracyBonus(wordId,nowMs){
  const C=MEMORY_CONFIG,recs=histByWord()[wordId]||[];
  if(!recs.length)return 1;
  let num=0,den=0;
  recs.forEach(r=>{const dt=Math.max(0,(nowMs-new Date(r.answeredAt).getTime())/86400000);const w=Math.exp(-C.historyDecayLambda*dt);den+=w;num+=w*(r.isCorrect?1:0);});
  return 1+C.accuracyBonusWeight*(den>0?num/den:0);
}
/* Cd: 同日定着上限補正（その日の同一単語の正解回数で頭打ち） */
function dailyConsolidationBonus(st,nowMs){
  const C=MEMORY_CONFIG;
  const n=(st.lastReviewDay===dayKey(nowMs))?(st.sameDayCorrectCount||0):0;
  return 1+C.dailyGainMax*(1-Math.exp(-C.dailyGainK*n));
}
/* 実効安定度 = Su * Ba * Cd / Dw */
function effectiveStability(st,nowMs){
  const C=MEMORY_CONFIG;
  const Su=clampN(st.stabilityHours||C.initialStabilityHours,C.minStabilityHours,C.maxStabilityHours);
  const Dw=clampN(st.wordDifficulty||C.defaultWordDifficulty,C.minWordDifficulty,C.maxWordDifficulty);
  return Math.max(1,Su*accuracyBonus(st.wordId,nowMs)*dailyConsolidationBonus(st,nowMs)/Dw);
}
/* 現在の推定記憶率（初正解前は形成スコアの減衰、初正解後は忘却曲線） */
function displayMemoryScore(st,nowMs){
  const C=MEMORY_CONFIG;
  if(!st||st.lastReviewedAt==null)return 0; // 未接触=0
  const t=(nowMs-new Date(st.lastReviewedAt).getTime())/3600000;
  if(!st.hasEverCorrect){
    const Dw=clampN(st.wordDifficulty||C.defaultWordDifficulty,C.minWordDifficulty,C.maxWordDifficulty);
    return (st.formingScore||0)*Math.exp(-(t*Dw)/C.initialFormingStabilityHours);
  }
  return (st.memoryScore||0)*Math.exp(-t/effectiveStability(st,nowMs));
}
function displayScore(st,nowMs){return displayMemoryScore(st,nowMs);} // 互換エイリアス
function stabilityHours(st){return effectiveStability(st,Date.now());} // 互換（hoursTo70等）
/* 単語状態の分類（new/forming/urgent/review/stabilizing/stable） */
function wordState(st,nowMs){
  if(!st||!st.hasSeen&&st.lastReviewedAt==null)return"new";
  if(!st.hasEverCorrect)return"forming";
  const M=displayMemoryScore(st,nowMs);
  if(M<40)return"urgent";
  if(M<70)return"review";
  if(M<85)return"stabilizing";
  return"stable";
}
function overallCondition(nowMs){const s=loadStats();let t=0;WORDS.forEach(w=>t+=displayScore(getStat(w.id,s),nowMs));return t/WORDS.length;}
function reviewNeedCount(nowMs){const s=loadStats();return WORDS.filter(w=>displayScore(getStat(w.id,s),nowMs)<MEMORY_CONFIG.reviewThreshold).length;}

(function(){

    ["pointerdown","touchstart","keydown"].forEach(ev=>document.removeEventListener(ev,unlock,true));};
  ["pointerdown","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,unlock,true));
})();

  o.connect(g);g.connect(ctx.destination);o.start(t0);o.stop(t0+dur+0.05);}

let _koVoice=null,_curAudio=null;
function _pickKoVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=window.speechSynthesis.getVoices()||[];
  _koVoice=vs.find(v=>v.lang==="ko-KR")||vs.find(v=>v.lang&&v.lang.toLowerCase().replace("_","-").indexOf("ko")===0)||null;
}
if('speechSynthesis' in window){_pickKoVoice();window.speechSynthesis.onvoiceschanged=_pickKoVoice;}
function stopSpeak(){
  try{ if('speechSynthesis' in window)window.speechSynthesis.cancel(); }catch(e){}
  try{ if(_curAudio){_curAudio.pause();_curAudio.currentTime=0;_curAudio=null;} }catch(e){}
}
function speakKorean(word){
  // 再生失敗してもテストは止めない（全てtry/catchで握りつぶす）
  try{
    if(loadSettings().sound===false)return; // 音声オフ設定
    stopSpeak(); // 前の問題の音声が残っていれば停止し、重複再生を防ぐ
    if(word&&word.audio){
      const a=new Audio(word.audio);_curAudio=a;
      a.play().catch(()=>{ _speakTTS(word.ko); }); // ファイル再生失敗時はTTSへフォールバック
      return;
    }
    _speakTTS(word?word.ko:"");
  }catch(e){}
}
function showMuteHint(){
  let el=document.getElementById("mutehint");
  if(!el){el=document.createElement("div");el.id="mutehint";el.className="mutehint";el.textContent="🔇 音声を再生できません";document.body.appendChild(el);}
  el.classList.add("on");setTimeout(()=>el.classList.remove("on"),1800);
}
let _lastSpk={t:"",at:0};
function speakSmart(text){ // 同じ単語を4秒以内にもう一度押すとゆっくり再生
  const slow=_lastSpk.t===text&&Date.now()-_lastSpk.at<4000;
  _lastSpk={t:text,at:Date.now()};
  stopSpeak();_speakTTS(text,slow?0.55:0.9);
}
function _speakTTS(text,rate){
  try{
    if(loadSettings().sound===false)return; // 音声オフ設定
    if(!text)return;
    if(!('speechSynthesis' in window)){showMuteHint();return;} // 再生不可は視覚で知らせる
    if(!_koVoice)_pickKoVoice();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ko-KR";u.rate=rate||0.9;u.pitch=1.0;
    u.onerror=e=>{const c=e&&e.error;if(c==="canceled"||c==="interrupted")return;showMuteHint();}; // 次問題への切替時のcancelは正常動作なので通知しない
    if(_koVoice)u.voice=_koVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================ 出題ロジック ============================================================ */
const PLAN=[...Array(5).fill("jk"),...Array(5).fill("kj"),...Array(2).fill("w")];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n){return shuffle(a).slice(0,n);}
/* ---- 紛らわしい選択肢の生成（品詞一致＋類似度スコア） ---- */
/* 品詞判定: 〜다=用言（訳が い/だ 終わり=形容詞、他=動詞）、訳が に/く/と 終わり=副詞、他=名詞 */
function posOf(w){
  if(w._pos)return w._pos;
  const j=(w.ja||"").split(/[、,（(]/)[0].trim();
  let p;
  if(/다$/.test(w.ko.replace(/\s/g,"")))p=/(い|だ)$/.test(j)?"adj":"verb";
  else if(j.length>=2&&/[にくと]$/.test(j))p="adv";
  else p="noun";
  return w._pos=p;
}
/* 韓国語の見た目の紛らわしさ：頭音節・末尾一致、共有音節、長さ近似 */
function simKo(a,b){
  const A=[...a.ko.replace(/[^가-힣]/g,"")],B=[...b.ko.replace(/[^가-힣]/g,"")];
  let s=0;
  if(A[0]===B[0])s+=3;
  if(A[A.length-1]===B[B.length-1])s+=2;
  s+=Math.max(0,2-Math.abs(A.length-B.length));
  const setB=new Set(B);new Set(A).forEach(ch=>{if(setB.has(ch))s+=1;});
  return s;
}
/* 日本語訳の紛らわしさ：共有漢字＋長さ近似 */
function simJa(a,b){
  const A=new Set([...a.ja].filter(c=>/[一-龯々]/.test(c)));
  let s=0;new Set([...b.ja]).forEach(c=>{if(A.has(c))s+=2;});
  s+=Math.max(0,2-Math.abs(a.ja.length-b.ja.length))*0.5;
  return s;
}
/* 第一義（最初の訳語）。同義語を誤答に混ぜない判定に使う */
function jaHead(w){return (w.ja||"").split(/[、,（(]/)[0].trim();}
function sharedKanji(a,b){const A=new Set([...String(a)].filter(c=>/[一-龯々]/.test(c)));return [...String(b)].some(c=>A.has(c));}
/* 誤答タグ：2語の実際の関係から決定（タイプ診断 軸2用） */
function relationTag(w,x,key){
  if(sharedKanji(w.ja,x.ja))return"semantic_close";          // 意味類似（訳の漢字共有）
  if(w.cat&&x.cat&&w.cat===x.cat){
    if(w.cat==="家族・人物")return"role_confusion";          // 人物・家族関係の混同
    if(w.cat==="韓国文化")return"cultural_confusion";        // 韓国文化上の混同
    return"same_scene";                                      // 同じ場面
  }
  if(key==="ko"&&simKo(w,x)>=4)return"form_similar";         // 音・表記類似
  return"context_related";                                   // 周辺概念
}
/* 品詞を合わせつつ「意味類似＋場面連想＋周辺/表記類似」の構成で3つ選ぶ */
function pickTaggedDistractors(w,pool,key){
  const pos=posOf(w);
  const base=pool.filter(x=>x.id!==w.id&&x[key]!==w[key]&&x.ko!==w.ko&&jaHead(x)!==jaHead(w));
  let cands=base.filter(x=>posOf(x)===pos);
  if(cands.length<6)cands=base.filter(x=>(pos==="adj"||pos==="verb")?(posOf(x)==="adj"||posOf(x)==="verb"):(posOf(x)==="noun"||posOf(x)==="adv"));
  if(cands.length<6)cands=base;
  const used=new Set([w[key]]),out=[];
  const take=arr=>{for(const x of arr){if(!used.has(x[key])){used.add(x[key]);out.push({text:x[key],type:relationTag(w,x,key),wordId:x.id});return;}}};
  const bySem=shuffle(cands).sort((a,b)=>simJa(w,b)-simJa(w,a));   // 意味類似（漢字共有）優先
  const byScene=shuffle(cands).sort((a,b)=>((b.cat&&b.cat===w.cat)?1:0)-((a.cat&&a.cat===w.cat)?1:0)||simJa(w,b)-simJa(w,a));
  const byForm=shuffle(cands).sort((a,b)=>simKo(w,b)-simKo(w,a));  // 表記類似（韓国語の見た目）
  take(bySem.slice(0,6));
  take(byScene);
  take(key==="ko"?byForm.slice(0,6):byScene);
  for(const x of bySem){if(out.length>=3)break;if(!used.has(x[key])){used.add(x[key]);out.push({text:x[key],type:relationTag(w,x,key),wordId:x.id});}}
  return out.slice(0,3);
}
/* 選択肢セット（タグ付きメタ込み）。Section01の手作り誤答(d)は漢字共有で意味類似/場面連想に自動タグ付け */
function buildChoiceSet(w,pool,key){
  const meta={};meta[w[key]]={distractorType:null,wordId:w.id};
  const ds=(key==="ja"&&w.d)
    ?w.d.slice(0,3).map(t=>({text:t,type:sharedKanji(w.ja,t)?"semantic_close":"same_scene",wordId:null}))
    :pickTaggedDistractors(w,pool,key);
  ds.forEach(d=>{meta[d.text]={distractorType:d.type,wordId:d.wordId};});
  return{choices:shuffle([w[key],...ds.map(d=>d.text)]),meta};
}

/* 誤答候補は同レベルの全語彙から（強雨量/降水量のような紛らわしいペアを拾えるように） */
function levelAllWords(){return curLevel==="beginner"?BEGINNER_WORDS:WORDS.concat(MIDDLE_WORDS);}

/* idリスト(+source)からPLANに沿って12問を生成。誤答はタグ付き（品詞一致＋意味類似/場面連想/周辺概念の構成） */
function makeQuestionsFromIds(list){
  const pool=levelAllWords();
  return list.slice(0,12).map((c,i)=>{
    const w=WORD_BY_ID[c.id],type=PLAN[i];
    let choices=null,correct,cmeta=null;
    if(type==="kj"){const cs=buildChoiceSet(w,pool,"ja");correct=w.ja;choices=cs.choices;cmeta=cs.meta;}
    else if(type==="jk"){const cs=buildChoiceSet(w,pool,"ko");correct=w.ko;choices=cs.choices;cmeta=cs.meta;}
    else{correct=w.ko;}
    return {word:w,type,choices,correct,source:c.source,cmeta};
  });
}

/* 復習枠の候補を優先順位順に並べて n 件返す（現在Sectionの単語のみ） */
function pickReview(n,excludeIds,prog,stats){
  if(n<=0)return[];
  const poolSet=new Set(sectionIds());
  const exclude=new Set(excludeIds);
  const last=prog.lastTestIds||[],prev=prog.prevTestIds||[];
  const blocked=new Set(last.filter(id=>prev.includes(id))); // 直近2回連続→3回目を避ける
  const cand=[];
  const push=arr=>arr.forEach(id=>{if(poolSet.has(id)&&!exclude.has(id)&&!blocked.has(id)&&!cand.includes(id))cand.push(id);});
  const slow=id=>{const s=stats[id];return s&&s.lastAnswerStatus==="correct"&&s.averageResponseTimeMs>(s.lastAnswerType==="writing"?10000:5000);};
  push(last.filter(id=>{const s=stats[id];return s&&["incorrect","timeout","unknown"].includes(s.lastAnswerStatus);})); // 1.直前で不正解等
  push(last.filter(slow));                                                                                              // 2.直前で正解だが遅い
  push([...last,...prev]);                                                                                              // 3.直近1〜3回
  push(Object.keys(stats).map(Number).sort((a,b)=>(stats[b].lastReviewedAt||"").localeCompare(stats[a].lastReviewedAt||""))); // 4.過去出題済み
  return cand.slice(0,n);
}

/* 通常テスト：新出枠9＋復習枠3。現在Sectionの単語群と進捗で管理 */
/* 各単語の優先度スコア（忘れそう/緊急/難/直近ミス/形成必要/重要度） */
function priorityScore(w,st,nowMs){
  const C=MEMORY_CONFIG;
  const disp=displayMemoryScore(st,nowMs);
  const forgettingRisk=100-disp;
  const urgency=(st.nextReviewAt&&new Date(st.nextReviewAt).getTime()<=nowMs)?100:(st.hasSeen?0:100);
  const difficulty=(clampN(st.wordDifficulty||C.defaultWordDifficulty,C.minWordDifficulty,C.maxWordDifficulty)-C.minWordDifficulty)/(C.maxWordDifficulty-C.minWordDifficulty)*100;
  const recentMistake=(st.hasSeen&&st.lastAnswerStatus!=="correct")?100:0;
  const formingNeed=!st.hasEverCorrect?100:0;
  const importance=(w.importanceScore!=null?w.importanceScore:50);
  let ps=forgettingRisk*0.30+urgency*0.20+difficulty*0.15+recentMistake*0.15+formingNeed*0.10+importance*0.10;
  const today=dayKey(nowMs);
  if(st.lastReviewDay===today&&(st.sameDayCorrectCount||0)>=2)ps*=0.4; // 同日2回以上正解は下げる
  return ps;
}
function buildQuestions(){
  if(_boardTile)return buildBoardQuestions(); // すごろくのマス＝担当語＋復習補充で12問
  const prog=loadProgress(),stats=loadStats(),nowMs=Date.now();
  const POOL_IDS=sectionIds();
  // 直近2回連続で出した単語は3回目を避ける
  const last=prog.lastTestIds||[],prev=prog.prevTestIds||[];
  const blocked=new Set(last.filter(id=>prev.includes(id)));
  // 状態分類と優先度
  // 先にシャッフル: 優先度が同点（例: 全部newの新規ROOM）のとき01から順に出ず、ランダムになる
  const info=shuffle(POOL_IDS).map(id=>{const w=WORD_BY_ID[id],st=getStat(id,stats);return{id,w,st,state:wordState(st,nowMs),ps:priorityScore(w,st,nowMs)};});
  const seen=info.filter(x=>x.st.hasSeen).length;
  const coverage=seen/Math.max(1,POOL_IDS.length);
  // カテゴリ枠（coverageが低いと探索を増やす）
  let quota=coverage<0.6?{nf:5,urgent:4,review:2,stabilizing:1,stable:0}:{nf:3,urgent:4,review:3,stabilizing:1,stable:1};
  const buckets={nf:[],urgent:[],review:[],stabilizing:[],stable:[]};
  info.forEach(x=>{
    if(blocked.has(x.id))return;
    if(x.state==="new"||x.state==="forming")buckets.nf.push(x);
    else if(x.state==="urgent")buckets.urgent.push(x);
    else if(x.state==="review")buckets.review.push(x);
    else if(x.state==="stabilizing")buckets.stabilizing.push(x);
    else buckets.stable.push(x);
  });
  for(const k in buckets)buckets[k].sort((a,b)=>b.ps-a.ps);
  // 枠ごとに抽出（偏り防止）→不足分は全体の優先度で補充
  const chosen=[],used=new Set();
  const take=(arr,n)=>{for(const x of arr){if(chosen.length>=12||n<=0)break;if(!used.has(x.id)){chosen.push(x);used.add(x.id);n--;}}};
  take(buckets.nf,quota.nf);take(buckets.urgent,quota.urgent);take(buckets.review,quota.review);take(buckets.stabilizing,quota.stabilizing);take(buckets.stable,quota.stable);
  if(chosen.length<12){
    const rest=info.filter(x=>!used.has(x.id)&&!blocked.has(x.id)).sort((a,b)=>b.ps-a.ps);
    take(rest,12-chosen.length);
  }
  if(chosen.length<12){ // それでも足りなければblocked解除して補充
    const rest=info.filter(x=>!used.has(x.id)).sort((a,b)=>b.ps-a.ps);
    take(rest,12-chosen.length);
  }
  // 形成/安定が書き取り枠(末尾2問)に来るよう並べ替え（出題形式を状態に寄せる）
  const writeRank=x=>(x.state==="stable"?3:x.state==="stabilizing"?2:0);
  chosen.sort((a,b)=>writeRank(a)-writeRank(b)); // 書き取り向きを後ろへ
  const list=chosen.slice(0,12).map(x=>({id:x.id,source:(x.state==="new"||x.state==="forming")?"new":"review"}));
  // 進捗保存（未接触の出題を記録）
  let served=new Set(prog.served||[]);
  list.forEach(c=>served.add(c.id));
  prog.served=Array.from(served);
  prog.prevTestIds=prog.lastTestIds||[];
  prog.lastTestIds=list.map(c=>c.id);
  saveProgress(prog);
  return makeQuestionsFromIds(list);
}

/* 復習テスト：指定idだけ（不足分は現在Sectionから補い12問に） */
function buildReviewQuestions(ids){
  let pool=ids.slice();
  const POOL_IDS=sectionIds();
  if(pool.length<12){ const used=new Set(pool); for(const id of shuffle(POOL_IDS.filter(id=>!used.has(id)))){ if(pool.length>=12)break; pool.push(id); } }
  const list=shuffle(pool.slice(0,12)).map(id=>({id,source:"review"}));
  const prog=loadProgress(); prog.prevTestIds=prog.lastTestIds||[]; prog.lastTestIds=list.map(c=>c.id); saveProgress(prog);
  return makeQuestionsFromIds(list);
}
const DIRECTION={jk:"jp_to_kr",kj:"kr_to_jp",w:"jp_to_kr",pz:"jp_to_kr"};
const ANS_TYPE={jk:"choice",kj:"choice",w:"writing",pz:"choice"};

/* 採点 */
function scoreFor(type,isCorrect,t,isHint){
  if(!isCorrect)return 0;
  if(type==="w"){const base=t<10?10:9;return isHint?Math.ceil(base/2):base;} // 書き取り：ヒント付きは半分（小数は切り上げ）
  return t<5?8:7;                        // 四択：5秒未満=8, 5〜10=7
}
function rankFor(s){if(s===100)return"S";if(s<=50)return"D";if(s<=70)return"C";if(s<=80)return"B";return"A";}

/* ============================================================ 今日の5問テスト ============================================================
 * ・1日2回（朝の部 0:00-11:59／夜の部 12:00-23:59）、各1回ずつだけ挑戦できる
 * ・4択が5問。回答中は正誤を一切出さない（正解音・正解音声・玉の演出も止める）
 * ・5問目のあと、専用の結果画面で1問ずつ順に○×を判定表示 → 判定しきったらレア演出音
 * ・記憶スコア（忘却エンジン）は通常テストと同じく submit() 内で更新される */
const LS_D5="kwt_daily5_v1";
const D5_N=5, D5_PLAN=["jk","kj","jk","kj","jk"]; // 全問4択（日→韓／韓→日を交互）
let _d5={on:false,slot:"",key:""},_d5Timer=null;
const D5_AM=5,D5_PM=17; // 朝の部/夜の部の切り替え時刻
function d5Slot(ms){const h=new Date(ms).getHours();return (h>=D5_AM&&h<D5_PM)?"am":"pm";}
function d5SlotLabel(s){return s==="am"?"朝の部":"夜の部";}
function d5SlotTime(s){return s==="am"?"5:00–16:59":"17:00–4:59";}
function d5Key(ms){return dayKey(ms-D5_AM*3600000)+"#"+d5Slot(ms);} // 深夜0〜5時は前日の夜の部として扱う
function loadD5(){return _lsJSON(LS_D5,()=>({}));}
function saveD5(o){const ks=Object.keys(o);if(ks.length>40)ks.slice(0,ks.length-40).forEach(k=>delete o[k]);_lsSetJSON(LS_D5,o);} // 古い枠は間引き
function d5Rec(ms){return loadD5()[d5Key(ms||Date.now())]||null;}
/* 今日の5問を遊んだ日の連続記録（朝夜どちらか1回でもその日は達成） */
function d5Streak(){
  const rec=loadD5(),days=new Set();
  Object.keys(rec).forEach(k=>{if(rec[k]&&rec[k].done)days.add(k.split("#")[0]);});
  if(!days.size)return 0;
  let n=0;const d=new Date(Date.now()-D5_AM*3600000);
  if(!days.has(dayKey(d.getTime())))d.setDate(d.getDate()-1); // 今日まだなら昨日から数える
  while(days.has(dayKey(d.getTime()))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function d5Used(ms){return !!d5Rec(ms);}
/* その枠を「消化ずみ」と見なすのは最後までやり切ったときだけ。
   途中で戻った（中断した）枠は、もう一度タッチすればやり直せる（メール指示 2026-07-29） */
function d5Done(ms){const r=d5Rec(ms);return !!(r&&r.done);}
function d5NextOpenAt(ms){
  const d=new Date(ms),h=d.getHours();
  if(h<D5_AM)d.setHours(D5_AM,0,0,0);                              // 深夜 → 今日の5:00
  else if(h<D5_PM)d.setHours(D5_PM,0,0,0);                         // 朝の部 → 今日の17:00
  else{d.setDate(d.getDate()+1);d.setHours(D5_AM,0,0,0);}          // 夜の部 → 翌5:00
  return d.getTime();
}
function d5Countdown(ms){let s=Math.max(0,Math.round((d5NextOpenAt(ms)-ms)/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s=s%60;const p=n=>String(n).padStart(2,"0");return h+":"+p(m)+":"+p(s);}
/* その日・その枠で出題を固定するための決定的乱数（＝「今日の5問」は何度開いても同じ） */
function _d5Hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function _d5Rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function d5PickIds(){
  const rnd=_d5Rng(_d5Hash("kwt-d5|"+d5Key(Date.now())+"|"+curLevel));
  const pool=levelAllWords().filter(w=>w&&w.ko&&w.ja);
  const ids=[],used=new Set();
  for(let g=0;g<900&&ids.length<D5_N;g++){
    const w=pool[Math.floor(rnd()*pool.length)];
    if(!w||used.has(w.id))continue;
    used.add(w.id);ids.push(w.id);
  }
  return ids;
}
function buildDaily5Questions(){
  const pool=levelAllWords();
  return d5PickIds().map((id,i)=>{
    const w=WORD_BY_ID[id],type=D5_PLAN[i]||"jk";
    const cs=buildChoiceSet(w,pool,type==="kj"?"ja":"ko");
    return{word:w,type,choices:cs.choices,correct:type==="kj"?w.ja:w.ko,source:"daily5",cmeta:cs.meta};
  });
}

function d5AnchorBtn(sel){
  const vw=innerWidth,vh=innerHeight;let best=null,bestA=0;
  document.querySelectorAll(sel||".sg-d5").forEach(b=>{
    const r=b.getBoundingClientRect();
    const a=Math.max(0,Math.min(r.right,vw)-Math.max(r.left,0))*Math.max(0,Math.min(r.bottom,vh)-Math.max(r.top,0));
    if(a>bestA){bestA=a;best=b;}
  });
  return best;
}
/* 吹き出しをボタンの真上に置く（上に入らなければ下向きに反転、はみ出す側は画面内へ寄せる）
   card を渡すと、その吹き出し（自動スタートの吹き出しなど）を同じ計算で置く */
function d5AnchorBubble(sel,card){
  card=card||document.querySelector("#d5-modal .d5-card");if(!card)return;
  const btn=d5AnchorBtn(sel),vw=innerWidth,vh=innerHeight,W=card.offsetWidth,H=card.offsetHeight,GAP=16,M=8;
  let cx=vw/2,top,flip=false;
  if(btn){
    const r=btn.getBoundingClientRect();
    cx=r.left+r.width/2;top=r.top-GAP-H;
    if(top<M){top=Math.min(vh-H-M,r.bottom+GAP);flip=true;}
  }else top=Math.max(M,(vh-H)/2);
  const left=Math.max(M,Math.min(vw-W-M,Math.round(cx-W/2)));
  card.style.left=left+"px";card.style.top=Math.round(Math.max(M,top))+"px";
  // しっぽ（11px）はカードの角丸(20px)に掛かると根元が欠けて見えるので、必ず平らな辺の上に収める
  const TAIL=11,RAD=20,PAD=RAD+TAIL+2;
  const tx=Math.round(Math.max(PAD,Math.min(W-PAD,cx-left)));
  card.style.setProperty("--tx",tx+"px");
  card.classList.toggle("flip",flip);
  // ボタンが画面の左端／右端に寄っているときは、しっぽも斜め（左下向き／右下向き）にしてボタンを指す
  card.classList.toggle("edge-l",!flip&&tx<W*0.28);
  card.classList.toggle("edge-r",!flip&&tx>W*0.72);
}

/* ============================================================ 今日のトレンド問題 ============================================================
 * ・Xで流れているK-POPのトレンドから拾った5単語（trend-words.js）で遊ぶ、1日1回のおまけモード
 * ・出題の骨格・結果画面は「今日の5問」と同じものを使う（_d5.mode==="trend"）
 * ・単語帳の外の言葉なので、記憶エンジン（忘却/形成）・単語カード・回答履歴には入れない */
const LS_TREND="kwt_trend_v1";
/* 1日の区切りは5:00（今日の5問と同じ）。trend-words.js のキーと突き合わせるので0埋めのYYYY-MM-DDで作る
   （アプリ内の dayKey() は "2026-7-8" 形式なので、そのままでは日付の大小比較に使えない） */
function trendDayKey(ms){
  const d=new Date((ms||Date.now())-D5_AM*3600000),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
/* その日ぶんが無ければ、いちばん新しい日付ぶんで遊べるようにする */
function trendEntry(ms){
  if(typeof TREND_WORDS==="undefined"||!TREND_WORDS)return null;
  const k=trendDayKey(ms),e=TREND_WORDS[k];
  if(e&&e.words&&e.words.length)return Object.assign({},e,{key:k,fresh:true});
  const all=Object.keys(TREND_WORDS).sort();
  const past=all.filter(x=>x<=k);
  const lk=past.length?past[past.length-1]:all[0]; // 過去ぶんが無ければいちばん古いぶんで遊べるようにする
  const le=lk?TREND_WORDS[lk]:null;
  return (le&&le.words&&le.words.length)?Object.assign({},le,{key:lk,fresh:false}):null;
}
function trendAvailable(ms){return !!trendEntry(ms)&&d5Done(ms);} // 今日の5問を「最後まで」終えた日だけ出す
function loadTrend(){return _lsJSON(LS_TREND,()=>({}));}
function saveTrend(o){const ks=Object.keys(o);if(ks.length>40)ks.slice(0,ks.length-40).forEach(k=>delete o[k]);_lsSetJSON(LS_TREND,o);}
function trendRec(ms){return loadTrend()[trendDayKey(ms)]||null;}
function trendUsed(ms){return !!trendRec(ms);}
function trendWords(){
  const e=trendEntry();if(!e)return[];
  return e.words.slice(0,D5_N).map((w,i)=>({id:"trend-"+e.key+"-"+i,ko:w.ko,ja:w.ja,read:w.read||"",note:w.note||""}));
}
function buildTrendQuestions(){
  const pool=levelAllWords(),ws=trendWords();
  return ws.map((w,i)=>{
    const type=D5_PLAN[i]||"jk";
    const cs=buildChoiceSet(w,pool,type==="kj"?"ja":"ko");
    return{word:w,type,choices:cs.choices,correct:type==="kj"?w.ja:w.ko,source:"trend",trend:true,cmeta:cs.meta};
  });
}

function boardLapSize(level,sec){ // 100語→12マス（8.33語/マス）。語数に比例して増減
  const n=((LEVEL_SECTIONS[level]||{})[sec]||[]).length;

function boardKey(level,sec){return level+"-"+String(sec).padStart(2,"0");}
/* これまでの学習履歴ぶんだけすごろくを進める（1度だけ）。
 * ・12問を完走したテストを、そのROOMのマスとして古い順に埋める
 * ・履歴は90日で間引かれるため、記憶データ(reviewCount)からも「そのROOMで何回ぶん解いたか」を見積もり、多いほうを採る
 * ・すでに進めているぶんは絶対に下げない（マージする） */
(function boardSeedFromHistory(){
  try{
    if(localStorage.getItem("kwt_boardseed_v2"))return;
    localStorage.setItem("kwt_boardseed_v2","1");
    const m=secOfWord(),tests={},secOf={};
    loadHistory().forEach(r=>{
      const k=m[r.wordId];if(!k||!r.testId)return;
      const t=tests[r.testId]||(tests[r.testId]={sec:k,score:0,n:0,at:r.answeredAt||""});
      t.score+=(r.score||0);t.n++;if((r.answeredAt||"")>t.at)t.at=r.answeredAt||t.at;
    });
    const per={};
    Object.keys(tests).forEach(id=>{const t=tests[id];if(t.n<12)return;(per[t.sec]=per[t.sec]||[]).push(t);});
    // 履歴が間引かれていても取りこぼさないよう、単語ごとの回答回数からも見積もる
    const stats=loadStats(),ans={};
    Object.keys(stats).forEach(id=>{const k=m[id];if(!k)return;ans[k]=(ans[k]||0)+((stats[id]||{}).reviewCount||0);});
    const board=loadBoard();let changed=false;
    const keys=new Set(Object.keys(per).concat(Object.keys(ans)));
    keys.forEach(sec=>{
      const [lv,num]=sec.split("-"),key=lv+"-"+String(num).padStart(2,"0");
      const list=(per[sec]||[]).sort((a,b)=>a.at<b.at?-1:1);
      const want=Math.max(list.length,Math.floor((ans[sec]||0)/SG_QPT));
      if(want<=0)return;
      const cur=board[key]||{cleared:0,tiles:{}};
      list.forEach((t,i)=>{const g=i+1;if(!cur.tiles[g]){const sc=Math.min(100,Math.ceil(t.score));cur.tiles[g]={rank:rankFor(sc),score:sc,at:t.at};}});
      if(want>(cur.cleared||0)){cur.cleared=want;changed=true;}
      board[key]=cur;
    });
    if(changed)_lsSetJSON(LS_BOARD,board);
  }catch(e){}
})();
function loadBoard(){return _lsJSON(LS_BOARD,()=>({}));}
function boardState(level,sec){const b=loadBoard()[boardKey(level,sec)];return{cleared:(b&&b.cleared)||0,tiles:(b&&b.tiles)||{}};}
function boardVisible(level,sec){const L=boardLapSize(level,sec);return (Math.floor(boardState(level,sec).cleared/L)+1)*L;} // 現在の周ぶんまで表示（1周こなすと次の周が伸びる）
function boardClear(t,rank,score){
  const all=loadBoard(),k=boardKey(t.level,t.sec),st=all[k]||{cleared:0,tiles:{}};
  const prev=st.tiles[t.gidx];

/* その周でこのマスが担当する語（周ごとに決定的シャッフルして均等配分＝1周で必ず全語を消化） */
function boardTileWords(level,sec,lap,idx){
  const ids=((LEVEL_SECTIONS[level]||{})[sec]||[]);
  const L=boardLapSize(level,sec),rnd=_d5Rng(_d5Hash("kwt-board|"+level+"|"+sec+"|lap"+lap));
  const sh=ids.slice();for(let i=sh.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[sh[i],sh[j]]=[sh[j],sh[i]];}
  const base=Math.floor(sh.length/L),extra=sh.length%L;
  let start=0;
  for(let k=0;k<L;k++){const take=base+(k<extra?1:0);if(k===idx)return sh.slice(start,start+take);start+=take;}
  return [];

/* すごろく用の出題：担当語（初出枠）＋残りを忘却曲線の優先度で復習補充して12問 */
function buildBoardQuestions(){
  const t=_boardTile,L=boardLapSize(t.level,t.sec);
  const lap=Math.floor((t.gidx-1)/L)+1,idx=(t.gidx-1)%L;
  const cover=boardTileWords(t.level,t.sec,lap,idx);
  const stats=loadStats(),now=Date.now(),prog=loadProgress();
  const last=prog.lastTestIds||[],prev=prog.prevTestIds||[];
  const blocked=new Set(last.filter(id=>prev.includes(id))); // 3回連続で同じ語を出さない（従来ルール）
  const used=new Set(cover);
  const all=((LEVEL_SECTIONS[t.level]||{})[t.sec]||[]);
  const cand=all.filter(id=>!used.has(id)&&!blocked.has(id))
    .map(id=>{const st=getStat(id,stats);return{id,seen:st.hasSeen?1:0,ps:priorityScore(WORD_BY_ID[id],st,now)};})
    .sort((a,b)=>(b.seen-a.seen)||(b.ps-a.ps)); // 既習を優先し、その中で復習優先度順
  const list=cover.map(id=>({id,source:"new"}));
  for(const c of cand){if(list.length>=SG_QPT)break;list.push({id:c.id,source:"review"});}
  if(list.length<SG_QPT){ // それでも足りなければブロック解除で補充
    const have=new Set(list.map(c=>c.id));
    for(const id of all){if(list.length>=SG_QPT)break;if(!have.has(id)){list.push({id,source:"review"});have.add(id);}}
  }
  const out=shuffle(list).slice(0,SG_QPT);
  const wr=c=>{const s=wordState(getStat(c.id,stats),now);return s==="stable"?3:s==="stabilizing"?2:0;};
  out.sort((a,b)=>wr(a)-wr(b)); // 書き取り枠(末尾2問)には定着した語を寄せる（従来と同じ）
  const p=loadProgress();p.prevTestIds=p.lastTestIds||[];p.lastTestIds=out.map(c=>c.id);
  const served=new Set(p.served||[]);out.forEach(c=>served.add(c.id));p.served=Array.from(served);saveProgress(p);
  return makeQuestionsFromIds(out);
}

/* マス1が最下部で、番号が増えるほど上へ登っていく（下から上へ遡る） */
function sgPos(i,total){return{x:Math.round(SG_CX+SG_AMP*Math.sin(i*SG_FREQ)),y:SG_TOP+SG_HEADROOM+(total-1-i)*SG_STEP};}
function sgTrackH(total){return SG_TOP*2+SG_HEADROOM+(total-1)*SG_STEP;}
function sgTileImg(ids,fallbackIds){
  if(typeof WORD_IMG==="undefined")return null;
  for(const id of ids){const w=WORD_BY_ID[id];if(w&&WORD_IMG[w.ko])return WORD_IMG[w.ko];}
  for(const id of (fallbackIds||[])){const w=WORD_BY_ID[id];if(w&&WORD_IMG[w.ko])return WORD_IMG[w.ko];} // マスの上には常に何かが乗るようにする
  return null;

/* 中心線を3次ベジェでサンプリングし、法線まで先に計算しておく（毎フレームの計算量を減らす） */
function sgSamples(pts){
  const S=[],N=6; // 1区間あたりのサンプル数（多すぎるとスクロール時の再計算が重くなる）
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],my=(a.y+b.y)/2;
    for(let k=0;k<N;k++){
      const t=k/N,u=1-t;
      S.push({x:u*u*u*a.x+3*u*u*t*a.x+3*u*t*t*b.x+t*t*t*b.x,
              y:u*u*u*a.y+3*u*u*t*my +3*u*t*t*my +t*t*t*b.y});
    }
  }
  if(pts.length)S.push({x:pts[pts.length-1].x,y:pts[pts.length-1].y});
  for(let i=0;i<S.length;i++){                       // 法線は形が変わらないので事前計算
    const q=S[Math.min(S.length-1,i+1)],r=S[Math.max(0,i-1)];
    const dx=q.x-r.x,dy=q.y-r.y,len=Math.hypot(dx,dy)||1;
    S[i].nx=-dy/len;S[i].ny=dx/len;
    S[i].wv=Math.sin(i*0.62)+0.5*Math.sin(i*1.37); // 道幅のゆらぎ（毎フレーム計算しないよう事前に持つ）
  }
  return S;
}
/* 画面内の高さで奥行きを決める：下＝近い(等倍) / 上＝遠い(縮小＋上へ圧縮)。斜めから見た台形の道になる */
function sgPersp(y,top,h,out){
  const v=(y-top)/h;
  const vp=v<=0?v*0.55:(v>=1?v:v*v*(1.85-0.85*v));   // pow()を使わず滑らかに遠方を圧縮（毎フレーム呼ぶので軽く）
  out.ty=(vp-v)*h;
  out.k=1-SG_FAR*(1-(vp<0?0:vp>1?1:vp));
  return out;
}
const _sgQ={ty:0,k:1},_sgQ2={ty:0,k:1};
/* スクロールに合わせて道の台形とマスの大小を更新。
 * レイアウト読み取り(clientHeight)は事前に持ち回り、文字列生成も最小限にしてスクロール中のカクつきを抑える。 */
function sgApplyDepth(sc){
  if(!sc||!sc._sg)return;
  const g=sc._sg,h=g.h||1,top=sc.scrollTop,S=g.samples;
  for(let i=0;i<g.movers.length;i++){
    const el=g.movers[i],q=sgPersp(el._y,top,h,_sgQ);
    const tx=(SG_CX-el._x)*(1-q.k);
    el.style.transform="translate3d("+(tx*10|0)/10+"px,"+(q.ty*10|0)/10+"px,0) scale("+(q.k*1000|0)/1000+")";
  }
  for(let i=0;i<g.tiles.length;i++){
    const t=g.tiles[i];
    t.style.zIndex=(4+(sgPersp(t._y,top,h,_sgQ2).k*40|0))+"";
  }
  const n=S.length,L=g.bufL,R=g.bufR;
  for(let w=0;w<g.halves.length;w++){
    const half=g.halves[w];
    for(let i=0;i<n;i++){
      const p=S[i],q=sgPersp(p.y,top,h,_sgQ),ww=half*q.k*(1+0.055*p.wv); // 幅を少し揺らして自然な小道に
      const cx=SG_CX+(p.x-SG_CX)*q.k,cy=p.y+q.ty;
      L[i]=((cx+p.nx*ww)*10|0)/10+" "+((cy+p.ny*ww)*10|0)/10;
      R[n-1-i]=((cx-p.nx*ww)*10|0)/10+" "+((cy-p.ny*ww)*10|0)/10;
    }
    g.paths[w].setAttribute("d","M"+L.join("L")+"L"+R.join("L")+"Z");
  }
}
function sgBind(sc){
  if(!sc||sc.dataset.sgbound)return;sc.dataset.sgbound="1";
  // 1フレーム0.1ms程度と軽いのでrAFを挟まず同フレームで更新する（挟むと描画が1フレーム遅れ、速いスクロールで揺れて見える）
  sc.addEventListener("scroll",()=>{sgApplyDepth(sc);sgSyncHome(sc);},{passive:true});
  sc.addEventListener("touchmove",()=>sgApplyDepth(sc),{passive:true});
  // ダブルタップで現在地（スタートのマス）へ戻る。
  // マスの上で始めても「1回目=カウントダウン開始 / 2回目=取り消し」になるのでテストは始まらない。
  let dt=0,px=0,py=0,sx=0,sy=0;
  sc.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;},{passive:true});
  sc.addEventListener("pointerup",e=>{
    if(Math.abs(e.clientX-sx)>12||Math.abs(e.clientY-sy)>12){dt=0;return;} // 動かした指（スクロール）は数えない
    const t=e.timeStamp||0;
    if(t-dt<400&&Math.abs(e.clientX-px)<40&&Math.abs(e.clientY-py)<40){dt=0;sgScrollToCurrent(+sc.dataset.n,true);}
    else{dt=t;px=e.clientX;py=e.clientY;}
  },{passive:true});
}
function sgHydrate(n){
  const sc=document.querySelector('.room-slide[data-n="'+n+'"] .sg-scroll');if(!sc)return;
  const tiles=[...sc.querySelectorAll(".sg-tile")],decos=[...sc.querySelectorAll(".sg-deco")];

  movers.forEach(t=>{t._x=parseFloat(t.dataset.x);t._y=parseFloat(t.dataset.y);});
  const pts=tiles.map(t=>({x:t._x,y:t._y})).sort((a,b)=>a.y-b.y);
  const samples=sgSamples(pts);
  sc._sg={tiles,movers,samples,h:sc.clientHeight||506,
    bufL:new Array(samples.length),bufR:new Array(samples.length),
    halves:[26,21],

  if(sc._sg.paths.some(p=>!p))return;

}

/* スペシャル問題：初級・中級それぞれで3ROOMだけ「スペシャル問題発生中！」になる。
 *   青ROOM … 韓国語の風船3つ × 日本語の大砲3つ（組み合わせ当て）
 *   赤ROOM … 韓国語の風船1つ（出題）× 日本語の大砲4つ（4択）
 *   緑ROOM … ジグソーパズルの穴うめ（12問すべてがこの形式）
 * 青・赤ROOMのテストには5〜11問目のどこかにシューティングが1問だけ混ざる（採点・記憶スコアには入らない）。
 * テストを1本終えるたびに、6つとも別のROOMへ入れ替わる。 */
const LS_SPECIAL="kwt_special_v4";
let _spCache=null;
function _spPick(level,exclude){
  const secs=Object.keys(LEVEL_SECTIONS[level]||{}).map(Number).filter(x=>x>0).sort((a,b)=>a-b);
  if(!secs.length)return 0;
  const pool=secs.filter(n=>exclude.indexOf(n)<0);
  const src=pool.length?pool:secs; // ROOMが少ない級でも必ず1つ返す
  return src[Math.floor(Math.random()*src.length)];
}
function _spRoll(prev){
  const o={};
  ["beginner","middle"].forEach(lv=>{
    const p=(prev&&prev[lv])||{};
    const blue=_spPick(lv,[p.blue,p.red,p.green].filter(Boolean));   // 直前と同じROOMは避ける
    const red=_spPick(lv,[p.blue,p.red,p.green,blue].filter(Boolean));
    const green=_spPick(lv,[p.blue,p.red,p.green,blue,red].filter(Boolean));
    o[lv]={blue,red,green};
  });
  return o;
}
function specialRooms(){
  if(_spCache)return _spCache;
  let o=null;try{o=JSON.parse(localStorage.getItem(LS_SPECIAL)||"null");}catch(e){}
  if(!o||!o.beginner||!o.middle||!o.beginner.blue||!o.middle.blue||!o.beginner.green||!o.middle.green){
    o=_spRoll(null);try{localStorage.setItem(LS_SPECIAL,JSON.stringify(o));}catch(e){}
  }
  _spCache=o;return o;
}
/* テストを1本終えるたびに呼ぶ：スペシャルROOMを全部ほかのROOMへ切り替える */
function rerollSpecial(){
  const o=_spRoll(specialRooms());
  try{localStorage.setItem(LS_SPECIAL,JSON.stringify(o));}catch(e){}
  _spCache=o;return o;
}
function specialKind(level,n){
  const o=specialRooms()[level]||{};

/* ============================================================ 歯車モード（設定でONにするとスタートボタンが歯車出題に切替） ============================================================
 * 中央の4歯ダイヤルに韓国語、上下左右に日本語。タップで90°ずつ回して全対応を合わせ「回答」で判定。
 * 遊び方が全く別系統のため記憶エンジン（memoryScore等）は更新しない自己完結モード。 */
const GEAR_ROUNDS=6,GEAR_LIMIT=20;
let _gearActive=false,_gearTimer=null,_gearStart=0,_gearAnswered=false;
let _gear={rounds:[],idx:0,score:0,rot:0,shift:0,oks:[]};

function _gearBuildRounds(){
  // 現在ROOMの単語からラウンドごとに4語ずつ。プールが足りなければシャッフルして継ぎ足す
  let pool=shuffle(sectionPoolWords().filter(w=>w));
  while(pool.length<GEAR_ROUNDS*4)pool=pool.concat(shuffle(sectionPoolWords().filter(w=>w)));
  const rounds=[];
  for(let i=0;i<GEAR_ROUNDS;i++){
    const seg=pool.slice(i*4,i*4+4),seen=new Set(),words=[];
    seg.forEach(w=>{if(!seen.has(w.id)){seen.add(w.id);words.push(w);}});
    let j=0;while(words.length<4){const w=pool[(GEAR_ROUNDS*4+j++)%pool.length];if(w&&!seen.has(w.id)){seen.add(w.id);words.push(w);}}
    rounds.push(words);
  }
  return rounds;
}

function startGearQuiz(){
  _gear={rounds:_gearBuildRounds(),idx:0,score:0,rot:0,shift:0,oks:[]};
  _gearActive=true;_gearAnswered=false;
  if(state)state.pq=false; // 直前がプリQQでもピンクテーマを引き継がない
  sfxStart();
  if(typeof track==="function")track("quiz_start",{gear:true});
  qrStopRain();qrClearLayer("q-rain");QR.active="q-rain";
  show("s-quiz");
  const qa=document.getElementById("qadv");if(qa)qa.style.visibility="hidden"; // 進み方スイッチは歯車モードでは使わない
  showCountdown(()=>renderGearRound());
}

const GEAR_ANG=[45,135,225,315]; // 韓国語の配置角（クロス斜め）。日本語も同じ角度の外周に置き同一直線上へそろえる
const GEAR_OFF=0; // 韓国語ディスクと日本語を同じ対角線上にそろえる（正解時に韓国語→日本語が一直線で対応）
function renderGearRound(){
  if(!_gearActive)return;
  const words=_gear.rounds[_gear.idx];
  _gear.rot=0;_gear.deg=0;_gear.shift=1+Math.floor(Math.random()*3); // 開始時点で必ずズレた状態から
  _gearAnswered=false;
  document.getElementById("prog").textContent=(_gear.idx+1)+" / "+GEAR_ROUNDS;
  const qa=document.getElementById("qadv");if(qa)qa.style.visibility="hidden";
  // ディスク位置tには words[(t+shift)%4] の韓国語（回転rでshiftと一致したら全対応が揃う）
  // 日本語 gja-i は対応する韓国語スロットと同じ角度(GEAR_ANG[i]+GEAR_OFF)の外周に配置＝正解時に韓国語と同一直線上へそろう
  document.getElementById("qstage").innerHTML=`
    <div class="gear-stage">
      <div class="gear-hint">⚙️ ダイヤルを回して、意味を合わせよう</div>
      <div class="gear-board">
        ${words.map((w,i)=>{const a=GEAR_ANG[i]+GEAR_OFF;return `<div class="gear-ja" id="gja-${i}" style="transform:translate(-50%,-50%) rotate(${a}deg) translateY(calc(var(--gs)*-.72)) rotate(${-a}deg)">${esc(w.ja)}</div>`;}).join("")}
        <div class="gear-dial" id="gear-dial" role="button" aria-label="ダイヤルを回す">
          <div class="gear-body" id="gear-body">
            <div class="gear-core"></div>
            ${GEAR_ANG.map(a=>`<div class="gear-notch" style="transform:rotate(${a+GEAR_OFF}deg) translateY(calc(var(--gs)*-.44))"></div>`).join("")}
          </div>
          ${GEAR_ANG.map((a,t)=>`<div class="gear-ko" id="gko-${t}" style="transform:rotate(${a+GEAR_OFF}deg) translateY(calc(var(--gs)*-.31)) rotate(${-(a+GEAR_OFF)}deg)">${esc(words[(t+_gear.shift)%4].ko)}</div>`).join("")}
          <div class="gear-hub">⟲⟳</div>
        </div>
      </div>
    </div>
    <div class="gear-bottom"><button class="gear-answer" id="gear-answer">回答</button></div>`;
  _gearBindDrag(document.getElementById("gear-dial"));
  document.getElementById("gear-answer").addEventListener("click",gearSubmit);
  _gearStartTimer();
}

/* 回転を描画：ディスクを回し、韓国語は軌道上を回りつつ文字は常に正立 */
function _gearApplyDeg(){
  const deg=_gear.deg;
  const body=document.getElementById("gear-body");if(body)body.style.transform=`rotate(${deg}deg)`;
  for(let t=0;t<4;t++){
    const el=document.getElementById("gko-"+t);if(!el)continue;
    const a=GEAR_ANG[t]+GEAR_OFF+deg;
    el.style.transform=`rotate(${a}deg) translateY(calc(var(--gs)*-.31)) rotate(${-a}deg)`;
  }
}
function _gearApplyRot(){_gear.deg=_gear.rot*90;_gearApplyDeg();}

/* ドラッグ/スワイプで両方向に回転。指を離すと最寄りの90°へスナップ。ほぼ動かさなければタップ＝時計回り90° */
function _gearBindDrag(dial){
  let dragging=false,lastA=0,startDeg=0,moved=0,pid=null;
  const center=()=>{const r=dial.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};};
  const angleAt=(e)=>{const c=center();return Math.atan2(e.clientY-c.y,e.clientX-c.x)*180/Math.PI;};
  dial.addEventListener("pointerdown",e=>{
    if(_gearAnswered)return;
    dragging=true;pid=e.pointerId;lastA=angleAt(e);startDeg=_gear.deg;moved=0;
    dial.classList.add("dragging");
    try{dial.setPointerCapture(e.pointerId);}catch(_){}
    e.preventDefault();
  });
  dial.addEventListener("pointermove",e=>{
    if(!dragging||e.pointerId!==pid)return;
    const a=angleAt(e);
    let d=a-lastA;if(d>180)d-=360;else if(d<-180)d+=360; // 角度の巻き戻りを補正
    lastA=a;moved+=Math.abs(d);
    _gear.deg+=d;_gearApplyDeg();
  });
  const finish=()=>{
    if(!dragging)return;dragging=false;dial.classList.remove("dragging");
    if(moved<8){_gear.deg=startDeg;_gear.rot=Math.round(startDeg/90)+1;} // タップ＝時計回りに1歯
    else _gear.rot=Math.round(_gear.deg/90); // ドラッグ＝最寄りの位置へスナップ（反回転もそのまま）
    sfxGearTick();_gearApplyRot();
  };
  dial.addEventListener("pointerup",finish);
  dial.addEventListener("pointercancel",()=>{dragging=false;dial.classList.remove("dragging");_gearApplyRot();});
}

function sfxGearTick(){if(loadSettings().sound===false)return;const c=_sfx();if(!c)return;const t=c.currentTime;_tone(c,620,t,0.04,0.09,"square");_tone(c,880,t+0.03,0.05,0.07,"square");} // カチッという回転音

function _gearStartTimer(resume){
  clearInterval(_gearTimer);
  const limit=Math.round(GEAR_LIMIT*(loadSettings().slowTimer?1.5:1));
  if(!resume)_gearStart=performance.now(); // 中断ダイアログ復帰時は計時を引き継ぐ
  const tick=()=>{
    const el=(performance.now()-_gearStart)/1000,remain=Math.max(0,limit-el);
    const fill=document.getElementById("tfill"),tt=document.getElementById("time");
    if(fill){fill.style.width=(remain/limit*100)+"%";fill.className="tfill"+(remain<=limit*0.3?" warn":"");}
    if(tt)tt.textContent=remain.toFixed(1);
    if(remain<=0){clearInterval(_gearTimer);if(!_gearAnswered)gearSubmit(true);}
  };
  tick();_gearTimer=setInterval(tick,100);
}

function gearSubmit(isTimeout){
  if(_gearAnswered||!_gearActive)return;_gearAnswered=true;clearInterval(_gearTimer);
  _gear.rot=Math.round(_gear.deg/90); // ドラッグ途中でも現在角度から確定
  const ok=isTimeout!==true&&(((_gear.rot%4)+4)%4)===_gear.shift;
  _gear.oks.push(ok);if(ok)_gear.score++;
  const ans=document.getElementById("gear-answer");if(ans)ans.disabled=true;
  const flash=(cls,sym)=>{const ov=document.createElement("div");ov.className="overlay";ov.style.pointerEvents="none";ov.innerHTML=`<div class="ovsym ${cls}">${sym}</div>`;document.body.appendChild(ov);setTimeout(()=>ov.remove(),ok?1100:2100);};
  const markAll=()=>{for(let i=0;i<4;i++){const el=document.getElementById("gja-"+i);if(el)el.classList.add("hit");}};
  if(ok){
    sfxCorrect();flash("o","○");markAll();
    setTimeout(_gearNext,1300);
  }else{
    if(isTimeout===true)sfxNeutral();else sfxIncorrect();
    flash(isTimeout===true?"t":"x",isTimeout===true?"△":"×");
    // 正解位置まで自動で回して見せる（学習のため正しい対応を提示）
    setTimeout(()=>{_gear.rot+=(((_gear.shift-_gear.rot)%4)+4)%4;_gearApplyRot();setTimeout(markAll,550);},600);
    setTimeout(_gearNext,2600);
  }
}
function _gearNext(){
  if(!_gearActive)return;
  if(_gear.idx>=GEAR_ROUNDS-1){renderGearResult();return;}
  _gear.idx++;renderGearRound();
}

/* ============================================================ スペシャルモード（ミニゲーム集） ============================================================
 * 左アイコン群4つ目「スペシャル」から起動。歯車モードもここへ集約。
 * いずれも記憶エンジン（memoryScore等）を更新しない自己完結ゲーム。出題は現在ROOMの単語プールから。 */
let _sp={_t:null,_ivs:[]};
function _spClear(){if(_sp._t){clearTimeout(_sp._t);_sp._t=null;}_sp._ivs.forEach(clearInterval);_sp._ivs=[];}
function _spTimeout(fn,ms){_sp._t=setTimeout(fn,ms);}
function _spInterval(fn,ms){const iv=setInterval(fn,ms);_sp._ivs.push(iv);return iv;}
function _spPool(n){
  let pool=shuffle(sectionPoolWords().filter(w=>w&&w.ko&&w.ja));
  if(pool.length<n&&typeof WORD_BY_ID!=="undefined")pool=pool.concat(shuffle(Object.values(WORD_BY_ID).filter(w=>w&&w.ko&&w.ja)));
  const out=[],seen=new Set();
  for(const w of pool){if(!seen.has(w.id)){seen.add(w.id);out.push(w);}if(out.length>=n)break;}
  while(out.length<n&&pool.length)out.push(pool[out.length%pool.length]);
  return out;
}
function _spDistractors(word,n){ // n個の誤答日本語（word.d優先＋他語から補完）
  let opts=Array.isArray(word.d)?word.d.filter(x=>x&&x!==word.ja).slice():[];
  const extra=shuffle(_spPool(n*4+8).map(w=>w.ja).filter(j=>j&&j!==word.ja));
  for(const e of extra){if(opts.length>=n)break;if(!opts.includes(e))opts.push(e);}
  return opts.slice(0,n);
}

 * 神経衰弱・スワイプ○×・スピード連鎖・仲間分け・逆引き・초성クイズ・仲間はずれ・

const SP_MENU=[

function _spTop(title,progHTML){

/* ゲームの成績をXPへ還元する（記憶スコア＝忘却エンジンは従来どおり触らない。ボーナスXPだけ加算） */
const SP_XP_CAP=120; // 1回あたりの上限。ゲーム連打でレベルが飛ばないように
function spGrantXp(n){
  n=Math.max(0,Math.min(SP_XP_CAP,Math.round(n||0)));
  if(!n)return 0;
  const before=xpInfo().level;
  addBonus(n);
  try{updateHomeStats();}catch(e){}
  const after=xpInfo().level;
  if(after>before)setTimeout(()=>showLevelUp(after),700);
  return n;
}
/* そのゲームに出た単語をならべる。タップでその単語の韓国語を読み上げる（重複は1つにまとめる） */
function spWordListHTML(words){
  const seen=new Set(),out=[];
  (words||[]).forEach(w=>{if(w&&w.ko&&!seen.has(w.ko)){seen.add(w.ko);out.push(w);}});
  if(!out.length)return "";
  return `<div class="sp-res-wrap"><div class="sp-res-wh">${spkSvg(15)}</div><div class="sp-res-words">${
    out.map(w=>`<button class="sp-res-w speakable" data-id="${w.id||0}" data-ko="${esc(w.ko)}"><span class="sp-res-w-ko">${esc(w.ko)}</span><span class="sp-res-w-ja">${esc(w.ja||"")}</span></button>`).join("")
  }</div></div>`;
}

/* 神経衰弱：韓国語⇄日本語のペアを6組そろえる */
function spMemory(){
  const N=6,ws=_spPool(N);
  let cards=[];ws.forEach(w=>{cards.push({k:w.id,t:w.ko});cards.push({k:w.id,t:w.ja});});
  cards=shuffle(cards);
  let open=[],matched=0,moves=0,lock=false;
  const e=_spOv();
  e.innerHTML=_spTop('🧠 神経衰弱','0/'+N+'組')+`<div class="sp-body"><div class="sp-q">同じ意味の 韓国語⇄日本語 をそろえよう</div><div class="sp-mem" id="sp-mem">${cards.map((c,i)=>`<div class="sp-mc" data-i="${i}"><span class="sp-mc-back">?</span></div>`).join("")}</div></div>`;
  const prog=()=>{const p=document.getElementById('sp-prog');if(p)p.textContent=matched+'/'+N+'組';};
  e.querySelectorAll('#sp-mem .sp-mc').forEach(el=>{
    el.onclick=()=>{
      if(lock)return;const i=+el.dataset.i,c=cards[i];
      if(el.classList.contains('flip')||el.classList.contains('done'))return;
      el.classList.add('flip');el.textContent=c.t;open.push({el,c});
      if(open.length===2){
        moves++;
        if(open[0].c.k===open[1].c.k&&open[0].el!==open[1].el){
          matched++;open.forEach(o=>{o.el.classList.remove('flip');o.el.classList.add('done');});open=[];prog();try{sfxCorrect();}catch(e){}
          if(matched===N)_spTimeout(()=>_spResult('🧠','神経衰弱クリア！',moves+'<small>手</small>','ペア'+N+'組そろえた！',spMemory,0,ws),700);
        }else{
          lock=true;try{sfxIncorrect();}catch(e){}
          _spTimeout(()=>{open.forEach(o=>{o.el.classList.remove('flip');o.el.innerHTML='<span class="sp-mc-back">?</span>';});open=[];lock=false;},800);
        }
      }
    };
  });
  prog();
}
/* スワイプ○×：韓×日の組み合わせが合っているか○×で判定（10問） */
function spSwipe(){
  const N=10,ws=_spPool(N);let idx=0,score=0;const e=_spOv();
  const round=()=>{
    if(idx>=N){_spResult('👆','スワイプ○×',score+'<small> / '+N+'</small>',score>=N?'全問正解！':score>=N*0.7?'いい目！':'もう一回いこう',spSwipe,0,ws);return;}
    const w=ws[idx],correct=Math.random()<0.5;
    let shownJa=w.ja;
    if(!correct){const d=_spDistractors(w,1);if(d[0])shownJa=d[0];}
    const isTrue=(shownJa===w.ja);
    e.innerHTML=_spTop('👆 スワイプ○×',(idx+1)+' / '+N)+`<div class="sp-body">
      <div class="sp-q">この意味で合ってる？</div>
      <div class="sp-jc"><div class="sp-jc-ko">${esc(w.ko)}</div><div class="sp-jc-ja">${esc(shownJa)}</div></div>
      <div class="sp-yn"><button class="sp-no" id="sp-no">✕ ちがう</button><button class="sp-yes" id="sp-yes">○ 合ってる</button></div></div>`;
    const ans=(yes)=>{if(yes===isTrue){score++;try{sfxCorrect();}catch(e){}}else try{sfxIncorrect();}catch(e){}idx++;_spTimeout(round,240);};
    document.getElementById('sp-yes').onclick=()=>ans(true);
    document.getElementById('sp-no').onclick=()=>ans(false);
  };
  round();
}
/* 穴うめ：日本語の意味を見て、ハングル1文字の欠けを4択で埋める（8問） */
function spBlank(){
  const N=8,ws=_spPool(N);let idx=0,score=0;const e=_spOv();
  const round=()=>{
    if(idx>=N){_spResult('✍️','穴うめ',score+'<small> / '+N+'</small>',score>=N?'完ぺき！':'いい調子！',spBlank,score*5,ws);return;}
    const w=ws[idx],chars=[...w.ko];
    const cand=chars.map((c,i)=>i).filter(i=>chars[i].trim()&&chars[i]!==' ');
    const bi=cand.length?cand[Math.floor(Math.random()*cand.length)]:0;
    const answer=chars[bi],shown=chars.map((c,i)=>i===bi?'◯':c).join('');
    let opts=[{t:answer,c:1}];
    const others=shuffle(_spPool(24).map(x=>[...x.ko]).reduce((a,b)=>a.concat(b),[]).filter(ch=>ch.trim()&&ch!==' '&&ch!==answer));
    for(const ch of others){if(opts.length>=4)break;if(!opts.some(o=>o.t===ch))opts.push({t:ch,c:0});}
    opts=shuffle(opts);
    e.innerHTML=_spTop('✍️ 穴うめ',(idx+1)+' / '+N)+`<div class="sp-body">
      <div class="sp-q">${esc(w.ja)}</div>
      <div class="sp-big">${esc(shown)}</div>
      <div class="sp-opts" id="sp-opts">${opts.map(o=>`<button class="sp-opt" data-c="${o.c}">${esc(o.t)}</button>`).join('')}</div></div>`;

  const tryPlace=(chip,bin)=>{
    if(!chip||!bin||chip.classList.contains('placed'))return;

  };

    chip.onclick=()=>{if(chip.classList.contains('placed'))return;if(chip._skip){chip._skip=false;return;}if(sel===chip){chip.classList.remove('sel');sel=null;return;}if(sel)sel.classList.remove('sel');sel=chip;chip.classList.add('sel');};
    chip.onpointerdown=(ev)=>{

      chip.style.visibility='hidden';
      const move=(m)=>{moved=true;ghost.style.left=(m.clientX-gx)+'px';ghost.style.top=(m.clientY-gy)+'px';const el=document.elementFromPoint(m.clientX,m.clientY),bin=el&&el.closest?el.closest('.sp-bin'):null;bins.forEach(b=>b.classList.toggle('hot',b===bin));};
      const up=(m)=>{
        document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
        if(ghost.parentNode)ghost.remove();chip.style.visibility='';
        bins.forEach(b=>b.classList.remove('hot'));
        const el=document.elementFromPoint(m.clientX,m.clientY),bin=el&&el.closest?el.closest('.sp-bin'):null;
        if(moved){chip._skip=true;setTimeout(()=>{chip._skip=false;},350);if(bin)tryPlace(chip,bin);}
      };
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    };
  });
  bins.forEach(bin=>{bin.onclick=()=>{if(sel){const c=sel;tryPlace(c,bin);}};});
  prog();
}

  const left=shuffle(ws.slice()),right=shuffle(ws.slice());let selK=null,done=0,miss=0;
  e.innerHTML=_spTop('🔗 マッチング','0/'+N)+`<div class="sp-body">
    <div class="sp-q">韓国語と意味をタップでつなごう</div>
    <div class="sp-match">
      <div class="sp-mcol" id="sp-mL">${left.map(w=>`<button class="sp-mi" data-k="${w.id}">${esc(w.ko)}</button>`).join('')}</div>
      <div class="sp-mcol" id="sp-mR">${right.map(w=>`<button class="sp-mi sp-mi-ja" data-k="${w.id}">${esc(w.ja)}</button>`).join('')}</div>
    </div></div>`;
  const prog=()=>{const p=document.getElementById('sp-prog');if(p)p.textContent=done+'/'+N;};
  const clearSel=()=>{if(selK){selK.classList.remove('sel');selK=null;}};
  e.querySelectorAll('#sp-mL .sp-mi').forEach(b=>{b.onclick=()=>{if(b.classList.contains('done'))return;if(selK)selK.classList.remove('sel');selK=b;b.classList.add('sel');};});
  e.querySelectorAll('#sp-mR .sp-mi').forEach(b=>{b.onclick=()=>{
    if(b.classList.contains('done')||!selK)return;
    if(selK.dataset.k===b.dataset.k){selK.classList.remove('sel');selK.classList.add('done');b.classList.add('done');selK=null;done++;prog();try{sfxCorrect();}catch(e){}
      if(done===N)_spTimeout(()=>_spResult('🔗','マッチング',(miss===0?'ノーミス':'ミス'+miss+'回'),miss===0?'一発でつなげた！':'クリア！ 次はノーミスを狙おう',spMatch,miss===0?45:Math.max(10,30-miss*4),ws),650);}
    else{miss++;try{sfxIncorrect();}catch(e){}const k=selK;b.classList.add('bad');k.classList.add('bad');_spTimeout(()=>{b.classList.remove('bad');k.classList.remove('bad');},420);clearSel();}
  };});
  prog();
}

/* まちがい探し：意味＋音声を手がかりに、そっくりな中から正しいつづりを4択（8問） */
function _hVariant(ko){ // 1音節の1字だけ変えたそっくりな誤りつづりを返す（作れなければnull）
  const arr=[...ko],idxs=arr.map((c,i)=>i).filter(i=>_isHangul(arr[i]));if(!idxs.length)return null;
  for(let t=0;t<14;t++){
    const i=idxs[Math.floor(Math.random()*idxs.length)],d=_hDecomp(arr[i]);if(!d)continue;
    let {cho,jung,jong}=d;const which=Math.floor(Math.random()*3);
    if(which===0)cho=(cho+1+Math.floor(Math.random()*(_HCHO.length-1)))%_HCHO.length;
    else if(which===1)jung=(jung+1+Math.floor(Math.random()*(_HJUNG.length-1)))%_HJUNG.length;
    else jong=(jong+1+Math.floor(Math.random()*(_HJONG.length-1)))%_HJONG.length;
    const cand=arr.slice();cand[i]=_hCompose(cho,jung,jong);const s=cand.join('');if(s!==ko)return s;
  }
  return null;
}
function spSpell(){
  const N=8;let pool=_spPool(50).filter(w=>[...w.ko].some(_isHangul));if(pool.length<N)pool=pool.concat(_spPool(50));
  const ws=shuffle(pool).slice(0,N);let idx=0,score=0;const e=_spOv();
  const round=()=>{
    if(idx>=N){_spResult('🔍','まちがい探し',score+'<small> / '+N+'</small>',score>=N?'目がいい！':score>=N*0.7?'いい調子！':'もう一回いこう',spSpell,0,ws);return;}
    const w=ws[idx],set=new Set([w.ko]);let g=0;
    while(set.size<4&&g++<40){const v=_hVariant(w.ko);if(v)set.add(v);else break;}
    if(set.size<4){const extra=shuffle(_spPool(30).map(x=>x.ko).filter(k=>k&&k!==w.ko));for(const k of extra){if(set.size>=4)break;set.add(k);}}
    let opts=shuffle([...set]).map(t=>({t,c:t===w.ko?1:0}));
    e.innerHTML=_spTop('🔍 まちがい探し',(idx+1)+' / '+N)+`<div class="sp-body">
      <div class="sp-q">正しいつづりはどれ？／意味＝${esc(w.ja)}</div>
      <button class="sp-opt" style="width:auto;padding:10px 22px" id="sp-play">${spkSvg(20)} きく</button>
      <div class="sp-opts" id="sp-opts">${opts.map(o=>`<button class="sp-opt" data-c="${o.c}">${esc(o.t)}</button>`).join('')}</div></div>`;
    const play=()=>{try{speakKorean(w);}catch(e){}};document.getElementById('sp-play').onclick=play;_spTimeout(play,320);
    e.querySelectorAll('#sp-opts .sp-opt').forEach(b=>{b.onclick=()=>{
      if(b.dataset.c==='1'){b.classList.add('ok');score++;try{sfxCorrect();}catch(e){}}
      else{b.classList.add('ng');try{sfxIncorrect();}catch(e){}const ok=[...e.querySelectorAll('#sp-opts .sp-opt')].find(x=>x.dataset.c==='1');if(ok)ok.classList.add('ok');}
      e.querySelectorAll('#sp-opts .sp-opt').forEach(x=>x.style.pointerEvents='none');idx++;_spTimeout(round,750);
    };});
  };
  round();
}

/* ============================================================ 進捗＝歩くキャラ ============================================================
 * 山吹色のメーターは廃止。正解するとキャラが1歩ぶん前へ進む＝景色（雲・丘・地面）が右から左へ流れ、
 * キャラ自身はその場で歩いているように見える（マリオ風の横スクロール）。不正解はつまずいて進めない。 */
let _runSteps=0,_runIdx=0,_rnGap=56;
const RN_DUMMY="🐥"; // 診断が済むまでの仮キャラ（虫眼鏡＝分析中アイコンが歩くと意味が伝わらないため、ダミーの動物にする）
function runnerReset(){
  _runSteps=0;_runIdx=0;
  const bar=document.getElementById("pbar");if(bar)bar.style.setProperty("--rp",0);
  const ch=document.getElementById("rn-char");
  if(ch){
    ch.classList.remove("step","trip");
    // 診断が済んでいれば自分の16タイプのキャラ、まだならダミーの動物が歩く
    let d=null;try{d=computeDiagnosis();}catch(e){}
    if(d&&d.complete)ch.innerHTML=`<img src="${charPathFor(d)}" alt="">`;
    else ch.textContent=RN_DUMMY;
  }
  runnerBuild((state&&state.questions&&state.questions.length)||12);
}
/* 進む先に、この1本ぶんの単語カードを等間隔に並べる（12枚ぶん。画面に入るのは手前の数枚だけ） */
function runnerBuild(n){
  const rail=document.getElementById("rn-rail");if(!rail)return;
  // 間隔は帯の実寸から決める（キャラの位置は左から30%）。端末の幅によらず、いつも7枚ぶんが画面に覗く
  const bar=document.getElementById("pbar");
  const w=(bar&&bar.clientWidth)||566,head=Math.round(w*0.08);
  _rnGap=Math.max(24,Math.floor((w*0.70-head-20)/6));
  rail.style.transform="translateX(0)";
  rail.innerHTML="";
  for(let i=0;i<n;i++){
    const s=document.createElement("div");
    s.className="rn-slot";s.dataset.i=i;
    s.style.left=(head+i*_rnGap)+"px";
    s.style.animationDelay=(Math.min(i,7)*0.05).toFixed(2)+"s";
    rail.appendChild(s);
  }
}
function runnerStep(ok){
  const bar=document.getElementById("pbar");if(!bar)return;
  // 目の前のカードの行方：正解＝キャラのほうへ飛んで獲得／不正解＝その場ではじけて消える
  const slot=document.querySelector('#rn-rail .rn-slot[data-i="'+_runIdx+'"]');
  if(slot){
    if(ok){
      const chr=document.getElementById("rn-char");
      if(chr){const c=slot.getBoundingClientRect(),h=chr.getBoundingClientRect();
        slot.style.setProperty("--fly",Math.round((h.left+h.width/2)-(c.left+c.width/2))+"px");}
      slot.classList.add("got");
    }else slot.classList.add("pop");
  }
  if(ok)_runSteps++;
  _runIdx++;
  bar.style.setProperty("--rp",_runIdx); // 景色はカードの流れと同じテンポで動かす（1問＝1枚ぶん）
  // カードは1問ごとに1枚ぶん左へ流れる（＝とことこ進む）。獲得できなかった札はもう戻らない
  const rail=document.getElementById("rn-rail");
  if(rail)rail.style.transform="translateX("+(-_runIdx*_rnGap)+"px)";
  const ch=document.getElementById("rn-char");if(!ch)return;
  ch.classList.remove("step","trip");void ch.offsetWidth; // 連続再生できるようアニメを巻き戻す
  ch.classList.add(ok?"step":"trip");
}

function curLimit(){const base=state.questions[state.idx].type==="w"?20:10;return Math.round(base*(loadSettings().slowTimer?1.5:1));} // じっくりモードは1.5倍

function _tick(){
  const limit=curLimit(),fill=document.getElementById("tfill"),tt=document.getElementById("time");
  const el=(performance.now()-qStart)/1000, remain=Math.max(0,limit-el);
  if(fill){fill.style.width=(remain/limit*100)+"%";fill.className="tfill"+(remain<=limit*0.3?" warn":"");}
  if(tt)tt.textContent=remain.toFixed(1);
  if(!answered)_maybeEliminate(remain,limit);
  if(remain<=0){clearInterval(timer);if(!answered)submit("timeout","");}
}
/* 4択のみ：残り1/4（10秒なら2.5秒）で不正解を1つ、残り1/8（同1.25秒）で更にもう1つ半透明にして選べなくする（50/50風ヒント） */
function _maybeEliminate(remain,limit){
  if(_d5.on)return; // 今日の5問は一発勝負のため50/50ヒントを出さない
  const q=state&&state.questions&&state.questions[state.idx];
  if(!q||(q.type!=="kj"&&q.type!=="jk"))return;
  const wrap=document.querySelector("#qstage .choices");if(!wrap)return;
  const want=(remain<=limit*0.125)?2:(remain<=limit*0.25)?1:0;
  let done=wrap.querySelectorAll(".choice.elim").length;
  if(done>=want)return;
  const cands=[...wrap.querySelectorAll(".choice:not(.elim)")].filter(b=>b.dataset.v!==q.correct);
  for(let i=0;done<want&&i<cands.length;i++){cands[i].classList.add("elim");cands[i].disabled=true;done++;}
}
function startTimer(){qStart=performance.now();answered=false;clearInterval(timer);_tick();timer=setInterval(_tick,100);}
function resumeTimer(){clearInterval(timer);_tick();timer=setInterval(_tick,100);} // qStart/answeredは保持したまま計時だけ再開（中断ダイアログからの復帰用）

/* 選択肢の文字数に応じて字を詰めるクラス（日本語の語釈が長い語でボタンから溢れないように） */
function choiceLenCls(t){const n=(t||"").length;return n>=13?" len-xl":n>=8?" len-l":"";}
function renderQuestion(){
  _counting=false; // 実際の問題に入ったのでカウントダウン中フラグを解除（以後の戻るは確認ダイアログ）
  if(typeof track==="function"){if(state.idx===0)track("q1_shown");else if(state.idx===5)track("q6_reached");} // 離脱ファネル計測（GA_ID設定時のみ有効）
  // 遷移時に音声を止めない（長い単語が途中で切れないよう最後まで再生させる）。
  // 重複防止は次の正解時に speakKorean() 側の stopSpeak() が担う。
  const q=state.questions[state.idx];
  document.getElementById("prog").textContent=(_d5.on?(_d5.mode==="trend"?"今日のトレンド　":"今日の5問　"):"")+(state.idx+1)+" / "+((state.questions&&state.questions.length)||12);
  const _qa=document.getElementById("qadv");if(_qa)_qa.style.visibility=_d5.on?"hidden":"visible";
  // 進捗は「キャラが歩いて進む」帯で表す（山吹色メーターは廃止）。出題番号と同時にスイッチ表示（今日の5問は正誤表示が無いので隠す）
  const stage=document.getElementById("qstage");
  if(q.type==="sg"||q.type==="sg4"){renderShoot(q,stage);return;} // スペシャル問題（シューティング）：制限時間なし・採点なし
  if(q.type==="pz"){renderPuzzle(q,stage);startTimer();return;} // スペシャル問題（パズル穴うめ）：採点は通常どおり
  if(q.type==="kj"||q.type==="jk"){
    const display=q.type==="kj"?q.word.ko:q.word.ja;
    stage.innerHTML=`
      <div class="qmain"><div class="qword${q.type==="jk"?" ja":""}">${esc(display)}</div></div>
      <div class="qbottom">
        <div class="choices">${q.choices.map(c=>`<button class="choice${choiceLenCls(c)}" data-v="${esc(c)}" onclick="if(!answered)pick(this.dataset.v)">${esc(c)}</button>`).join("")}</div>
        <button class="unknown" onclick="submit('unknown','')">わからない</button>
      </div>`;
    bindChoiceDrag(); // タップ即確定でなく、触れた選択肢が黄色く光り→スライドして離した位置で確定
  }else{
    IME.reset();
    // 成績連動：Q1〜Q10の正解数が7問以下ならヒント付き（先頭1音節を自動表示）、8問以上なら通常
    const choiceCorrect=state.results.slice(0,10).filter(r=>r.isCorrect).length;
    state.choiceCorrectCount=choiceCorrect;
    const hint=choiceCorrect<=7;
    q.isHintProvided=hint;
    q.hintText=hint?([...q.word.ko].find(ch=>/[가-힣]/.test(ch))||[...q.word.ko.trim()][0]):null;
    const hintHTML=hint?`<div class="whint">ヒント：<b>${esc(q.hintText)}</b></div>`:"";
    stage.innerHTML=`
      <div class="qmain" style="flex:0 0 auto;padding-top:5vh;min-height:24vh"><div class="qword ja">${esc(q.word.ja)}</div>${hintHTML}</div>
      <div class="winput" id="winput"></div>
      ${keyboardHTML()}`;
    refreshInput();
  }
  startTimer();
}

function pick(v){const q=state.questions[state.idx];submit(v===q.correct?"correct":"incorrect",v);}
/* ドラッグ選択: 触れた選択肢を黄色く光らせ（候補）、指を滑らせて離した位置の選択肢で確定。選択肢外で離すと取り消し
   タッチの開始位置は選択肢の上でなくてよい（問題文や余白から撫で始めても、指の下の選択肢が光り、離した所で確定する） */
function bindChoiceDrag(){
  const wrap=document.querySelector("#qstage .choices");if(!wrap)return;
  const stage=document.getElementById("s-quiz")||wrap;
  let active=false;
  if(stage._choiceDragBound)return; // 出題ごとに選択肢は作り直されるが、監視は画面(#s-quiz)側に一度だけ張る
  stage._choiceDragBound=true;
  const curWrap=()=>document.querySelector("#qstage .choices"); // いま出ている選択肢（毎問リビルドされる）
  // 指の直下の選択肢。無ければ縦位置が最も近い選択肢（隙間12pxを押しても選べるように）
  const choiceAt=(x,y)=>{
    const w=curWrap();if(!w)return null;
    const hit=document.elementsFromPoint(x,y).find(el=>el.classList&&el.classList.contains("choice")&&w.contains(el));
    if(hit)return hit;
    let best=null,bd=1e9;w.querySelectorAll(".choice").forEach(b=>{if(b.classList.contains("elim"))return;const r=b.getBoundingClientRect();const d=y<r.top?r.top-y:(y>r.bottom?y-r.bottom:0);if(d<bd&&d<24){bd=d;best=b;}});
    return best;
  };
  const setCand=btn=>{const w=curWrap();if(w)w.querySelectorAll(".choice").forEach(b=>b.classList.toggle("cand",b===btn));};
  const clearCand=()=>{const w=curWrap();if(w)w.querySelectorAll(".choice.cand").forEach(b=>b.classList.remove("cand"));};
  stage.addEventListener("pointerdown",e=>{
    if(answered||!curWrap())return;
    // 選択肢以外のUI（上部バーの戻る/スイッチ・音声ボタンなど）は素通し
    const t=e.target;
    if(t&&t.closest&&(t.closest(".qbar")||t.closest("button:not(.choice)")||t.closest("input,textarea")))return;
    active=true;try{stage.setPointerCapture(e.pointerId);}catch(_){}
    setCand(choiceAt(e.clientX,e.clientY)); // 選択肢の外から撫で始めてもよい（この時点では候補なしでも可）
    e.preventDefault();
  });
  stage.addEventListener("pointermove",e=>{if(active)setCand(choiceAt(e.clientX,e.clientY));}); // 指の下の選択肢に候補を移動（外れたら候補なし）
  const finish=e=>{
    if(!active)return;active=false;
    const btn=choiceAt(e.clientX,e.clientY);
    clearCand();
    if(btn&&!answered)pick(btn.dataset.v); // 離した位置で確定。選択肢外なら何もしない
  };
  stage.addEventListener("pointerup",finish);
  stage.addEventListener("pointercancel",()=>{active=false;clearCand();});
}

/* ============================================================ スペシャル問題：シューティング ============================================================
 * スペシャル発生中のROOM（初級1つ・中級1つ／毎日入替）のテストにだけ、5〜11問目のどこかに1問だけ混ざる。
 * ・下＝日本語の大砲3つ（丸の中に単語画像、その下に日本語）／上＝韓国語の風船3つ
 * ・大砲は左右スワイプ（ダイヤル：右へ向けたいときは右から左へ払う）で傾き、タップ＝1発。連打ぶんだけ出る
 * ・意味の合う風船に正しい大砲の弾を5発当てると割れる。撃ちまちがえると必要な数がその分ふえる（5発誤爆＝10発）
 * ・記憶スコア・履歴・採点には一切入れない（お楽しみ枠）。3つ割ると次の問題へ進む */
const SHG_NEED=5, SHG_SPEED=780, SHG_MAXANG=72, SHG_COOL=110; // 必要弾数／弾速(px/秒)／可動域(±度)／連打の最短間隔(ms)
const SHG_COLORS=["#FF6B81","#38BDF8","#FBBF24"];
const SHG_COLOR4="#FF6B81"; // 4択版（赤ROOM）の風船
let _shg=null;

/* 意味が多い語は最初の意味だけ（大砲に収める）。かっこ内の読点では切らない */
function shgJa(s){
  s=String(s);let d=0;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(c==="（"||c==="(")d++;
    else if(c==="）"||c===")")d--;
    else if((c==="、"||c===",")&&d<=0)return s.slice(0,i);}
  return s;
}
/* 12問のうちの語を借りて、5問目〜11問目のどこかにシューティングを1問差し込む
 *   kind="blue" … 風船3つ×大砲3つの組み合わせ当て（画像のある語を優先）
 *   kind="red"  … 風船1つ（韓国語の出題）×大砲4つ（日本語の4択） */
function insertShootQuestion(qs,kind){
  const at=()=>4+Math.floor(Math.random()*7); // 0起点4〜10＝5問目〜11問目
  if(kind==="red"){
    const cand=qs.filter(q=>q&&q.type==="kj"&&q.choices&&q.choices.length>=4&&q.word);
    if(!cand.length)return qs;
    const src=cand[Math.floor(Math.random()*cand.length)];
    qs.splice(at(),0,{type:"sg4",word:src.word,opts:src.choices.slice(0,4),correct:src.correct});
    return qs;
  }
  const hasImg=w=>typeof WORD_IMG!=="undefined"&&!!WORD_IMG[w.ko];
  const cand=qs.map(q=>q&&q.word).filter(w=>w&&w.ko&&w.ja);
  const words=[],seen=new Set();
  shuffle(cand.filter(hasImg)).concat(shuffle(cand.filter(w=>!hasImg(w)))).forEach(w=>{
    if(!seen.has(w.id)){seen.add(w.id);words.push(w);}
  });
  if(words.length<3)return qs;
  qs.splice(at(),0,{type:"sg",shoot:words.slice(0,3)});
  return qs;
}
/* スペシャルな景色（夜空＋月＋シルエットの木） */
function shgSceneHTML(){
  return `<div class="shg-scene"><div class="shg-stars"></div><div class="shg-moon"></div><div class="shg-hills"></div><div class="shg-land"></div>`
    +`<img class="shg-tree" src="sgdeco/pine.webp" alt="" style="left:4%;width:58px" onerror="this.style.display='none'">`
    +`<img class="shg-tree" src="sgdeco/tree.webp" alt="" style="left:17%;width:44px;bottom:12%" onerror="this.style.display='none'">`
    +`<img class="shg-tree" src="sgdeco/pine.webp" alt="" style="right:6%;width:50px" onerror="this.style.display='none'">`
    +`<img class="shg-tree" src="sgdeco/rock.webp" alt="" style="right:22%;width:34px;bottom:10%;opacity:.4" onerror="this.style.display='none'">`
    +`</div>`;
}
function renderShoot(q,stage){
  answered=true;clearInterval(timer); // 制限時間なし（誤ってsubmitされないようにも閉じておく）
  const tt=document.getElementById("time");if(tt)tt.textContent="";
  const tf=document.getElementById("tfill");if(tf){tf.className="tfill";tf.style.width="100%";}
  const four=q.type==="sg4";
  let lead,bals,cans,words;
  if(four){
    const opts=shuffle(q.opts.slice());
    const ci=opts.indexOf(q.correct);
    words=opts.map(()=>q.word); // 割れる風船は1つ（出題語）
    lead=`スペシャル問題！　上の<b>韓国語</b>に合う<b>日本語の大砲</b>を選んで撃つ<br>左右スワイプで狙う／タップで発射（正しい弾5発で割れる）`;
    bals=`<div class="shg-bal" data-w="${ci}" style="--shc:${SHG_COLOR4}"><span class="shg-ko">${esc(q.word.ko)}</span><span class="shg-need">残り${SHG_NEED}</span></div>`;
    cans=opts.map((t,i)=>`<div class="shg-cn" data-i="${i}"><div class="shg-piv"><div class="shg-aim"></div><div class="shg-barrel"></div></div><div class="shg-base"></div><div class="shg-ja">${esc(shgJa(t))}</div></div>`).join("");
  }else{
