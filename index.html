#s-wdetail .htab th.num{font-size:12px}
.wd-spk{background:rgba(0,0,0,.35);border:none;border-radius:50%;width:38px;height:38px;font-size:18px;margin-left:10px;vertical-align:middle;cursor:pointer;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0}
.spk-svg{vertical-align:-.18em} /* 文字と並べたときのベースライン合わせ（音声マークは全部この白シルエット） */
.wd-ex{margin:10px 16px 0;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 14px;text-align:center}
.wd-ex-ko{font-size:19px;font-weight:800}
.wd-ex-ja{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);margin-top:3px}
.wdetail-head{margin-bottom:6px}
.wd-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px} /* 韓国語=左端 / 日本語=右端 */
.wd-line .ja{text-align:right}
.wdetail-head .ko{font-size:26px;font-weight:800}
.wdetail-head .ja{color:#FFFFFF;font-size:26px;font-weight:800;margin-top:2px}

/* ============================================================ 特別ルーム「プリQQ」専用テーマ（#s-priqq配下だけ・通常ルームに影響なし。フォントは変更しない） ============================================================ */
#s-priqq{background:linear-gradient(180deg,#ffe3f1 0%,#ffeaf5 30%,#eef4ff 70%,#f3ecff 100%);color:#6a3d63;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
#s-priqq *{box-sizing:border-box}
@keyframes pqRainbow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes pqTwinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pqFloat{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-8px) rotate(var(--rot,0deg))}}
@keyframes pqShine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
@keyframes pqPop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
/* 戻る（ぷっくり丸ボタン） */
.pq-back{position:absolute;left:14px;top:14px;z-index:6;width:46px;height:46px;border:none;border-radius:50%;background:#fff;color:#ff77aa;font-size:22px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #ffcfe3,0 6px 12px rgba(255,120,170,.3);line-height:1}
.pq-back:active{transform:translateY(2px);box-shadow:0 2px 0 #ffcfe3}
/* メインビジュアル（ガーリー・アーティストビジュアル風。実在アーティストの複製ではない抽象コンポジション） */
.pq-hero{position:relative;height:290px;margin:0;overflow:hidden;border-radius:0 0 34px 34px;
  background:linear-gradient(115deg,#ffd6ec,#d9e6ff,#e7d6ff,#ffe0f0,#d6f0ff,#ffd6ec);background-size:200% 200%;animation:pqRainbow 14s linear infinite alternate}
.pq-hero .pq-spot{position:absolute;left:50%;top:-40%;width:120%;height:150%;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(255,255,255,.85),rgba(255,255,255,0) 60%)}
.pq-hero .pq-rays{position:absolute;left:50%;top:44%;width:520px;height:520px;transform:translate(-50%,-50%);
  background:conic-gradient(from 0deg,rgba(255,255,255,.55) 0 6deg,rgba(255,255,255,0) 6deg 30deg);opacity:.5;border-radius:50%;animation:pqRainbow 30s linear infinite}
.pq-star,.pq-heart-f{position:absolute;animation:pqTwinkle 2.4s ease-in-out infinite}
.pq-sil{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:230px;height:250px;filter:drop-shadow(0 6px 14px rgba(255,120,170,.35))}
.pq-ribbon{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;background:linear-gradient(90deg,#ff8fbf,#ff77aa);color:#fff;
  padding:9px 26px;border-radius:999px;font-size:22px;font-weight:900;letter-spacing:1px;white-space:nowrap;box-shadow:0 5px 0 #e85f92,0 10px 18px rgba(232,95,146,.4);text-shadow:0 1px 2px rgba(0,0,0,.15)}
.pq-ribbon::before,.pq-ribbon::after{content:"";position:absolute;top:50%;width:16px;height:22px;background:#ff77aa;transform:translateY(-50%);z-index:-1}
.pq-ribbon::before{left:-8px;clip-path:polygon(100% 0,0 50%,100% 100%)}
.pq-ribbon::after{right:-8px;clip-path:polygon(0 0,100% 50%,0 100%)}
.pq-special{position:absolute;right:18px;top:16px;z-index:4;background:#fff;color:#c04ea0;font-size:12px;font-weight:900;letter-spacing:2px;
  padding:6px 12px;border-radius:12px;transform:rotate(8deg);box-shadow:0 3px 0 #ffd0ea,0 6px 12px rgba(192,78,160,.3);border:2px dashed #ffa8d6}
.pq-special .pq-sparkle{color:#ffcf3f}
/* 本文 */
.pq-body{padding:16px 18px 0;position:relative}
.pq-title{text-align:center;font-size:26px;font-weight:900;color:#ff5fa0;text-shadow:0 2px 0 #fff,0 3px 6px rgba(255,120,170,.25);margin-top:6px}
.pq-desc{text-align:center;font-size:13.5px;font-weight:700;color:#8a6a86;line-height:1.8;margin:8px 14px 0}
/* 進捗（ハート入りぷっくりバー） */
.pq-prog{margin:16px auto 0;max-width:420px;background:rgba(255,255,255,.7);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 rgba(255,175,210,.4),inset 0 0 0 2px #fff}
.pq-prog-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900;color:#c04ea0}
.pq-prog-bar{margin-top:8px;height:16px;border-radius:999px;background:#ffe1ee;overflow:hidden;position:relative;box-shadow:inset 0 2px 4px rgba(232,95,146,.15)}
.pq-prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#ff9ecb,#c9a8ff,#9ecbff);background-size:200% 100%;animation:pqRainbow 8s linear infinite alternate}
/* 単語プレビュー（ステッカー風・ぷっくりカード） */
.pq-sec-h{display:flex;align-items:center;gap:8px;justify-content:center;margin:20px 0 10px;font-size:15px;font-weight:900;color:#b34d94}
.pq-preview{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:460px;margin:0 auto}
.pq-card{position:relative;background:#fff;border-radius:22px;padding:14px 14px 12px;text-align:center;overflow:hidden;
  box-shadow:0 5px 0 rgba(255,175,210,.45),0 10px 18px rgba(255,120,170,.18);border:2px solid #ffe3f1}
.pq-card:nth-child(3n+2){border-color:#dce8ff}
.pq-card:nth-child(3n){border-color:#e9def9}
.pq-card .pq-sticker{position:absolute;top:6px;right:8px;font-size:16px;animation:pqFloat 3.2s ease-in-out infinite}
.pq-card .pq-ko{font-size:24px;font-weight:900;color:#5b3f57;line-height:1.2}
.pq-card .pq-ja{font-size:12.5px;font-weight:800;color:#a07fa0;margin-top:3px}
.pq-card .pq-shine{position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.7),rgba(255,255,255,0));animation:pqShine 5.5s ease-in-out infinite}
/* ボタン（大きくぷっくり） */
.pq-btns{max-width:460px;margin:22px auto 0;display:flex;flex-direction:column;gap:12px;padding:0 4px}
.pq-btn{border:none;border-radius:26px;padding:18px;font-size:19px;font-weight:900;cursor:pointer;letter-spacing:1px;position:relative;overflow:hidden}
.pq-btn.start{color:#fff;background:linear-gradient(90deg,#ff9ecb,#ff77aa,#c9a8ff,#9ecbff,#ff9ecb);background-size:250% 100%;animation:pqRainbow 9s linear infinite;box-shadow:0 6px 0 #e85f92,0 12px 22px rgba(232,95,146,.4)}
.pq-btn.start:active{transform:translateY(3px);box-shadow:0 3px 0 #e85f92}
.pq-btn.review{color:#8a5bd0;background:#fff;box-shadow:0 5px 0 #e3d6ff,0 10px 18px rgba(150,120,230,.25);border:2px solid #e3d6ff}
.pq-btn.review:active{transform:translateY(2px);box-shadow:0 2px 0 #e3d6ff}
.pq-btn .pq-shine{position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6),rgba(255,255,255,0));animation:pqShine 4.5s ease-in-out infinite}
/* トースト */
.pq-toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:500;background:#fff;color:#ff5fa0;font-size:14px;font-weight:900;
  padding:12px 22px;border-radius:999px;box-shadow:0 6px 16px rgba(255,120,170,.4);border:2px solid #ffd0ea;animation:pqPop .3s ease}
/* ROOM一覧マップの特別エントリ */
.rm-special{grid-column:1/-1;border:none;border-radius:18px;padding:12px;cursor:pointer;font-family:inherit;font-weight:900;font-size:15px;color:#fff;
  background:linear-gradient(90deg,#ff9ecb,#ff77aa,#c9a8ff,#9ecbff,#ff9ecb);background-size:250% 100%;animation:pqRainbow 9s linear infinite;
  box-shadow:0 4px 0 #e85f92;display:flex;align-items:center;justify-content:center;gap:8px}

/* カルーセル内の特別ルームスライド（通常ROOMのレイアウトを流用しつつプリティー化。位置クラスはそのまま） */
.pq-slide .rmenu-bg{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 3px #ffb3d9,0 6px 14px rgba(255,120,170,.25)}
.pq-slide .hv-roomlabel{color:#ff5fa0;text-shadow:0 2px 0 #fff}
.pq-slide .hv-roomno{color:#ff5fa0 !important;font-size:40px;top:44px;text-shadow:0 2px 0 #fff,0 3px 8px rgba(255,120,170,.3)}
.pq-slide .hv-learned,.pq-slide .hv-roompwr{color:#c04ea0}
.pq-slide .hv-wordsg,.pq-slide .hv-roomg{background:#ffe1ee}
.pq-slide .hv-wordsg .gfill{background:linear-gradient(90deg,#ff9ecb,#c9a8ff)!important}
.pq-slide .hv-roomg .gfill{background:linear-gradient(90deg,#ff77aa,#9ecbff)!important}
.pq-slide .pq-badge{position:absolute;left:363px;top:70px;z-index:2;background:#fff;color:#c04ea0;font-size:12px;font-weight:900;letter-spacing:1px;padding:6px 12px;border-radius:12px;transform:rotate(8deg);box-shadow:0 3px 0 #ffd0ea;border:2px dashed #ffa8d6}
/* 特別ルームのメイン画像部分（ジオラマの代わりのプリティー・ミニビジュアル） */
.pq-main{position:absolute;left:24px;top:120px;width:554px;height:507px;border-radius:34px;overflow:hidden;z-index:1;
  background:linear-gradient(115deg,#ffd6ec,#d9e6ff,#e7d6ff,#ffe0f0,#d6f0ff,#ffd6ec);background-size:200% 200%;animation:pqRainbow 14s linear infinite alternate;
  box-shadow:inset 0 0 0 4px #fff,0 8px 22px rgba(255,120,170,.25)}
.pq-main .pq-spot{border-radius:34px}
.pq-main .pq-sil{width:260px;height:280px}
.pq-main .pq-ribbon{bottom:26px}
.pq-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:30px} /* 差し替え画像（ジャケット風フレーム内） */
.pq-hero .pq-cover{border-radius:0 0 34px 34px}
/* プリQQの出題/結果画面のピンクテーマ（背景を変え、白文字は黒影で読みやすく） */
#s-quiz.pq,#s-result.pq{background:linear-gradient(180deg,#ffe3f1,#ffeaf5 40%,#eef4ff 100%)}
#s-quiz.pq .qbar,#s-quiz.pq .qadv{text-shadow:0 1px 3px rgba(0,0,0,.5)}
#s-quiz.pq .qsw{box-shadow:0 1px 3px rgba(0,0,0,.25)}
/* プリQQの結果画面：白文字はピンク背景で埋もれるので、下敷きを濃い白に・文字を濃色にして読みやすく */
#s-result.pq .res-head,#s-result.pq .res-btns{background:rgba(255,255,255,.88);box-shadow:0 2px 10px rgba(214,120,175,.28)}
#s-result.pq .res-score,#s-result.pq .pwr-lab,#s-result.pq .pwr-val{color:#4a2e46}
#s-result.pq .res-score span{color:#8a6f83}
#s-result.pq .res-cheer{color:#b23a86;text-shadow:none}
#s-result.pq .res-btns .btn.line,#s-result.pq .res-btns .btn.wt,#s-result.pq .res-btns .btn.sec,#s-result.pq .res-btns .btn.ter{background:#3a2b36;color:#fff;border-color:#3a2b36}
/* 特別ルーム選択中のスタートボタン（グローバルボタンをプリティーに） */
.home-wrap.pq-active .start-button{border:none!important;color:#fff!important;
  background:linear-gradient(90deg,#ff9ecb,#ff77aa,#c9a8ff,#9ecbff,#ff9ecb)!important;background-size:250% 100%!important;animation:pqRainbow 9s linear infinite;
  box-shadow:0 8px 0 #e85f92,0 16px 26px rgba(232,95,146,.4)!important;border-radius:62px}
/* 詳細ページのプレビューカードを豪華枠に（白カード＋ゴールド/レインボー枠） */
.pq-card{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#ffd84d,#ff9ecb,#9ecbff,#c9a8ff) border-box;border:3px solid transparent;box-shadow:0 5px 0 rgba(255,175,210,.45),0 10px 20px rgba(255,120,170,.2),inset 0 0 0 2px #fff}
.pq-card:nth-child(3n+2),.pq-card:nth-child(3n){border:3px solid transparent}
/* ============================================================ 歯車モード ============================================================ */
/* スタートボタン右端の⚙バッジ（歯車モードON時のみ・ゆっくり回転） */
.start-button .sb-gear{display:none;position:absolute;right:20px;top:50%;font-size:34px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));animation:gearspin 7s linear infinite;pointer-events:none}
.start-button.gearmode .sb-gear{display:block}
/* カウントダウン中はスタートボタンを「戻る」に切り替え（押すとポップアップなしで即キャンセル） */
.start-button .sb-back{display:none;font-weight:900;letter-spacing:.14em}
.start-button.as-back .sb-back{display:inline-flex}
.start-button.as-back .sb-txt,.start-button.as-back .sb-gear,.start-button.as-back .sb-bubble{display:none!important}
@keyframes gearspin{from{transform:translateY(-50%) rotate(0)}to{transform:translateY(-50%) rotate(360deg)}}
.gear-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:0 8px}
.gear-hint{font-size:14px;font-weight:800;color:#fff;text-shadow:0 2px 5px rgba(0,0,0,.5);letter-spacing:.5px;margin-bottom:10px}
/* 盤面：中央に大きめディスク、日本語は四隅（クロス斜め）。--gsはディスク直径。装飾は最小限で出題画面のトンマナ（白文字+黒影）に統一 */
.gear-board{position:relative;width:min(96vw,58vh);aspect-ratio:1;--gs:min(60vw,35vh);flex:0 0 auto}
/* 日本語は外周に radial 配置（対応する韓国語スロットと同じ角度＝GEAR_ANG+GEAR_OFF）。正解時に韓国語と同一直線上へそろう。配置はJS側の transform で角度指定 */
.gear-ja{position:absolute;left:50%;top:50%;color:#fff;font-weight:600;font-size:clamp(18px,5.6vw,25px);line-height:1.2;text-shadow:0 2px 6px rgba(0,0,0,.5),0 0 2px rgba(0,0,0,.4);width:32%;text-align:center;z-index:2;pointer-events:none;transition:color .3s ease,text-shadow .3s ease;word-break:break-word}
.gear-ja.hit{color:#00FF37;text-shadow:0 0 14px rgba(0,255,55,.55),0 2px 6px rgba(0,0,0,.5)}
/* ダイヤル本体（ドラッグ/スワイプで両方向回転、タップで時計回り90°） */
.gear-dial{position:absolute;left:50%;top:50%;width:var(--gs);height:var(--gs);margin:calc(var(--gs)/-2) 0 0 calc(var(--gs)/-2);cursor:grab;-webkit-tap-highlight-color:transparent;touch-action:none}
.gear-dial.dragging{cursor:grabbing}
.gear-body{position:absolute;inset:0;transition:transform .5s cubic-bezier(.34,1.4,.5,1);will-change:transform}
.gear-dial.dragging .gear-body,.gear-dial.dragging .gear-ko{transition:none}
.gear-core{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff,#f4f4f4 58%,#e3e3e3);box-shadow:0 6px 18px rgba(0,0,0,.3),inset 0 0 0 3px rgba(0,0,0,.04)}
.gear-core::before{content:"";position:absolute;inset:7%;border-radius:50%;border:2px dashed rgba(0,0,0,.08)}
/* 目盛りノッチ（斜め4方向・韓国語の位置を示す控えめな印） */
.gear-notch{position:absolute;left:50%;top:50%;width:5px;height:14px;margin:-7px 0 0 -2.5px;border-radius:3px;background:rgba(0,0,0,.14)}
.gear-ko{position:absolute;left:50%;top:50%;width:calc(var(--gs)*.46);margin:calc(var(--gs)*-.05) 0 0 calc(var(--gs)*-.23);text-align:center;font-size:clamp(20px,6.2vw,28px);font-weight:900;color:#333;line-height:1.15;word-break:break-all;transition:transform .5s cubic-bezier(.34,1.4,.5,1);will-change:transform;pointer-events:none}
/* 中央ハブ：黄色の回転つまみ（両方向の回転誘導） */
.gear-hub{position:absolute;left:50%;top:50%;width:calc(var(--gs)*.24);height:calc(var(--gs)*.24);margin:calc(var(--gs)*-.12) 0 0 calc(var(--gs)*-.12);border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD84D,#FFC400 62%,#e0a800);box-shadow:inset 0 -3px 7px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.24);display:flex;align-items:center;justify-content:center;font-size:calc(var(--gs)*.11);font-weight:900;color:#5a4300;z-index:3;pointer-events:none}
/* 回答ボタン：スタートボタンと同系の黄枠ピル */
.gear-answer{display:block;margin:16px auto 0;width:min(300px,78vw);background:rgba(0,0,0,.85);border:4px solid #FFC400;border-radius:999px;color:#fff;font-size:20px;font-weight:900;letter-spacing:8px;text-indent:8px;padding:15px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:inherit;transition:transform .08s ease,opacity .2s ease}
.gear-answer:active{transform:scale(.96)}
.gear-answer:disabled{opacity:.45;pointer-events:none}
.gear-bottom{padding:0 18px calc(18px + env(safe-area-inset-bottom))}
/* 歯車モード結果 */
.gres{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.gres-ico{font-size:66px;line-height:1;animation:gearspin2 9s linear infinite}
@keyframes gearspin2{to{transform:rotate(360deg)}}
.gres-t{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);margin:8px 0 2px;letter-spacing:2px}
.gres-score{font-size:64px;font-weight:900;color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.5);line-height:1.15}
.gres-score small{font-size:26px;font-weight:800;opacity:.85}
.gres-dots{display:flex;gap:10px;margin:10px 0 6px}
.gres-dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.gres-dots i.ok{background:#FFC400;box-shadow:0 0 10px 2px rgba(255,196,0,.7)}
.gres-cheer{font-size:14px;font-weight:800;color:rgba(255,255,255,.95);text-shadow:0 2px 5px rgba(0,0,0,.45);margin-bottom:22px}
.gres .sp-res-wrap{margin:0 0 18px} /* 歯車モードの結果でも単語一覧の余白をそろえる */
.gres .sp-res-w{background:rgba(0,0,0,.34)} /* 背景がROOMの色（明るいことがある）なので札は暗めにして白文字を読ませる */
/* ============================================================ スペシャルモード（ミニゲーム集） ============================================================ */
#special-modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.42)}
#special-modal.on{display:flex}
.sp-card{width:376px;max-width:92vw;max-height:88vh;overflow-y:auto;color:#1a1a1a;padding:0 16px calc(18px + env(safe-area-inset-bottom));position:relative;border-radius:0;background:#fff;-webkit-overflow-scrolling:touch}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.sp-tile{background:#F4F4F4;border:2px solid #E6E6E6;border-radius:0;padding:14px 12px;min-height:98px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:background .2s,transform .08s;-webkit-tap-highlight-color:transparent}
.sp-tile:active{transform:scale(.96);background:#FFF3D6;border-color:#FFC400}
.sp-tile .sp-ico{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:24px}
.sp-tile .sp-lab{font-size:14px;font-weight:900;color:#1a1a1a}
.sp-tile .sp-desc{font-size:11px;font-weight:700;color:#888;line-height:1.2}
.sp-note{font-size:11.5px;font-weight:700;color:#888;text-align:center;margin-top:14px;line-height:1.7}
/* ゲーム全画面オーバーレイ */
.spov{position:fixed;inset:0;z-index:560;background:linear-gradient(170deg,#241d38,#14111f);display:flex;flex-direction:column;color:#fff;opacity:0;transition:opacity .2s ease;padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
.spov.on{opacity:1}
.sp-top{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-bottom:8px}
/* やめる(戻る)ボタン: 画面最上部だと片手持ちで親指が届かずタッチしにくいため、
   下端の親指ゾーンに浮かせる。DOM上は .sp-top 内のままだが .spov 基準の絶対配置。 */
.spov .sp-quit{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;
  background:rgba(255,255,255,.18);border:none;color:#fff;width:60px;height:60px;border-radius:50%;
  font-size:26px;font-weight:900;cursor:pointer;line-height:1;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.spov .sp-quit:active{background:rgba(255,255,255,.34);transform:scale(.94)}
.sp-top .sp-title{font-size:16px;font-weight:900;letter-spacing:1px}
.sp-top .sp-prog{margin-left:auto;font-size:14px;font-weight:900;color:#FFC400}
.sp-timerbar{flex:0 0 auto;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin-bottom:10px}
.sp-timerbar i{display:block;height:100%;background:#FFC400;width:100%}
/* padding-bottom は下端に浮かせた .sp-quit ぶんの逃がし（ゲーム内容が隠れないように） */
.sp-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow-y:auto;padding-bottom:84px}
.sp-q{font-size:15px;font-weight:800;color:rgba(255,255,255,.9);text-align:center}
.sp-big{font-size:34px;font-weight:900;text-align:center;line-height:1.25;word-break:break-all}
.sp-opts{width:min(360px,90vw);display:flex;flex-direction:column;gap:10px}
.sp-opt{background:rgba(255,255,255,.12);border:2px solid transparent;border-radius:16px;padding:15px;font-size:17px;font-weight:900;color:#fff;cursor:pointer;text-align:center;font-family:inherit;transition:transform .08s,background .15s}
.sp-opt:active{transform:scale(.97)}
.sp-opt.ok{background:rgba(31,173,98,.85);border-color:#37e08a}
.sp-opt.ng{background:rgba(224,60,60,.8);border-color:#ff6b6b}
.sp-mem{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:min(360px,92vw)}
.sp-mc{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(160deg,#4a3f6b,#2e2747);display:flex;align-items:center;justify-content:center;padding:4px;font-size:15px;font-weight:900;color:#fff;text-align:center;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:transform .18s,background .2s;-webkit-tap-highlight-color:transparent;word-break:break-all}
.sp-mc.flip{background:linear-gradient(160deg,#fff,#ffe9c2);color:#333}
.sp-mc.done{background:linear-gradient(160deg,#1FAD62,#0d7a42);color:#fff;pointer-events:none;opacity:.9}
.sp-mc .sp-mc-back{font-size:22px;opacity:.55}
.sp-jc{background:rgba(255,255,255,.1);border-radius:20px;padding:22px 18px;width:min(340px,88vw);text-align:center}
.sp-jc .sp-jc-ko{font-size:36px;font-weight:900}
.sp-jc .sp-jc-ja{font-size:20px;font-weight:800;margin-top:10px;color:#FFD86B}
.sp-yn{display:flex;gap:16px;width:min(340px,88vw)}
.sp-yn button{flex:1;border:none;border-radius:18px;padding:18px;font-size:22px;font-weight:900;cursor:pointer;font-family:inherit}
.sp-yn .sp-no{background:#2F6FE0;color:#fff}
.sp-yn .sp-yes{background:#E0454C;color:#fff}
.sp-bins{display:flex;gap:10px;width:min(360px,92vw)}
.sp-bin{flex:1;min-height:104px;border:2px dashed rgba(255,255,255,.3);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center;transition:background .15s,border-color .15s}
.sp-bin.hot{border-color:#FFC400;background:rgba(255,196,0,.14)}
.sp-bin-lab{font-size:15px;font-weight:900;color:#FFD86B;text-align:center}
.sp-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(360px,92vw)}
.sp-chip{background:linear-gradient(160deg,#fff,#ffe9c2);color:#333;border-radius:14px;padding:12px 14px;font-size:20px;font-weight:900;cursor:grab;box-shadow:0 3px 8px rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent}
.sp-chip.sel{outline:3px solid #FFC400}
.sp-chip.placed{background:linear-gradient(160deg,#1FAD62,#0d7a42);color:#fff;box-shadow:none}
.sp-chip.drag{position:fixed;z-index:600;pointer-events:none;opacity:.95;margin:0}
/* 並べかえ：上=スロット（並べた文字）／下=バラバラの元文字 */
.sp-src,.sp-slot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(360px,92vw);min-height:52px}
.sp-slot{border-bottom:2px dashed rgba(255,255,255,.25);padding-bottom:8px}
.sp-slot.okrow{border-color:#37e08a}
.sp-slot.ngrow{border-color:#ff6b6b}
.sp-oc{background:linear-gradient(160deg,#fff,#ffe9c2);color:#333;border-radius:12px;min-width:44px;padding:10px 12px;font-size:24px;font-weight:900;text-align:center;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}
.sp-oc.used{opacity:.28;pointer-events:none}
.sp-res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.sp-res-ico{font-size:60px}
.sp-res-t{font-size:22px;font-weight:900}
.sp-res-s{font-size:52px;font-weight:900;color:#FFC400;line-height:1.1}
.sp-res-s small{font-size:22px;color:#fff;opacity:.8}
.sp-res-c{font-size:14px;font-weight:800;color:rgba(255,255,255,.85);line-height:1.6}
/* ゲームで得たXP（増えた実感が要るので大きく出す） */
.sp-res-xp{font-size:40px;font-weight:900;color:#37E08A;line-height:1;text-shadow:0 3px 12px rgba(55,224,138,.45);animation:xppop .5s cubic-bezier(.2,1.6,.4,1) both}
.sp-res-xp span{font-size:19px;margin-left:3px}
@keyframes xppop{0%{opacity:0;transform:scale(.4) translateY(10px)}70%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
/* レベルアップの演出 */
.lvup{position:fixed;inset:0;z-index:640;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);opacity:0;transition:opacity .3s ease}
.lvup.on{opacity:1}
/* Lv.の表記はホーム／ステータスと同じ「黒地に白文字」で統一（青文字はここだけ浮いていた） */
.lu-card{position:relative;background:rgba(0,0,0,.86);border-radius:26px;padding:26px 38px 22px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5);transform:scale(.65);transition:transform .45s cubic-bezier(.34,1.65,.5,1)}
.lvup.on .lu-card{transform:scale(1)}
.lu-lab{font-size:16px;font-weight:900;color:#fff;letter-spacing:2px}
.lu-num{color:#fff;line-height:1;margin:6px 0 2px}
.lu-num small{font-size:26px;font-weight:900;margin-right:4px}
.lu-num b{font-size:86px;font-weight:900}
.lu-arrow{font-size:15px;font-weight:900;color:rgba(255,255,255,.6);margin-bottom:4px}
.lu-msg{font-size:13.5px;font-weight:800;color:rgba(255,255,255,.75);margin:2px 0 16px}
.lu-card .btn{padding:13px 26px;font-size:15px;border-radius:14px;background:#fff;color:#111;font-weight:900}
.lu-card .btn:active{background:#e6e6e6}
/* スペシャル問題・歯車モードの結果も、下段は通常の結果画面と同じ4ボタン（メール指示 2026-07-31）。
   「スペシャル選択へ」はその上の細いリンクに逃がす */
.sp-res .res-btns,.gres .res-btns{width:min(340px,90vw);margin-top:4px}
.sp-tolist{border:none;background:transparent;color:rgba(255,255,255,.9);font-family:inherit;font-size:13px;font-weight:800;padding:4px 6px;cursor:pointer;text-decoration:underline}
.sp-tolist:active{opacity:.6}
/* ゲーム結果に出した単語（タップで発音）。ミニゲームでも遊んだ単語をその場で復習できるように */
.sp-res-wrap{width:min(360px,90vw);max-height:30vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sp-res-wh{font-size:12px;font-weight:800;color:rgba(255,255,255,.7);margin-bottom:6px}
.sp-res-words{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sp-res-w{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:12px;padding:8px 6px;font-family:inherit}
.sp-res-w-ko{font-size:15px;font-weight:900;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-res-w-ja{font-size:11px;font-weight:700;opacity:.75;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 追加ミニゲーム8種の見た目（v2.118） */
.sp-choseong{letter-spacing:.18em;color:#FFD86B}
.sp-pairs{display:flex;flex-direction:column;gap:10px;width:min(360px,92vw)}
.sp-pair{display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.12);border:2px solid transparent;border-radius:16px;padding:14px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;transition:transform .08s,background .15s}
.sp-pair:active{transform:scale(.98)}
.sp-pair .sp-pair-ko{font-size:22px}
.sp-pair .sp-pair-eq{opacity:.5}
.sp-pair .sp-pair-ja{font-size:18px;color:#FFD86B}
.sp-pair.ok{background:rgba(31,173,98,.85);border-color:#37e08a}
.sp-pair.ok .sp-pair-ja{color:#fff}
.sp-pair.ng{background:rgba(224,60,60,.8);border-color:#ff6b6b}
.sp-match{display:flex;gap:16px;width:min(360px,92vw)}
.sp-mcol{flex:1;display:flex;flex-direction:column;gap:10px}
.sp-mi{background:rgba(255,255,255,.12);border:2px solid transparent;border-radius:14px;padding:14px 8px;font-size:18px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;transition:transform .08s,background .15s;-webkit-tap-highlight-color:transparent}
.sp-mi.sp-mi-ja{color:#FFD86B}
.sp-mi.sel{border-color:#FFC400;background:rgba(255,196,0,.18)}
.sp-mi.done{background:rgba(31,173,98,.85);border-color:#37e08a;color:#fff;pointer-events:none;opacity:.92}
.sp-mi.bad{background:rgba(224,60,60,.75)}
.sp-karu{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(360px,92vw)}
.sp-kcard{background:rgba(255,255,255,.12);border:2px solid transparent;border-radius:14px;padding:16px 8px;font-size:17px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;min-height:62px;transition:transform .08s,background .15s;-webkit-tap-highlight-color:transparent}
.sp-kcard:active{transform:scale(.97)}
.sp-kcard.ok{background:rgba(31,173,98,.85);border-color:#37e08a}
.sp-kcard.ng{background:rgba(224,60,60,.8);border-color:#ff6b6b}
.sp-flash{transition:opacity .2s,transform .2s}
.sp-flash.hid{opacity:.45}
.sp-memo{display:flex;flex-direction:column;gap:8px;width:min(340px,90vw)}
.sp-memo-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:14px;padding:12px 16px}
.sp-memo-ko{font-size:23px;font-weight:900}
.sp-memo-ja{font-size:18px;font-weight:800;color:#FFD86B}
.sp-memo-count{font-size:32px;font-weight:900;color:#FFC400;min-height:38px}

/* ============================================================ スペシャル問題：シューティング（テストの中に1問だけ混ざるミニゲーム） ============================================================
 * 青ROOM: 下＝日本語の大砲3つ／上＝韓国語の風船3つ（組み合わせを当てる）
 * 赤ROOM: 上＝韓国語の風船1つ（出題）／下＝日本語の大砲4つ（4択）。正解の大砲で撃つ。
 * 大砲は左右スワイプ（ダイヤル）で傾き、タップ（連打）で発射。5発当てると割れ、割れた位置から玉が落ちてくる。
 * 背景はスペシャル感のある夜景（星空＋月＋シルエットの木）。 */
.shg{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.shg-lead{position:absolute;left:0;right:0;top:4px;z-index:5;padding:0 8px;text-align:center;font-size:clamp(11.5px,3.2vw,13px);font-weight:800;line-height:1.6;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none}
.shg-lead b{color:#FFD84D}
/* --- スペシャルな景色（夜空→夕焼け→地面） --- */
.shg-scene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:linear-gradient(180deg,#140b3a 0%,#2d1461 30%,#5c2280 56%,#c04b6a 78%,#ff9a58 92%,#ffd08a 100%)}
.shg-stars{position:absolute;left:0;right:0;top:0;height:62%;opacity:.85;animation:shgTwinkle 3.6s ease-in-out infinite;
  background-image:radial-gradient(#fff 1.3px,transparent 1.5px),radial-gradient(rgba(255,255,255,.72) 1px,transparent 1.2px);
  background-size:67px 59px,41px 43px;background-position:0 0,19px 24px}
@keyframes shgTwinkle{0%,100%{opacity:.85}50%{opacity:.5}}
.shg-moon{position:absolute;right:9%;top:8%;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fff,#ffeeb5 58%,#ffcf62);box-shadow:0 0 38px rgba(255,224,150,.8)}
.shg-hills{position:absolute;left:-4%;right:-4%;bottom:14%;height:20%;
  background:radial-gradient(ellipse 42% 100% at 22% 100%,#3a1c63 99%,transparent 100%),
             radial-gradient(ellipse 46% 84% at 74% 100%,#33195a 99%,transparent 100%)}
.shg-land{position:absolute;left:0;right:0;bottom:0;height:15%;background:linear-gradient(180deg,#241145,#120827);
  box-shadow:0 -2px 0 rgba(255,255,255,.16)}
.shg-tree{position:absolute;bottom:11%;width:54px;object-fit:contain;opacity:.5;filter:brightness(0) saturate(0)}
/* --- 風船（韓国語の的）：まん丸・色はフラットにシンプルに --- */
.shg-bal{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;
  background:var(--shc,#FF6B81);box-shadow:inset -7px -9px 0 rgba(0,0,0,.10),0 8px 16px rgba(0,0,0,.3)}
.shg-bal::before{content:"";position:absolute;left:21px;top:17px;width:19px;height:13px;border-radius:50%;
  background:rgba(255,255,255,.5);transform:rotate(-26deg)} /* 小さなハイライトひとつだけ */
.shg-bal::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--shc,#FF6B81);border-bottom:0}
.shg-ko{font-size:21px;font-weight:900;line-height:1.1;padding:0 8px;text-align:center;word-break:break-all;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.shg-need{font-size:11px;font-weight:900;background:rgba(0,0,0,.34);border-radius:999px;padding:1px 9px;letter-spacing:.04em}
.shg.four .shg-bal{width:150px;height:150px;margin:-75px 0 0 -75px}
.shg.four .shg-ko{font-size:27px}
.shg-bal.hit{animation:shgHit .22s ease}
.shg-bal.bad{animation:shgBad .3s ease}
.shg-bal.pop{animation:shgPop .34s ease forwards}
@keyframes shgHit{0%{transform:scale(1)}45%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes shgBad{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes shgPop{to{transform:scale(1.8);opacity:0}}
.shg-frag{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;z-index:4;pointer-events:none;animation:shgFrag .5s ease-out forwards}
@keyframes shgFrag{to{transform:translate(var(--fx),var(--fy)) scale(.3);opacity:0}}
/* 割れた風船の中から玉が出てきて落ちる（ホームに積もる玉と同じ見た目のカプセル） */
.shg-ball{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;z-index:5;pointer-events:none;
  background:rgba(255,255,255,.58);box-shadow:inset 0 -6px 12px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;animation:shgBallDrop 1.15s cubic-bezier(.45,.02,.75,.5) forwards}
.shg-ball img{width:72%;height:72%;object-fit:contain}
.shg-ball span{font-size:30px}
@keyframes shgBallDrop{
  0%{transform:translateY(0) scale(.35);opacity:0}
  14%{transform:translateY(0) scale(1);opacity:1}
  82%{transform:translateY(var(--fall,360px)) scale(1);opacity:1}
  90%{transform:translateY(var(--fall,360px)) scaleX(1.22) scaleY(.78);opacity:1}
  100%{transform:translateY(calc(var(--fall,360px) - 10px)) scale(1);opacity:0}
}
/* --- 弾 --- */
.shg-bullet{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:3px;z-index:2;pointer-events:none;
  background:#fff;box-shadow:0 0 10px rgba(255,255,255,.9)}
/* --- 大砲（日本語）：砲身→付け根→本体を段差なくつなげ、画像は置かず本体の位置に日本語を出す --- */
.shg-cn{position:absolute;width:112px;z-index:3;cursor:pointer;text-align:center;transform:translateX(-50%);-webkit-tap-highlight-color:transparent}
.shg.four .shg-cn{width:min(104px,24vw)}
.shg-piv{position:relative;height:64px;transform-origin:50% 100%;transition:none}
.shg-barrel{position:absolute;left:50%;bottom:-8px;width:26px;height:72px;margin-left:-13px;border-radius:9px 9px 0 0;
  background:linear-gradient(90deg,#93a0b2,#f4f8fd 40%,#8c99ac);box-shadow:0 3px 8px rgba(0,0,0,.4)}
.shg-barrel::after{content:"";position:absolute;left:-5px;right:-5px;top:-4px;height:10px;border-radius:5px;
  background:linear-gradient(90deg,#8c99ac,#fff 42%,#7d8a9d)} /* ノズル先端のリング */
.shg-barrel.kick{animation:shgKick .13s ease}
@keyframes shgKick{0%{transform:translateY(9px)}100%{transform:translateY(0)}}
.shg-aim{position:absolute;left:50%;bottom:62px;width:0;height:120px;margin-left:-1px;border-left:3px dashed rgba(255,255,255,.42)}
/* 本体（台座）。砲身の付け根に重ねて一体に見せる */
.shg-base{position:relative;z-index:2;width:80px;height:32px;margin:-11px auto 0;border-radius:18px 18px 10px 10px;
  background:linear-gradient(180deg,#f6f9fd,#aab5c5);box-shadow:0 5px 11px rgba(0,0,0,.42),inset 0 2px 0 rgba(255,255,255,.95)}
.shg-base::after{content:"";position:absolute;left:50%;top:-7px;margin-left:-19px;width:38px;height:16px;border-radius:9px 9px 0 0;
  background:linear-gradient(180deg,#e6ecf4,#c3cddb)} /* 砲身とのつなぎ目（首） */
.shg.four .shg-base{width:66px;height:28px}
/* 画像の丸は廃止。その位置に日本語を置く（長い意味は2行で打ち切り） */
.shg-ja{position:relative;z-index:1;margin:6px auto 0;width:100%;padding:7px 6px;border-radius:12px;
  background:rgba(9,5,28,.7);box-shadow:0 0 0 2px rgba(255,255,255,.82),0 6px 14px rgba(0,0,0,.45);
  font-size:16px;font-weight:900;color:#fff;line-height:1.25;word-break:break-all;text-align:center;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px;box-sizing:border-box}
.shg.four .shg-ja{font-size:14px;padding:6px 4px;min-height:38px}
.shg-cn:active .shg-ja{transform:scale(.95)}
.shg-cn.done{opacity:.4;pointer-events:none}
.shg-cn.done .shg-ja{box-shadow:0 0 0 3px rgba(55,224,138,.9)}
.shg-clear{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.4);opacity:0;z-index:6;pointer-events:none;
  font-size:58px;font-weight:900;color:#FFD84D;letter-spacing:.06em;text-shadow:0 4px 14px rgba(0,0,0,.6)}
.shg-clear.on{animation:shgClear .5s cubic-bezier(.34,1.5,.5,1) forwards}
@keyframes shgClear{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* ============================================================ スペシャル問題：パズル穴うめ（緑ROOM） ============================================================
 * 日本語の意味に対する韓国語を、1文字だけ抜いたジグソーパズルとして出す。
 * 抜けた場所と同じ形のピースが4つ並び、正しいピースを選んではめる。全12問がこの形式。 */
.pz{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:3vh 12px calc(14px + env(safe-area-inset-bottom));overflow:hidden;user-select:none;-webkit-user-select:none}
.pz-lead{font-size:13px;font-weight:800;color:#BFF3D6;letter-spacing:.04em;text-align:center;line-height:1.5;
  background:rgba(4,58,34,.5);border-radius:999px;padding:6px 16px;box-shadow:0 0 0 2px rgba(94,227,155,.45)}
.pz-ja{margin-top:2.4vh;font-size:clamp(26px,7.4vw,38px);font-weight:800;color:#fff;text-align:center;line-height:1.25;
  text-shadow:0 2px 6px rgba(0,0,0,.5);word-break:break-all}
/* 単語の板（ピースが並ぶ台紙） */
.pz-board{margin-top:2.6vh;display:flex;align-items:center;justify-content:center;padding:14px 10px;border-radius:20px;
  background:rgba(2,44,26,.42);box-shadow:0 0 0 3px rgba(94,227,155,.35),0 10px 24px rgba(0,0,0,.3)}
/* ピースはテカらせない（グラデーション＝光沢をやめ、ベタ1色のシンプルな面にする） */
.pz-cell{position:relative;width:var(--pw);height:calc(var(--pw)*.84);flex:0 0 auto;
  -webkit-clip-path:url(#pzclip);clip-path:url(#pzclip);
  background:#1F7E4E;
  display:flex;align-items:center;justify-content:center}
.pz-cell+.pz-cell{margin-left:calc(var(--pw)*-.26)}
.pz-gap{flex:0 0 auto;width:calc(var(--pw)*.16)} /* 分かち書きの空白 */
.pz-cell>span{font-size:calc(var(--pw)*.42);font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4);
  transform:translateX(calc(var(--pw)*-.01))}
/* 抜けているマス（穴）：同じ形をくり抜いた凹み */
.pz-cell.hole{background:rgba(94,227,155,.85)}
.pz-cell.hole::before{content:"";position:absolute;inset:0;-webkit-clip-path:url(#pzclip);clip-path:url(#pzclip);
  background:#06301D;transform:scale(.93);animation:pzHole 1.5s ease-in-out infinite}
@keyframes pzHole{0%,100%{opacity:1}50%{opacity:.72}}
.pz-cell.hole.filled::before{opacity:1;animation:none;background:#EFAE22}
.pz-cell.hole.filled>span{position:relative;z-index:1;animation:pzSnap .34s cubic-bezier(.34,1.5,.5,1) both}
@keyframes pzSnap{0%{transform:translateY(-26px) scale(1.25);opacity:.2}100%{transform:translateY(0) scale(1);opacity:1}}
/* 選ぶピース（バラのピース4つ） */
.pz-tray{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:520px;padding-top:16px}
.pz-p{position:relative;width:100%;aspect-ratio:1/.84;border:none;padding:0;font-family:inherit;cursor:pointer;
  -webkit-clip-path:url(#pzclip);clip-path:url(#pzclip);
  background:#2AA268;
  display:flex;align-items:center;justify-content:center;
  animation:pzIn .3s cubic-bezier(.34,1.4,.5,1) both}
.pz-p:nth-child(2){animation-delay:.05s}
.pz-p:nth-child(3){animation-delay:.1s}
.pz-p:nth-child(4){animation-delay:.15s}
@keyframes pzIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
.pz-p>span{font-size:clamp(22px,7vw,34px);font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35);
  transform:translateX(-4%)}
.pz-p:active{filter:brightness(1.15)}
.pz-p.correct{background:#E03636}  /* ○=赤（結果表示と統一） */
.pz-p.wrong{background:#2F8BFF}    /* ×=青 */
.pz-p.gone{opacity:.25}

/* ============================================================ すごろく（ROOM中央・縦スクロール） ============================================================
 * 1マス＝1テスト(12問)。丸いマスが蛇行してつながり、上から下へ進む。マスの上には常に単語画像が乗る。
 * 1周＝12マス（ROOM末尾など語数の少ない部屋は語数に比例して短くなる）。1周こなすと次の周のマスが下に伸びる。 */
.sg-wrap{position:absolute;left:24px;top:104px;width:554px;height:636px;z-index:1;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 40px,#000 calc(100% - 56px),transparent 100%);
          mask-image:linear-gradient(180deg,transparent 0,#000 40px,#000 calc(100% - 56px),transparent 100%)}
.sg-bg{position:absolute;left:0;top:-10px;width:554px;height:507px;object-fit:contain;opacity:.2;pointer-events:none;filter:saturate(.7)} /* ROOMのジオラマを薄く敷いて奥行きを出す */
.sg-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sg-scroll::-webkit-scrollbar{display:none}
.sg-track{position:relative;width:554px}
.sg-tile{transform-origin:50% 50%} /* will-changeは付けない: ROOM数×マス数ぶんGPUレイヤーが作られてページが落ちるため */
.sg-road{position:absolute;left:0;top:0;pointer-events:none}
.sg-deco{position:absolute;z-index:0;pointer-events:none;user-select:none;object-fit:contain;filter:drop-shadow(0 5px 5px rgba(0,0,0,.24))}
.sg-tile{position:absolute;z-index:1;width:96px;height:96px;margin:-48px 0 0 -48px;border:none;background:transparent;padding:0;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
.sg-tile:active .sg-img{transform:translateX(-50%) scale(.94)}
.sg-tile.now:active .sg-img,.sg-tile.now:active .sg-noimg{animation-play-state:paused;transform:translateX(-50%) scale(.94)} /* 光彩マスも押したときはカラーのマスと同じ縮み方をする */
/* 番号は画像の左上、ランクは画像の右上（円盤は置かない） */
.sg-num{position:absolute;z-index:4;left:-58px;top:-186px;font-size:40px;font-weight:900;color:#fff;line-height:1;
  text-shadow:0 3px 7px rgba(0,0,0,.65),0 0 5px rgba(0,0,0,.65)}
.sg-img{position:absolute;z-index:3;left:50%;top:-186px;width:236px;height:236px;transform:translateX(-50%);object-fit:contain;transition:transform .08s ease;filter:drop-shadow(0 8px 7px rgba(0,0,0,.3))}
.sg-noimg{position:absolute;z-index:3;left:50%;top:-120px;transform:translateX(-50%);font-size:112px;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.sg-tile.done .sg-num{color:#DFFBE6}
.sg-rank{position:absolute;z-index:4;right:-58px;top:-186px;width:58px;height:58px;border-radius:50%;color:#fff;font-size:41px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 6px rgba(255,196,0,.95),0 4px 11px rgba(0,0,0,.4)} /* 結果画面と同じメダル風 */
.sg-rank::after{content:"";position:absolute;inset:5px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);pointer-events:none}
.sg-tile.now .sg-num,.sg-tile.now .sg-rank{animation:sgnow 1.6s ease-in-out infinite}
.sg-tile.now .sg-img,.sg-tile.now .sg-noimg{animation:sgnowc 1.6s ease-in-out infinite,sgglow 1.9s ease-in-out infinite} /* 画像はtranslateX(-50%)を保ったまま一緒に揺らす＋黄色い光彩 */
@keyframes sgglow{
  0%,100%{filter:grayscale(1) drop-shadow(0 0 10px rgba(255,205,70,.9)) drop-shadow(0 0 24px rgba(255,175,0,.6)) drop-shadow(0 8px 8px rgba(0,0,0,.28))}
  50%{filter:grayscale(1) drop-shadow(0 0 20px rgba(255,215,100,1)) drop-shadow(0 0 44px rgba(255,175,0,.9)) drop-shadow(0 8px 8px rgba(0,0,0,.28))}
}
@keyframes sgnow{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes sgnowc{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}
.sg-here{position:absolute;z-index:6;left:50%;top:-268px;background:#111;color:#fff;
  font-size:34px;font-weight:900;letter-spacing:.14em;padding:8px 30px 10px;white-space:nowrap;border-radius:999px;
  box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 4px rgba(255,196,0,.95);
  animation:sgherebob 1.6s ease-in-out infinite}
@keyframes sgherebob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-9px)}}
/* 文字は旧スタートボタンと同じく1文字ずつ回転 */
.sg-here span{display:inline-block;animation:sbchar 3s ease-in-out infinite;backface-visibility:hidden}
.sg-here span:nth-child(2){animation-delay:.15s}
.sg-here span:nth-child(3){animation-delay:.3s}
.sg-here span:nth-child(4){animation-delay:.45s}
.sg-here::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-10px;border:10px solid transparent;border-top-color:#111;border-bottom:0}
/* スペシャル問題が出ているROOMのスタート：白座布団＋色枠（青＝風船マッチ／赤＝4択シューティング／緑＝パズル穴うめ） */
.sg-here.sp{background:#fff;color:#1868FF;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 4px #1868FF}
.sg-here.sp::after{border-top-color:#fff}
.sg-here.sp-red{color:#E4002B;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 4px #E4002B}
.sg-here.sp-green{color:#00A150;box-shadow:0 6px 16px rgba(0,0,0,.35),0 0 0 4px #00A150}
/* 「スペシャル問題発生中！」はスタート（＝吹き出し型）の上に吹き出しを重ねると変なので、斜めのリボン帯にする */
.sg-spbub{position:absolute;z-index:6;left:50%;top:-352px;white-space:nowrap;
  font-size:24px;font-weight:900;letter-spacing:.03em;color:#fff;padding:10px 30px;
  background:linear-gradient(135deg,#0B44C4,#54A9FF 52%,#0B44C4);
  clip-path:polygon(0 0,100% 0,calc(100% - 15px) 50%,100% 100%,0 100%,15px 50%);
  box-shadow:0 9px 20px rgba(0,0,0,.38);text-shadow:0 2px 4px rgba(0,0,0,.35);
  animation:sgribbon 1.9s ease-in-out infinite}
.sg-spbub.red{background:linear-gradient(135deg,#B3001B,#FF7A5A 52%,#B3001B)}
.sg-spbub.green{background:linear-gradient(135deg,#046C3C,#5FE39B 52%,#046C3C)}
.sg-spbub i{font-style:normal;display:inline-block;margin:0 6px;animation:sgspark 1.1s ease-in-out infinite}
.sg-spbub i:last-child{animation-delay:.55s}
@keyframes sgribbon{0%,100%{transform:translateX(-50%) rotate(-4deg) translateY(0)}50%{transform:translateX(-50%) rotate(-4deg) translateY(-9px)}}
@keyframes sgspark{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}
.sg-tile.lock{cursor:default}
.sg-tile.lock .sg-img,.sg-tile.lock .sg-noimg{filter:grayscale(1) drop-shadow(0 6px 6px rgba(0,0,0,.26))}
.sg-tile.lock .sg-num{color:rgba(255,255,255,.55)}
/* 進む先のマスは、光の玉が着くまでモノクロのまま待たせ、着いた瞬間にカラーへ戻す。
   いまのマス(.now)には揺れ＋光彩のアニメが常時かかっているので、それより強い指定で上書きする（メール指示 2026-07-31） */
.sg-tile.now .sg-img.preadv,.sg-tile .sg-img.preadv{filter:grayscale(1) drop-shadow(0 6px 6px rgba(0,0,0,.26));animation:none}
.sg-tile.now .sg-img.recolor,.sg-tile .sg-img.recolor{animation:sgRecolor 1.6s ease-out both}
.sg-lap{position:absolute;left:0;width:554px;text-align:center;pointer-events:none}
.sg-lap span{display:inline-block;background:rgba(0,0,0,.4);color:#fff;font-size:12px;font-weight:900;letter-spacing:.14em;padding:4px 14px}
.sg-toast{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);background:rgba(0,0,0,.84);color:#fff;font-size:14px;font-weight:800;padding:11px 20px;z-index:600;pointer-events:none;animation:d5ack 1.9s ease forwards}
/* 現在地（＝スタートのマス）へ戻るボタン。すごろくを動かして「いまここ」を見失ったときだけ出る（画面のダブルタップでも戻れる）。
   下端56pxはマスクで薄くなるので、そこには掛からない高さに置く */
/* z-indexはマスより上（マスは遠近に応じて4〜44が入る）。sg-wrap自身が重ね合わせ文脈なので外へは影響しない */
/* 中身は文字を置かず、Googleマップの現在地ボタンと同じくコンパスの針アイコンだけ（黒座布団＋黄色枠は据え置き） */
/* 現在地／今日の5問／今日のトレンドの3ボタンは、すごろくの器(.sg-wrap＝左右24px内側・はみ出しを切る)ではなく
   スライド直下に置く。こうするとアイコン群(.reward-rail)と同じ左右14pxに揃えられる。
   bottom:12px は旧「器の中で bottom:66px」と同じ高さ（器は下端が54px下に出ている） */
/* 丸の大きさ(68px)と横位置(14px)は右のアイコン群(.reward-rail .rr-btn)に揃える */
.sg-home{position:absolute;right:14px;bottom:12px;z-index:60;border:none;padding:0;width:68px;height:68px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#111;color:#fff;cursor:pointer;font-family:inherit;
  box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 4px rgba(255,196,0,.95);
  opacity:0;pointer-events:none;transform:translateY(12px) scale(.86);transition:opacity .22s ease,transform .22s cubic-bezier(.34,1.5,.5,1)}
.sg-home svg{width:32px;height:32px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.sg-home.on{opacity:1;pointer-events:auto;transform:none}
.sg-home.on:active{transform:scale(.9)}
/* 今日の5問（すごろく下・中央のカプセル）。現在地ボタンと同じ高さに置く。
   ROOMを切り替えても動かないよう、スライドの中ではなく home-wrap 直下のフロート1組にしてある */
.sg-d5{position:absolute;left:50%;bottom:var(--fbtm);z-index:60;border:none;padding:11px 26px 13px;border-radius:999px;
  background:#fff;color:#111;font-size:26px;font-weight:900;letter-spacing:.08em;white-space:nowrap;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 18px rgba(0,0,0,.55);transform:translateX(-50%);transition:transform .16s ease,opacity .2s ease}
.sg-d5:active{transform:translateX(-50%) scale(.93)}
/* 文字はスタートボタンと同じく1文字ずつ回転 */
.sg-d5 .sgd5-t span{display:inline-block;animation:sbchar 3s ease-in-out infinite;backface-visibility:hidden}
.sg-d5 .sgd5-t span:nth-child(2){animation-delay:.12s}
.sg-d5 .sgd5-t span:nth-child(3){animation-delay:.24s}
.sg-d5 .sgd5-t span:nth-child(4){animation-delay:.36s}
.sg-d5 .sgd5-t span:nth-child(5){animation-delay:.48s}
.sg-d5 .d5-b{position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:#FF8A00;color:#fff;
  font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}
/* 朝の部・夜の部を消化して挑戦できないあいだは、カプセルをやめて左のアイコン群(.reward-rail-left .rr-btn)と
   同じ丸（68px・白・同じ影）にし、横位置(left:14px)も縦位置(bottom:66px＝現在地ボタンと同じ)も揃える。
   中央のカプセル位置は「今日のトレンド問題」ボタン(.sg-trend)が引き継ぐ */
.sg-d5.d5-off{left:14px;bottom:var(--fbtm);transform:none;width:68px;height:68px;padding:0;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:#fff;color:#9a9a9a;letter-spacing:0;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sg-d5.d5-off:active{transform:scale(.93)}
.sg-d5.d5-off .sgd5-t{display:none}
.sg-d5 .sgd5-mini{display:none}
.sg-d5.d5-off .sgd5-mini{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.sg-d5.d5-off .sgd5-mini i{font-style:normal;font-size:19px;color:#C9C9C9}
.sg-d5.d5-off .sgd5-mini b{font-size:11px;font-weight:900;color:#9a9a9a}
/* 今日のトレンド問題（中央カプセル・黄色）。5問を消化した日だけ出る */
.sg-trend{position:absolute;left:50%;bottom:var(--fbtm);z-index:60;border:none;padding:11px 22px 13px;border-radius:999px;
  background:#FFC400;color:#2b1a00;font-size:22px;font-weight:900;letter-spacing:.06em;white-space:nowrap;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 18px rgba(0,0,0,.55);transform:translateX(-50%);display:none}
.sg-trend.on{display:block}
.sg-trend:active{transform:translateX(-50%) scale(.93)}
.sg-trend .sgtr-t span{display:inline-block;animation:sbchar 3s ease-in-out infinite;backface-visibility:hidden}
.sg-trend .sgtr-t span:nth-child(2){animation-delay:.1s}
.sg-trend .sgtr-t span:nth-child(3){animation-delay:.2s}
.sg-trend .sgtr-t span:nth-child(4){animation-delay:.3s}
.sg-trend .sgtr-t span:nth-child(5){animation-delay:.4s}
.sg-trend .sgtr-t span:nth-child(6){animation-delay:.5s}
.sg-trend .sgtr-t span:nth-child(7){animation-delay:.6s}
.sg-trend .tr-b{position:absolute;right:-2px;top:-2px;width:22px;height:22px;border-radius:50%;background:#E0831A;color:#fff;
  font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1}
/* トレンドも消化したら、5問ボタン(left:14px)の1つ右(14+68+8=90px)へ引っ込めて同じ丸にする */
.sg-trend.tr-off{left:90px;bottom:var(--fbtm);transform:none;width:68px;height:68px;padding:0;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:#EDEDED;color:#9a9a9a;letter-spacing:0;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sg-trend.tr-off:active{transform:scale(.93)}
.sg-trend.tr-off .sgtr-t{display:none}
.sg-trend .sgtr-mini{display:none}
.sg-trend.tr-off .sgtr-mini{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.sg-trend.tr-off .sgtr-mini i{font-style:normal;font-size:19px;color:#C9C9C9}
.sg-trend.tr-off .sgtr-mini b{font-size:10px;font-weight:900;color:#9a9a9a}
/* --- 消化直後の演出 --- */
/* 中央のカプセルが横に伸びながら縮み、左のアイコンへ吸い込まれるように収まる（--flyx＝中央から今の位置までの距離） */
@keyframes sgFlyLeft{
  0%{transform:translateX(var(--flyx)) scaleX(1.9) scaleY(.86)}
  46%{transform:translateX(calc(var(--flyx) * .34)) scaleX(2.15) scaleY(.6)}
  78%{transform:translateX(-6px) scaleX(.86) scaleY(1.12)}
  100%{transform:none}
}
.sg-fbtn.sg-fly{animation:sgFlyLeft .62s cubic-bezier(.3,.9,.32,1) both}
/* 引っ込んだ後に、トレンドボタンがキラっと登場する */
@keyframes sgPopIn{0%{opacity:0;transform:translateX(-50%) scale(.2)}62%{opacity:1;transform:translateX(-50%) scale(1.14)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
.sg-trend.tr-pop{animation:sgPopIn .46s cubic-bezier(.34,1.5,.5,1) both}
@keyframes sgSparkle{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9) rotate(120deg)}}
.sg-spark{position:absolute;left:50%;top:50%;width:150px;height:150px;pointer-events:none;z-index:61;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,224,120,.55) 26%,rgba(255,196,0,0) 62%);
  animation:sgSparkle .72s ease-out forwards}
.home-wrap.status .sg-wrap,.home-wrap.hiderail .sg-wrap,
.home-wrap.status .sg-fbtn,.home-wrap.hiderail .sg-fbtn{opacity:0;pointer-events:none;transition:opacity .3s ease}

/* 1周クリアの到達演出 */
.lapdone{position:fixed;inset:0;z-index:560;background:rgba(0,0,0,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:13px;padding:28px 20px;opacity:0;transition:opacity .3s ease;text-align:center}
.lapdone.on{opacity:1}
.lap-kicker{font-size:12px;font-weight:900;letter-spacing:.3em;color:#FFC400}
.lap-title{font-size:26px;font-weight:900;color:#fff;line-height:1.3;text-shadow:0 0 22px rgba(255,196,0,.6)}
.lap-title b{color:#FFC400;font-size:40px}
.lap-sub{font-size:13.5px;font-weight:800;color:rgba(255,255,255,.9);line-height:1.9}
.lap-sub b{color:#FFD84D}

/* --- ポップアップ（画面いっぱいのモーダルではなく、ボタンから伸びる吹き出し） --- */
#d5-modal{position:fixed;inset:0;z-index:400;display:none;background:rgba(0,0,0,.34)}
#d5-modal.on{display:block}
.d5-card{position:absolute;left:0;top:0;width:274px;max-width:88vw;background:#fff;color:#1a1a1a;border-radius:20px;
  padding:14px 14px 13px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.d5-card::after{content:"";position:absolute;left:var(--tx,50%);bottom:-11px;margin-left:-11px;border:11px solid transparent;border-top-color:#fff;border-bottom:0}
.d5-card.flip::after{bottom:auto;top:-11px;border-top:0;border-bottom-color:#fff;border-bottom-width:11px}
/* 左端のボタン（消化後の丸い「今日の5問」）から出したときは、しっぽを左下向きにしてボタンを指す */
.d5-card.edge-l::after{border-top-color:#fff;border-right-color:#fff;border-left-color:transparent}
.d5-card.edge-r::after{border-top-color:#fff;border-left-color:#fff;border-right-color:transparent}
/* --- 今日のトレンド問題（黄色いカプセルから出す吹き出し） --- */
.tr-topic{font-size:11.5px;font-weight:800;color:#777;margin-top:3px;line-height:1.4}
.tr-list{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:9px 0 10px}

.tr-w b{display:block;font-size:14px;font-weight:900;color:#1a1a1a}
.tr-w span{display:block;font-size:9.5px;font-weight:800;color:#8a7a4a}
.d5-go.tr-go{background:#FFC400;color:#2b1a00}

.d5-h{font-size:16px;font-weight:900;letter-spacing:.04em}
.d5-close{position:absolute;right:2px;top:2px;width:38px;height:38px;border:none;background:transparent;color:#999;font-size:20px;font-weight:900;cursor:pointer;line-height:1;font-family:inherit;border-radius:50%;display:flex;align-items:center;justify-content:center}
.d5-close:active{background:rgba(0,0,0,.1)}

.d5-slot .d5-sl{font-size:11px;font-weight:900;color:#777;line-height:1.5}

.d5-go:active{background:#1c1c1c}
.d5-wait{background:#F6F6F6;padding:9px}
.d5-wait .d5-wt{font-size:11px;font-weight:800;color:#777}
.d5-wait .d5-wv{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;color:#1a1a1a;margin-top:2px}

.d5-again{font-size:11.5px;font-weight:800;color:#C24A00;background:#FFF7E0;padding:6px 5px;margin-bottom:8px;line-height:1.45;text-wrap:balance}
/* --- 回答受付フラッシュ（正誤は出さない） --- */
#qstage .choice.d5-pick{box-shadow:0 0 0 4px #FFC400 inset}

.d5r-row{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);color:#1a1a1a;padding:7px 11px;
  opacity:.3;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease,box-shadow .2s ease}
.d5r-row.shown{opacity:1;transform:none}
.d5r-row.on-now{box-shadow:0 0 0 3px #FFC400}
.d5r-row .d5r-mid{filter:blur(6px);transition:filter .3s ease} /* 未判定の問題は先読みできないようぼかす */

.d5r-no{width:24px;flex:0 0 auto;font-size:11.5px;font-weight:900;color:#999}
.d5r-mid{flex:1;min-width:0}
.d5r-q{font-size:18.5px;font-weight:900;line-height:1.2;color:#222;word-break:break-word}
.d5r-a{font-size:13.5px;font-weight:800;color:#444;margin-top:1px;line-height:1.35;word-break:break-word}
.d5r-your{font-size:11.5px;font-weight:800;color:#999;margin-top:2px;line-height:1.3;word-break:break-word}
.d5r-your i{font-style:normal;color:#C0392B}

.d5r-row.judged .d5r-spk{opacity:.85}
.d5r-row.speaking{box-shadow:0 0 0 3px #2F6FE0}
.d5r-mk{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:900;line-height:1;opacity:0;transform:scale(2.4) rotate(-14deg)}
.d5r-row.judged .d5r-mk{animation:d5stamp .42s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes d5stamp{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}60%{opacity:1;transform:scale(.88) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.d5r-mk.o{color:#FF3B3B}.d5r-mk.x{color:#2F6FE0}.d5r-mk.u{color:#8a8a8a}.d5r-mk.t{color:#C79A0C}
.d5r-score{opacity:0;transform:translateY(6px);transition:opacity .45s ease,transform .45s ease}
.d5r-score.shown{opacity:1;transform:none}

.d5-rare .d5-word{position:relative;margin-bottom:26vh;font-size:min(58px,13vw);font-weight:900;letter-spacing:.22em;color:#fff;white-space:nowrap;
  text-shadow:0 0 18px rgba(255,200,60,.95),0 0 46px rgba(255,150,0,.8);animation:d5word 1.7s cubic-bezier(.15,1.4,.3,1) forwards}
@keyframes d5word{0%{opacity:0;transform:scale(2.6) rotate(-8deg)}20%{opacity:1;transform:scale(1) rotate(0)}74%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(1.14)}}
.d5-spk{position:absolute;left:50%;top:37%;width:10px;height:10px;border-radius:50%;background:#FFE79A;box-shadow:0 0 12px 4px rgba(255,214,90,.9);animation:d5spk 1.3s ease-out forwards}
@keyframes d5spk{0%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
</style>

/* localStorageのJSONは「中身が変わっていなければ解析結果を使い回す」。
 * 学習が進むとstats/履歴は各1MB近くになり、ホーム表示1回で合計27MB・放置中も30秒ごとに約15MBを
 * 解析し直していた。PCのChromeでは一瞬でも、LINE等アプリ内ブラウザは解析とGCが桁違いに重く、
 * ホーム復帰で画面が止まる主因になっていた。生文字列が同じ間は再解析しないことで根本を断つ。
 * （保存すると生文字列が変わるので自動で作り直される＝別タブ・復元でも取りこぼしなし） */
const _lsJsonCache={};
function _lsJSON(key,fallback){
  let raw=null;try{raw=localStorage.getItem(key);}catch(e){}
  if(raw==null||raw==="")return fallback();
  const c=_lsJsonCache[key];
  if(c&&c.raw===raw)return c.val;
  let v;try{v=JSON.parse(raw);}catch(e){v=null;}
  if(v==null||typeof v!=="object")v=fallback();
  _lsJsonCache[key]={raw,val:v};
  return v;
}

const RANK_VAL={S:5,A:4,B:3,C:2,D:1};

  return all[id]||{sectionId:id,level:curLevel,sectionNumber:n,wordIds:LEVEL_SECTIONS[curLevel][n]||[],bestRank:null,updatedAt:""};
}
function updateSectionRank(n,rank){
  const all=loadSections(),id=secId(n),rec=all[id]||getSectionRec(n);
  rec.recentRanks=((rec.recentRanks||[]).concat(rank)).slice(-5); // 直近ランク履歴（ホームの小丸用）
  if(!rec.bestRank||RANK_VAL[rank]>RANK_VAL[rec.bestRank])rec.bestRank=rank; // 最高は上回った時のみ
  rec.updatedAt=new Date().toISOString();all[id]=rec;saveSections(all);
}

function specialBonusFor(dt){

  if(!s.has(dayKey(d.getTime())))d.setDate(d.getDate()-1); // 今日まだ未完了なら昨日から数える（今日やれば+1）
  let n=0,grace=false;
  for(;;){
    if(s.has(dayKey(d.getTime()))){n++;d.setDate(d.getDate()-1);continue;}
    if(!grace&&n>0){ // ストリーク保険：1日だけの途切れは継続扱い（1ストリークにつき1回）

  }

}

  try{
    const KEY="kwt_histprune_v1",today=dayKey(Date.now());

    localStorage.setItem(KEY,today);

    const cutoff=Date.now()-90*86400000;

function flyClaimToBox(srcRect,cat){

  const sx=srcRect.left+srcRect.width/2, sy=srcRect.top+srcRect.height/2;

      {left:midX+"px",top:peakY+"px",width:"96px",height:"96px",opacity:1,offset:.42,easing:"cubic-bezier(.55,0,.85,.4)"}, // 頂点で一瞬ため

/* ルーム番号の丸ページャー：左右にルームを並べ、選択中を中央に。切替中だけ表示し復習どき/カウントダウンは一時的にフェードで隠す */
let _pagerT=null;
function buildRoomPager(){
  const p=document.getElementById("room-pager");if(!p)return;
  const count=LEVEL_INFO[curLevel].count;
  let h=`<div class="rp-dot pq" data-sec="pq" onclick="pagerJump('pq')" aria-label="ルーム プリQQ">★</div>`;
  for(let n=1;n<=count;n++)h+=`<div class="rp-dot" data-sec="${n}" onclick="pagerJump(${n})">${String(n).padStart(2,"0")}</div>`;
  p.innerHTML=h;
}
function syncRoomPager(){
  const p=document.getElementById("room-pager");if(!p||!p.children.length)return;
  const el=document.getElementById("hv-rooms");
  const max=LEVEL_INFO[curLevel].count+1;
  const frac=el?Math.min(Math.max(el.scrollLeft/602,0),max):(_onSpecial?1:curSection+1); // 連続値（0=難易度,1=特別,2=ROOM1…）
  const dotPos=Math.max(0,frac-1); // ドット連続位置（0=特別/pq, 1=ROOM1…）。左右スワイプ中も滑らかに追従
  const near=Math.round(dotPos); // 最寄りドットをハイライト
  [...p.children].forEach((d,i)=>d.classList.toggle("cur",i===near));
  // 隣り合うドットのoffsetLeftを線形補間して連続的に中央寄せ（〇がスクロールに連動）
  const lo=Math.max(0,Math.min(p.children.length-1,Math.floor(dotPos))),hi=Math.min(p.children.length-1,lo+1);
  const a=p.children[lo],b=p.children[hi];if(!a)return;
  const center=(el2)=>el2.offsetLeft+el2.offsetWidth/2;
  const c=center(a)+(center(b)-center(a))*(dotPos-lo);
  p.scrollLeft=c-p.clientWidth/2;
}
/* ROOMは左右スワイプで切りかわる、と分かるまでのヒント（1度でも切りかえたら二度と出さない） */

/* ルームメニューの3面ローテーション：語数/％/ランク(0) → おすすめ単語(1) → PWRグラフ(2) → … を回転入替 */
let _recoTimer=null,_recoFace=0,_recoIdx=0;
function pickRecoWord(n){
  const ids=(n==="pq")?PRIQQ.ids:(LEVEL_SECTIONS[curLevel][n]||[]);
  if(!ids||!ids.length)return null;
  const st=loadStats(),now=Date.now();
  const due=ids.filter(id=>{const s=st[id];return s&&s.nextReviewAt&&new Date(s.nextReviewAt).getTime()<=now;}); // 復習どき優先
  const unseen=ids.filter(id=>{const s=st[id];return !s||!s.hasSeen;}); // 次に未学習
  const pool=due.length?due:(unseen.length?unseen:ids);
  const id=pool[_recoIdx%pool.length];_recoIdx++;
  return WORD_BY_ID[id]||null;
}
/* そのROOMの直近テスト得点(0-100)を古い順に返す（PWRグラフ用）。
 * 3秒ごとの面回転から呼ばれるため、履歴全走査を毎回やらずROOM単位でキャッシュする（saveAnswerで無効化） */
let _roomSeriesCache={};
function roomScoreSeries(n){
  const ck=curLevel+"|"+n;if(_roomSeriesCache[ck])return _roomSeriesCache[ck];
  const ids=new Set((n==="pq")?PRIQQ.ids:(LEVEL_SECTIONS[curLevel][n]||[])),byTest={};
  loadHistory().forEach(r=>{if(r.testId&&ids.has(r.wordId))(byTest[r.testId]=byTest[r.testId]||[]).push(r);});
  const out=Object.values(byTest).map(a=>({at:a[a.length-1].answeredAt,total:Math.round(a.reduce((x,r)=>x+(r.score||0),0))}))
    .sort((a,b)=>a.at.localeCompare(b.at)).slice(-8).map(t=>Math.max(0,Math.min(100,t.total)));
  _roomSeriesCache[ck]=out;return out;
}
function _curSlideInner(){
  const el=document.getElementById("hv-rooms");if(!el)return null;
  return _onSpecial?el.querySelector(".pq-slide .slide-inner"):el.querySelector(`.room-slide[data-n="${curSection}"] .slide-inner`);
}
function _clearReco(){document.querySelectorAll(".slide-inner.face-word,.slide-inner.face-pwr").forEach(x=>x.classList.remove("face-word","face-pwr"));_recoFace=0;}
function _roomTint(n){return (n==="pq")?"#ffe3f1":roomBg(n);} // パネル背景＝そのROOMの色
function roomRecoTick(){
  if(!document.getElementById("s-home").classList.contains("on")||_listMode||_statusMode){_clearReco();return;} // ホームのルーム表示中のみ
  const si=_curSlideInner();if(!si)return;
  const key=_onSpecial?"pq":curSection;
  _recoFace=(_recoFace+1)%3; // 0=stats/1=word/2=pwr
  si.classList.remove("face-word","face-pwr");
  // 各面は個別背景なし（透明）。ルームメニュー全体の白透明座布団(.rmenu-bg)がそのまま見える
  if(_recoFace===1){
    const w=pickRecoWord(key);if(!w){_recoFace=0;return;}
    const rr=si.querySelector(".rmenu-reco");if(!rr)return;
    const im=(typeof WORD_IMG!=="undefined"&&WORD_IMG[w.ko])?`<img class="rr-img" src="${WORD_IMG[w.ko]}" alt="">`:""; // 左側に単語画像
    rr.innerHTML=`${im}<div class="rr-txt"><div class="rr-ko">${esc(w.ko)}</div><div class="rr-ja">${esc(w.ja)}</div></div>`;
    si.classList.add("face-word");
  }else if(_recoFace===2){
    const rp=si.querySelector(".rmenu-pwr");if(!rp)return;
    const cur=(key==="pq")?(PRIQQ.total?Math.round(PRIQQ.learned/PRIQQ.total*100):0):roomInfoFor(key).pwr;
    let series=roomScoreSeries(key);if(!series.length)series=[cur]; // 履歴が無ければ現在値のみ
    const bars=series.map(v=>`<div class="rmpwr-bar" style="height:${Math.max(6,v)}%"></div>`).join("");
    rp.innerHTML=`<div class="rmpwr-top"><span class="rp-lab">PWR</span><b>${cur}%</b></div><div class="rmpwr-bars">${bars}</div>`;
    si.classList.add("face-pwr");
  } // face 0 は何も付けず語数/％/ランクへ戻る
}

   3面ローテーションを止め、語数/％/ランクの面だけを静止表示する。
   ※各面を作る処理（roomRecoTick／pickRecoWord／roomScoreSeries）はそのまま残してあるので、
     ROOM_RECO_ROTATE を true に戻せば従来どおり3秒ごとの入替が復活する */

function mapSwitchLevel(l){if(l!==curLevel)switchLevel(l);openRoomMap();} // マップ内の初級/中級トグル（表示も切替）
function buildRoomSlides(){
  const el=document.getElementById("hv-rooms");if(!el)return;
  const count=LEVEL_INFO[curLevel].count;
  // 先頭(ROOM01の左)に難易度切替スライド
  const levelSlide=`<div class="room-slide level-slide" data-n="0" style="background:${LEVEL_SLIDE_BG}">
    <div class="lv-pick">
      <div class="lv-cap">LEVEL</div>
      <button class="lvbtn ${curLevel==="beginner"?"on":""}" onclick="switchLevel('beginner')">初級</button>
      <button class="lvbtn ${curLevel==="middle"?"on":""}" onclick="switchLevel('middle')">中級</button>
    </div>
  </div>`;
  // ROOM01の左（難易度スライドの右）に特別ルーム プリQQ。通常ROOMのレイアウトを流用しプリティー化
  const pqrate=PRIQQ.total?Math.round(PRIQQ.learned/PRIQQ.total*100):0;
  const _pqc=loadCards();const pqlearned=PRIQQ.ids.filter(id=>(_pqc[id]||0)>0).length; // カードは1回だけ読む（語ごとに読み直さない）
  const specialSlide=`<div class="room-slide pq-slide" data-n="pq" style="background:#ffe3f1">
    <div class="slide-inner">
      <div class="rmenu-clip">
      <div class="rmenu-bg" onclick="roomMenuTap('pq')"></div>
      <div class="hv-roomlabel" onclick="roomMenuTap('pq')">ROOM</div>
      <div class="hv-roomno" onclick="roomMenuTap('pq')" style="left:60px">プリQQ</div>
      <div class="hv-learned">${pqlearned}<span class="unit">語</span></div>
      <div class="gauge hv-wordsg"><div class="gfill" style="width:${Math.round(pqlearned/PRIQQ.total*100)}%"></div></div>
      <div class="hv-roompwr">${pqrate}<span class="unit">%</span></div>
      <div class="gauge hv-roomg"><div class="gfill" style="width:${pqrate}%"></div></div>
      <div class="pq-badge">★ SPECIAL</div>
      <div class="rmenu-reco"></div>
      <div class="rmenu-pwr"></div>
      </div>
      ${_listMode?roomListHTMLFromIds(PRIQQ.ids):`<div class="pq-main" onclick="roomMenuTap('pq')">${pqMainInner()}<div class="pq-ribbon">${esc(PRIQQ.name)}</div></div>`}
    </div>
  </div>`;
  el.innerHTML=levelSlide+specialSlide+Array.from({length:count},(_,i)=>{
    const n=i+1,nn=String(n).padStart(2,"0"),ri=roomInfoFor(n);
    const circ=(cls,rank)=>rank?`<div class="${cls}" style="background:${RANK_COLORS[rank]||"#555"};cursor:pointer" onclick="openRoomHistory(${n})">${rank}</div>`:""; // ランク円タップ=過去履歴一覧
    // 直近=右の大きい丸 / 1つ前=真ん中(小) / 2つ前=左(小)
    const arr=ri.recent;
    const rLast=arr.length>=1?arr[arr.length-1]:null;
    const rPrev1=arr.length>=2?arr[arr.length-2]:null;
    const rPrev2=arr.length>=3?arr[arr.length-3]:null;
    const big=rLast?circ("rank-b",rLast):`<div class="rank-b" style="background:rgba(0,0,0,.22);cursor:pointer" onclick="openRoomHistory(${n})">-</div>`;
    return `<div class="room-slide" data-n="${n}" style="background:${roomBg(n)}">
      <div class="slide-inner">
      <div class="rmenu-clip">
      <div class="rmenu-bg" onclick="roomMenuTap(${n})"></div>
      <div class="hv-roomlabel" onclick="roomMenuTap(${n})">ROOM</div>
      <div class="hv-roomno" onclick="roomMenuTap(${n})">${nn}</div>
      <div class="hv-learned">${ri.learned}<span class="unit">語</span></div>
      <div class="gauge hv-wordsg"><div class="gfill" style="background:#00FFFF;width:${Math.round(ri.learned/ri.total*100)}%"></div></div>
      <div class="hv-roompwr">${ri.pwr}<span class="unit">%</span></div>
      <div class="gauge hv-roomg"><div class="gfill" style="background:#00FF37;width:${ri.pwr}%"></div></div>
      ${rPrev2?circ("rank-s",rPrev2):""}
      ${rPrev1?circ("rank-s rank-s1",rPrev1):""}
      ${big}
      <div class="rmenu-reco"></div>
      <div class="rmenu-pwr"></div>
      </div>
      ${_listMode?(Math.abs(n-curSection)<=1?roomListHTML(n):`<div class="slide-list wb-list" data-lazy="${n}"></div>`)
        :(Math.abs(n-curSection)<=1?sgBoardHTML(n):`<div class="sg-wrap" data-sglazy="${n}"></div>`)} <!-- すごろくは近傍3ROOMだけ実描画（全ROOM分を持つとページが落ちる） -->
      </div>
    </div>`;
  }).join("");
  if(!_listMode)requestAnimationFrame(()=>{sgHydrateAll();sgScrollToCurrent(curSection);}); // 道と遠近を計算し、現在のマスが見える位置から始める
  if(!el.dataset.bound){
    el.dataset.bound="1";
    // ホーム: 一定量引くと発動するプルダウン式（上引き=単語帳 / 下引き=ステータス）。単語帳内: 最上部からの下引きでホームへ戻る
    let _ty=null,_tx=null,_plList=null,_plBase=null,_homeDir=null,_sgDrag=false,_sgSwiped=false;
    el.addEventListener("touchstart",e=>{
      _ty=e.touches[0].clientY;_tx=e.touches[0].clientX;_plBase=null;_homeDir=null;_sgSwiped=false;
      _sgDrag=!!(e.target&&e.target.closest&&e.target.closest(".sg-scroll")); // すごろくの中から始まった縦ドラッグは素直に縦スクロールさせる
      _plList=_listMode?(_onSpecial?el.querySelector(".pq-slide .slide-list"):el.querySelector(`.room-slide[data-n="${curSection}"] .slide-list`)):null;
    },{passive:true});
    el.addEventListener("touchmove",e=>{
      if(_ty==null||_statusMode)return;
      const y=e.touches[0].clientY,dy=y-_ty,dx=e.touches[0].clientX-_tx;
      // すごろくの上：縦はそのまま縦スクロール。横は自前で判定して隣のページへ
      // （.sg-scrollがtouch-action:pan-yなのでブラウザ側の横スクロールが親に伝わらず、従来はここで左右スワイプが効かなかった）
      if(_sgDrag){
        if(!_sgSwiped&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.4){_sgSwiped=true;stepRoom(dx<0?1:-1);}
        return;
      }
      if(_listMode){
        // 単語帳の縦スクロールが最上部(scrollTop<=0)のとき、下方向の引っ張りで戻るヒント
        if(_plList&&_plList.scrollTop<=0&&dy>0&&Math.abs(dy)>Math.abs(dx)){
          if(_plBase==null){_plBase=y;return;}
          showPullHint(y-_plBase,"↓ さらに引くとホームに戻る","↓ 離してホームに戻る","top");
        }else{_plBase=null;hidePullHint();}
        return;
      }
      // ホーム: 縦引きでヒントを育てる（横スクロールと区別。一定量で発動）
      if(Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>10){
        _homeDir=dy<0?"up":"down";
        if(_homeDir==="up")showPullHint(-dy,"↑ さらに引くと単語帳","↑ 離して単語帳へ","bottom");
        else showPullHint(dy,"↓ さらに引くとステータス","↓ 離してステータスへ","top");
      }else{_homeDir=null;hidePullHint();}
    },{passive:true});
    el.addEventListener("touchend",()=>{
      if(_listMode){if(_plBase!=null){const go=_pullVal>=90;hidePullHint();if(go)exitListMode();}}
      else if(_homeDir){const go=_pullVal>=90,dir=_homeDir;hidePullHint();if(go){dir==="up"?enterListMode():enterStatusMode();}}
      _ty=null;_plBase=null;_plList=null;_homeDir=null;_sgDrag=false;_sgSwiped=false;
    });
    // ステータス中: 上に引っ張るとホームへ戻る（引っ張り式・90px超で発動）
    const hw=document.getElementById("homewrap");
    if(hw&&!hw.dataset.gbound){
      hw.dataset.gbound="1";
      let sy=null,sx=null,sPull=false;
      hw.addEventListener("touchstart",e=>{sy=e.touches[0].clientY;sx=e.touches[0].clientX;sPull=false;},{passive:true});
      hw.addEventListener("touchmove",e=>{
        if(sy==null||!_statusMode)return;
        const dy=e.touches[0].clientY-sy,dx=e.touches[0].clientX-sx;
        if(dy<0&&Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>10){
          sPull=true;showPullHint(-dy,"↑ さらに引くとホームへ","↑ 離してホームへ","bottom");
        }else if(sPull){sPull=false;hidePullHint();}
      },{passive:true});
      hw.addEventListener("touchend",()=>{
        if(sPull){const go=_pullVal>=90;hidePullHint();if(go)exitStatusMode();}
        sy=null;sPull=false;
      });
    }
    el.addEventListener("scroll",()=>{
      // スライド順: idx0=難易度 / idx1=特別ルーム プリQQ / idx>=2=ROOM(idx-1)
      const idx=Math.min(Math.max(Math.round(el.scrollLeft/602),0),LEVEL_INFO[curLevel].count+1);
      const onSp=idx===1;_onSpecial=onSp;
      document.getElementById("homewrap").classList.toggle("pq-active",onSp);
      applyBgAll(idx===0?LEVEL_SLIDE_BG:(onSp?"#ffe3f1":roomBg(idx-1)));
      syncRoomArrows(); // 両端では進めない側の三角を消す
      maybeDismissRoomHint(idx); // 隣のROOMへ動けた＝スワイプのヒントはもう要らない
      if(idx>=1)showRoomPager(); // ルーム切替中は丸ページャーを表示（難易度スライドは除く）
      _clearReco(); // 切替時は前スライドのおすすめ表示を戻す
      clearTimeout(_roomScrollT);
      _roomScrollT=setTimeout(()=>{
        const i=Math.min(Math.max(Math.round(el.scrollLeft/602),0),LEVEL_INFO[curLevel].count+1);
        if(i>=2){const n=i-1;if(n!==curSection){curSection=n;applyHomeBg();saveLastRoom();attachHomeRain();fillNearbyRoomLists();fillNearbyBoards();}} // 玉の山も新ROOMへ移す＋近傍の単語帳/すごろくを実描画
      },120);
    });
  }
  el.scrollLeft=_onSpecial?602:(curSection+1)*602; // 特別ルーム選択中は特別スライド(index1=602)、通常はROOM n(index n+1)
  buildRoomPager(); // 丸ページャーを現在の難易度のルーム構成で組み直す
  syncRoomArrows(); // 難易度切替でROOM数が変わるので、両端の三角の出し分けも組み直す
}
/* 602px基準で比例スケール（PCは等倍上限・中央寄せ） */
function scaleHome(){
  const el=document.getElementById("homewrap");if(!el)return;
  // 機種ごとに幅・高さ（セーフエリア控除後）の両方に収まるスケールを採用（下詰まり防止）
  const app=document.querySelector(".app");
  const cs=app?getComputedStyle(app):null;
  const padV=cs?((parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0)):0;
  // iOS Safariの下部ツールバー(フッター)を考慮: visualViewportの実高さ−安全マージン12px
  const vvh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||1178;
  // 広告フッター表示中はその高さ分だけ縮めて、スタートボタンが隠れないようにする
  const adf=document.getElementById("ad-footer");
  const adH=(adf&&document.body.classList.contains("has-adfooter"))?adf.offsetHeight:0;
  const availH=Math.max(300,vvh-padV-12-adH);
  const appW=app?app.clientWidth:Math.min(window.innerWidth||602,602);
  const s=Math.min(appW/602,availH/1178,1);
  el.style.transform=`scale(${s})`; // #s-homeのjustify-content:center+origin:top centerで水平中央は自動
  el.style.setProperty("--inv",String(1/s)); // スケール補正係数（ステータス内をPWR詳細ページと同じ実寸にする）
  document.documentElement.style.setProperty("--hs",String(s)); // ホーム外（結果画面のメーター等）でも同じ実寸を作るための縮小率
  el.style.marginBottom=`-${Math.round(1178*(1-s))}px`; // transformはレイアウト高を変えないため余白を回収
}
window.addEventListener("resize",scaleHome);
if(window.visualViewport)window.visualViewport.addEventListener("resize",scaleHome); // ツールバー出入りに追従

/* 「復習どき」タップ：期限が来ている単語だけで復習テストを開始（優先度順に12語） */
function startDueReview(){
  const s=loadStats(),now=Date.now(),due=[];
  Object.keys(s).forEach(id=>{
    const st=s[id];
    if(st&&st.hasSeen&&st.nextReviewAt&&new Date(st.nextReviewAt).getTime()<=now&&WORD_BY_ID[id])
      due.push({id,ps:priorityScore(WORD_BY_ID[id],st,now)});
  });
  if(!due.length)return; // 待機なし（表示も出ていない）
  due.sort((a,b)=>b.ps-a.ps);
  startTest(due.slice(0,12).map(x=>x.id));
}

let _homeNotice=null;
function showHomeNotice(n){
  const wrap=document.getElementById("homewrap");if(!wrap)return;
  // 連続日数アップは豪華演出。閉じたあとに「1マス進んだ」演出へつなぐ＝どの回でも必ず進んだことが見える（メール指示 2026-07-31）
  if(n.type==="streak"){_stepAfterCel=true;showStreakCelebration(loginStreak());return;}
  // プレゼント→新ステップ→（初回だけ）タイプ診断の紹介、の順に流す

/* ①プレゼントのアイコンから白い吹き出しを出す（全画面の黒ポップアップは廃止） */
function showPresentBubble(done){
  document.querySelectorAll(".pbub").forEach(e=>e.remove());
  const cat=PRES_CATS.find(c=>presentsAvailable(c)>0)||"rank";
  const target=document.getElementById("rr-"+cat);
  const el=document.createElement("div");el.className="pbub";el.textContent="🎁 プレゼントが届きました";
  document.body.appendChild(el);
  if(target){
    const r=target.getBoundingClientRect();
    el.style.top=Math.round(r.top+r.height/2-el.offsetHeight/2)+"px";
    el.style.left=Math.round(Math.max(8,r.left-el.offsetWidth-14))+"px";
    target.classList.remove("suck");void target.offsetWidth;target.classList.add("suck");
  }else{el.style.top="200px";el.style.left="20px";}
  updatePresent(); // 受け取り待ちの数バッジを更新
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>{el.remove();done&&done();},380);},1800);
}
/* ②「新しいステップに進みました」＋いまクリアしたマスの絵をモノクロ→カラーへ戻す */
function showStepAdvance(done){
  const bt=_lastBoardTile;
  let wait=0;
  if(bt){
    const sl=document.querySelector('.room-slide[data-n="'+bt.sec+'"]')||document;
    const from=sl.querySelector('.sg-tile[aria-label="マス'+bt.gidx+'"]');
    const to=sl.querySelector('.sg-tile[aria-label="マス'+(bt.gidx+1)+'"]');
    // 次のマスへ進めたときだけコマを飛ばす（同じマスのやり直しでは進んでいない）
    if(from&&to&&to.classList.contains("now"))wait=sgHopToNext(from,to);
    else{const im=from&&from.querySelector(".sg-img");if(im){im.classList.remove("recolor");void im.offsetWidth;im.classList.add("recolor");}}
  }
  const wrap=document.getElementById("homewrap");
  if(!wrap){done&&done();return;}
  setTimeout(()=>{
    document.querySelectorAll(".stepnote").forEach(e=>e.remove());
    const el=document.createElement("div");el.className="stepnote";el.textContent="✨ 新しいステップに進みました";
    wrap.appendChild(el);
    setTimeout(()=>{el.classList.add("out");setTimeout(()=>{el.remove();done&&done();},420);},2000);
  },wait);
}
/* クリアしたマス → 次のマス へ光の玉を飛ばし、着いた瞬間に絵をモノクロ→カラーへ戻して「ピラン」と光らせる。
   戻り値＝この演出にかかる時間(ms)。呼び出し側はそのぶん次の表示を待つ（メール指示 2026-07-31） */
const SG_HOP_MS=760;
function sgHopToNext(from,to){
  const im=to.querySelector(".sg-img");
  if(im){im.classList.remove("recolor");im.classList.add("preadv");} // 着くまではモノクロで待たせる
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  const ax=a.left+a.width/2,ay=a.top+a.height/2;
  const pin=document.createElement("div");pin.className="sg-adv";
  pin.style.left=Math.round(ax)+"px";pin.style.top=Math.round(ay)+"px";
  pin.style.setProperty("--dx",Math.round(b.left+b.width/2-ax)+"px");
  pin.style.setProperty("--dy",Math.round(b.top+b.height/2-ay)+"px");
  document.body.appendChild(pin);
  setTimeout(()=>{
    pin.remove();
    if(im){im.classList.remove("preadv");void im.offsetWidth;im.classList.add("recolor");}
    sgPirin(to);
    sfxStepUp();
  },SG_HOP_MS);
  return SG_HOP_MS+520;
}
/* 「ピラン」＝マスの上で輪と放射状の光がはじける */
function sgPirin(tile){
  const r=tile.getBoundingClientRect();
  const el=document.createElement("div");el.className="sg-pirin";
  el.style.left=Math.round(r.left+r.width/2)+"px";el.style.top=Math.round(r.top+r.height/2)+"px";
  el.innerHTML='<i class="sgp-ring"></i>'+Array.from({length:8},(_,i)=>`<i class="sgp-ray" style="--a:${i*45}deg"></i>`).join("");
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

  const code=d.complete?d.code:AXES.map((ax,i)=>d.axes[i].code||ax.R).join("");
  const job=(TYPE_INFO[code]||[""])[0]||"";
  const pages=[
    {ico:"🏠",h:"最初のカスタマイズが終わりました",s:"ここから先は<b>あなただけの部屋</b>です。<br>解くほど部屋が育って、単語カードが集まります。"},
    {ico:"🔍",h:"あなたのタイプを診断しました",

/* 今日学ぶべき単語の帯：忘却が進みPWR回復効率が高い語（urgent/review）を優先度順に12語流す */
function buildTodayBand(){
  const band=document.getElementById("today-band"),track=document.getElementById("tb-track");
  if(!band||!track)return;
  const stats=loadStats(),now=Date.now();
  const all=Object.keys(stats).map(id=>{
    const w=WORD_BY_ID[id];if(!w)return null;
    const st=getStat(id,stats);
    return{w,st,state:wordState(st,now),ps:priorityScore(w,st,now)};
  }).filter(Boolean);
  // PWR回復効率が高いurgent/reviewを最優先。12語に満たなければ他の学習済み語を優先度順に補充
  const pri=all.filter(x=>x.state==="urgent"||x.state==="review").sort((a,b)=>b.ps-a.ps);
  let picks=pri.slice(0,12);
  if(picks.length<12){
    const ids=new Set(picks.map(x=>x.w.id));
    picks=picks.concat(all.filter(x=>!ids.has(x.w.id)).sort((a,b)=>b.ps-a.ps).slice(0,12-picks.length));
  }
  // 初回（学習履歴ゼロ）は帯を空にせず「おすすめの単語」に切り替える。1語でも解けば以降は従来どおり
  const reco=!picks.length;
  if(reco)picks=recommendWords().map(w=>({w}));
  const lab=band.querySelector(".tb-label");
  if(lab)lab.textContent=reco?"おすすめの単語":"最近学んだ単語";
  if(!picks.length){band.style.display="none";_tbKey="";return;}
  band.style.display="block";
  const key=picks.map(x=>x.w.id).join(",");
  if(key===_tbKey&&track.childElementCount)return; // 内容が同じなら作り直さない（アニメーションを途切れさせない）
  _tbKey=key;
  // 語数が少ないとグループ幅<帯幅でループが破綻するため、8枚になるまで循環リピートして密度を確保
  const list=picks.slice();
  for(let i=0;list.length<8;i++)list.push(picks[i%picks.length]);
  const cards=list.map(x=>{
    const img=(typeof WORD_IMG!=="undefined"&&WORD_IMG[x.w.ko])?`<span class="tb-imgspace"></span><img class="tb-img" src="${WORD_IMG[x.w.ko]}" loading="lazy" alt="">`:"";
    return `<div class="tb-card" onclick="renderWordDetail(${x.w.id},'room')">${img}<div class="tb-ko">${esc(x.w.ko)}</div><div class="tb-ja">${esc(x.w.ja)}</div></div>`;
  }).join("");
  track.innerHTML=`<div class="tb-group">${cards}</div><div class="tb-group">${cards}</div>`; // 同一グループ2連結
}
